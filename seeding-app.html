  const t=(text||'').toLowerCase();
  return (claims||[]).filter(c=>c.active!==false && c.cum_tu && t.includes(c.cum_tu.toLowerCase()));

function fwKey(name){ return String(name||'').trim().toLowerCase(); }
// Sinh nháp kịch bản rule-based từ framework + sản phẩm thật + góc nhìn/đối tượng. KHÔNG bịa số liệu.
function generateScript({framework, product, angle, audience}){
  const tpl = FW_TEMPLATES[fwKey(framework&&framework.ten)] || { hook:'{SP} — {ANGLE}', secs:[['Nội dung','{SPEC}']], cta:'Nhắn tin để tư vấn {SP}.' };
  const SP = (product&&product.ten) || '[sản phẩm]';
  const DONG = (product&&product.dong) || '[dòng sản phẩm]';
  const specArr = product && Array.isArray(product.thong_so) ? product.thong_so.filter(Boolean) : [];
  const SPEC = specArr.length ? specArr.join('; ') : '[điền thông số thật của sản phẩm]';
  const STD = (product&&product.tieu_chuan) || '[điền tiêu chuẩn/chứng nhận thật]';
  const GUIDE = (product&&product.huong_dan) || '[điền hướng dẫn sử dụng thật]';
  const ANGLE = (angle||'').trim() || 'lý do nên chọn';
  const AUD = (audience||'').trim() || 'mục tiêu';
  const fill = s => String(s).replaceAll('{SP}',SP).replaceAll('{DONG}',DONG).replaceAll('{SPEC}',SPEC).replaceAll('{STD}',STD).replaceAll('{GUIDE}',GUIDE).replaceAll('{ANGLE}',ANGLE).replaceAll('{AUD}',AUD);
  return { hook: fill(tpl.hook), sections: tpl.secs.map(([label,text])=>({label, text:fill(text)})), cta: fill(tpl.cta) };
}

const NGUONG_KET_FE = { sua_lai:3, cho_duyet:2, chua_nhap_kq:14, trend_sap_het:7, don_cho_gan:3 };
function soNgayFE(iso){ if(!iso) return 0; const d=(Date.now()-new Date(iso).getTime())/864e5; return d>0?Math.floor(d):0; }
function tinhViecKetFE(db){
  const homNay=new Date().toISOString().slice(0,10);
  const coKQ=new Set((db.ket_qua||[]).map(k=>k.air_post_id));
  const sua_lai=(db.scripts||[]).filter(s=>s.trang_thai==='NHAP'&&Number(s.so_lan_tra||0)>0&&soNgayFE(s.updated_at)>=NGUONG_KET_FE.sua_lai)
    .map(s=>({id:s.id,ten:s.tieu_de||s.hook||'(không tên)',ngay:soNgayFE(s.updated_at)}));
  const cho_duyet=(db.approvals||[]).filter(a=>a.trang_thai==='CHO'&&soNgayFE(a.created_at)>=NGUONG_KET_FE.cho_duyet)
    .map(a=>({id:a.id,cong:a.cong,ngay:soNgayFE(a.created_at)}));
  const chua_nhap_kq=(db.air_posts||[]).filter(a=>a.trang_thai==='DA_DANG'&&!coKQ.has(a.id)&&soNgayFE(a.posted_at)>=NGUONG_KET_FE.chua_nhap_kq)
    .map(a=>({id:a.id,ten:a.tieu_de||'(không tên)',ngay:soNgayFE(a.posted_at)}));
  const trend_gap=(db.trends||[]).filter(t=>['MOI','DANH_GIA','DUYET'].includes(t.trang_thai)&&t.han_dung)
    .map(t=>({id:t.id,ten:t.ten,con:Math.floor((new Date(t.han_dung)-new Date(homNay))/864e5)})).filter(t=>t.con<=NGUONG_KET_FE.trend_sap_het);
  const don_ket=(db.don_cho_gan||[]).filter(d=>d.trang_thai==='CHO_GAN'&&soNgayFE(d.created_at)>=NGUONG_KET_FE.don_cho_gan)
    .map(d=>({id:d.id,ma:d.ma_doi_soat||'',ngay:soNgayFE(d.created_at)}));
  return { sua_lai, cho_duyet, chua_nhap_kq, trend_gap, don_ket,
    den_gio:(db.air_posts||[]).filter(a=>a.trang_thai==='DEN_GIO'||a.trang_thai==='LOI').map(a=>({id:a.id,ten:a.tieu_de||'(không tên)',loi:a.loi||'',lich:a.lich_dang||''})),
    tong:sua_lai.length+cho_duyet.length+chua_nhap_kq.length+trend_gap.length+don_ket.length
        +(db.air_posts||[]).filter(a=>a.trang_thai==='DEN_GIO'||a.trang_thai==='LOI').length, nguong:NGUONG_KET_FE };
}

function download(filename, text, mime='text/csv;charset=utf-8'){

function toCSV(rows){
  return rows.map(r=>r.map(c=>{
    let s = c==null? '' : String(c);
    if(/[",\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';
    return s;
  }).join(',')).join('\n');
}
// Nén ảnh phía client trước khi lưu (resize max cạnh 1100px, jpeg 0.7)
function compressImage(file, maxSide=1100, quality=0.7){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let {width:w, height:h}=img;
        if(Math.max(w,h)>maxSide){ const k=maxSide/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    r.onerror=reject; r.readAsDataURL(file);
  });
}

function ensureDemoSlots(S){
  const p=S.pricing||{}; if(!schedOn(p)) return;
  const days=schedDaysSet(p); if(!days.size) return;
  S.post_slots ||= [];
  const today=todayYMD();
  S.post_slots.forEach(s=>{ if(s.status==='CHO' && !s.post_id && s.ngay<today) s.status='BO_LO'; });
  const sales=(S.users||[]).filter(u=>u.active && u.vai_tro===ROLES.SALES); if(!sales.length) return;
  const hidden=new Set(Object.entries(S.post_type_prefs||{}).filter(([k,v])=>v&&v.an).map(([k])=>k));
  const topics=(S.content_topics||[]).filter(t=>t.active && !hidden.has(t.loai_bai)).slice().sort((a,b)=>(b.uu_tien?1:0)-(a.uu_tien?1:0));
  let ord=S.post_slots.length;
  for(let k=0;k<21;k++){ const d=new Date(today+'T00:00:00'); d.setDate(d.getDate()+k); const ymd=ymdOf(d);
    if(!days.has(d.getDay())) continue;
    if(S.post_slots.some(s=>s.ngay===ymd)) continue;
    S.post_slots.push({ id:uid('slot'), ngay:ymd, sales_id:sales[ord%sales.length].id, topic_id:topics.length?topics[ord%topics.length].id:null, post_id:null, status:'CHO', created_at:now() });
    ord++;
  }
  S.post_slots.sort((a,b)=>a.ngay<b.ngay?-1:1);
}

============================================================ */
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return seedDB();
    let db = JSON.parse(raw);
    db = migrate(db);
    return db;
  }catch(e){ console.error('loadDB lỗi, khởi tạo mới', e); return seedDB(); }
}
function migrate(db){
  if(!db.version){ db.version = SCHEMA_VERSION; }
  // đảm bảo đủ mảng (dữ liệu cũ thiếu field không crash)
  db.users ||= []; db.groups ||= []; db.content_topics ||= []; db.cmt_suggestions ||= [];
  db.post_seedings ||= []; db.cmt_seedings ||= []; db.payouts ||= []; db.audit ||= [];
  db.pricing ||= { don_gia_post:15000, don_gia_cmt:3000, min_nhac_kingsmen:6, min_usp:2, dedupe_days:7 };
  if(db.pricing.film_lv1==null) db.pricing.film_lv1=5000;
  if(db.pricing.film_lv2==null) db.pricing.film_lv2=10000;
  if(db.pricing.film_lv3==null) db.pricing.film_lv3=15000;
  if(db.pricing.sched_on==null) db.pricing.sched_on=0;
  if(db.pricing.sched_enforce==null) db.pricing.sched_enforce=1;
  if(db.pricing.sched_days==null) db.pricing.sched_days='0,2,4,6';
  db.post_type_prefs ||= {};
  db.post_slots ||= [];
  db.media_library ||= [];
  db.san_pham ||= [];
  db.claim_cam ||= [];
  db.pillars ||= [];
  db.content_strategy ||= { okr:'', big_idea:'', purpose:'', audience:'', swot:'' };
  db.frameworks ||= [];
  db.kenh ||= [];
  db.content_items ||= [];
  db.scripts ||= []; db.approvals ||= []; db.air_posts ||= []; db.air_checklist ||= AIR_CHECKLIST_FE;
  db.ket_qua ||= []; db.don_cho_gan ||= []; db.footage ||= []; db.shot_list ||= []; db.bai_hoc ||= []; db.min_mau ||= MIN_MAU; db.trends ||= []; db.trend_check ||= TREND_CHECK_FE; db.viec_ket ||= null; db.seeding_theo_noi_dung ||= {}; db.kenh_tu_dong ||= KENH_TU_DONG_FE; db.kenh_san_sang ||= {}; db.n8n_san_sang ||= false;
  db.post_seedings.forEach(p=>{ p.react ??= 0; p.so_cmt_seeding ??= 0; p.so_cmt_tu_nhien ??= 0; p.thanh_tien ??= 0; });
  db.cmt_seedings.forEach(c=>{ c.proofs ||= []; c.so_cmt_seeding ??= 0; c.react ??= 0; c.so_cmt_tu_nhien ??= 0; c.thanh_tien ??= 0; });
  db.groups.forEach(g=>{ g.uu_tien ??= false; });
  db.content_topics.forEach(t=>{ t.uu_tien ??= false; });
  db.users.forEach(u=>{ u.password ??= '123456'; u.active ??= true; });
  return db;
}
function saveDB(db){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); return true; }
  catch(e){
    console.error(e);
    alert('Không lưu được (bộ nhớ trình duyệt đầy — thường do quá nhiều ảnh). Hãy xoá bớt bản ghi cũ hoặc xuất Excel rồi reset.');
    return false;
  }
}

function tienCmt(pricing, soCmt){ return (Number(soCmt)||0) * (Number(pricing.don_gia_cmt)||0); }

          examples: rows.slice(0,5).map(r=>({ sales: r.sales_id===meRef.current.id?'Bạn':(S.users.find(u=>u.id===r.sales_id)?.ho_ten||'—'), trang_thai:r.trang_thai, created_at:r.created_at, mine:r.sales_id===meRef.current.id })) };
      },
      createCmtSeed: async c => { S.cmt_seedings.unshift({ id:uid('c'), loai:c.loai, post_seeding_id:c.post_seeding_id||null, post_link:(c.post_link||'').trim(), suggestion_id:c.suggestion_id||null, sales_id:meRef.current.id, so_cmt_seeding:Number(c.so_cmt_seeding)||0, react:Number(c.react)||0, so_cmt_tu_nhien:Number(c.so_cmt_tu_nhien)||0, trang_thai:c.submit?ST.CHO_DUYET:ST.NHAP, reviewed_by:null, reviewed_at:null, ly_do_loai:'', thanh_tien:0, ky_thanh_toan:null, created_at:now(), proofs:(c.proofs||[]).map(img=>({id:uid('img'),image_url:img,uploaded_at:now()})) }); commit(); return true; },
      reviewCmtSeed: async (id, result, reason) => { const c=S.cmt_seedings.find(x=>x.id===id); if(!c) return false; if(result===ST.DAT){ c.trang_thai=ST.DAT; c.thanh_tien=(Number(c.so_cmt_seeding)||0)*(Number(S.pricing.don_gia_cmt)||0); c.reviewed_by=meRef.current.ho_ten; c.reviewed_at=now(); c.ky_thanh_toan=kyOf(); c.ly_do_loai=''; } else { c.trang_thai=ST.KHONG_DAT; c.thanh_tien=0; c.reviewed_by=meRef.current.ho_ten; c.reviewed_at=now(); c.ly_do_loai=reason||''; } commit(); return true; },
      markPaid: async (sales_id, ky) => { const hit=x=>x.sales_id===sales_id && x.trang_thai===ST.DAT && (!ky || (x.ky_thanh_toan||kyOf(x.created_at))===ky); S.post_seedings.forEach(p=>{ if(hit(p)) p.trang_thai=ST.DA_CHI; }); S.cmt_seedings.forEach(c=>{ if(hit(c)) c.trang_thai=ST.DA_CHI; }); S.project_filmings.forEach(f=>{ if(hit(f)) f.trang_thai=ST.DA_CHI; }); commit(); return true; },
      // ---- QUAY CÔNG TRÌNH ----
      upsertFilmTemplate: async t => { if(t.id) return patchTpl(t.id, x=>({...x, ten:t.ten, he_san_pham:t.he_san_pham, active:t.active!==false})); S.filming_templates.push({ id:uid('tpl'), ten:t.ten, he_san_pham:t.he_san_pham, active:true, phases:[] }); commit(); return true; },
      deleteFilmTemplate: async id => delList('filming_templates', id),
      upsertFilmPhase: async (templateId, phase) => patchTpl(templateId, t=> phase.id ? {...t, phases:t.phases.map(ph=>ph.id===phase.id?{...ph, ten:phase.ten}:ph)} : {...t, phases:[...t.phases, {id:uid('ph'), ten:phase.ten, thu_tu:t.phases.length+1, shots:[]}]}),
      deleteFilmPhase: async (templateId, phaseId) => patchTpl(templateId, t=>({...t, phases:t.phases.filter(ph=>ph.id!==phaseId)})),
      upsertFilmShot: async (templateId, phaseId, shot) => patchTpl(templateId, t=>({...t, phases:t.phases.map(ph=> ph.id!==phaseId?ph:{...ph, shots: shot.id ? ph.shots.map(s=>s.id===shot.id?{...s,...shot}:s) : [...ph.shots, {...shot, id:uid('sh'), thu_tu:ph.shots.length+1}]})})),
      deleteFilmShot: async (templateId, phaseId, shotId) => patchTpl(templateId, t=>({...t, phases:t.phases.map(ph=>ph.id!==phaseId?ph:{...ph, shots:ph.shots.filter(s=>s.id!==shotId)})})),
      createFilming: async proj => { const submit=proj.submit!==false; S.project_filmings.unshift({ id:uid('pf'), sales_id:meRef.current.id, template_id:proj.template_id, ten_cong_trinh:proj.ten_cong_trinh, khu_vuc:proj.khu_vuc||'', ngay_quay:proj.ngay_quay||now(), trang_thai:submit?ST.CHO_DUYET:ST.NHAP, reviewed_by:null, reviewed_at:null, ly_do_loai:'', thanh_tien:0, ky_thanh_toan:null, created_at:now(), uploads:(proj.uploads||[]).map(u=>({id:uid('up'), shot_id:u.shot_id, media_type:u.media_type, media_url:u.media_url})) }); commit(); return true; },
      editFilming: async (id, proj) => { const f=S.project_filmings.find(x=>x.id===id); if(!f) return false; const submit=proj.submit===true; f.ten_cong_trinh=proj.ten_cong_trinh??f.ten_cong_trinh; f.khu_vuc=proj.khu_vuc??f.khu_vuc; f.ngay_quay=proj.ngay_quay??f.ngay_quay; f.uploads=(proj.uploads||[]).map(u=>({id:u.id&&String(u.id).startsWith('up_')?u.id:uid('up'), shot_id:u.shot_id, media_type:u.media_type, media_url:u.media_url, dat_item:u.dat_item, level:u.level})); if(submit){ f.trang_thai=ST.CHO_DUYET; f.ly_do_loai=''; } else f.trang_thai=ST.NHAP; commit(); return true; },
      reviewFilming: async (id, result, reason, ratings) => { const f=S.project_filmings.find(x=>x.id===id); if(!f) return false; if(ratings){ (f.uploads||[]).forEach(u=>{ if(u.id in ratings){ const lv=Number(ratings[u.id])||0; u.level = lv>0?lv:null; u.dat_item = lv>0; } }); } const tpl=S.filming_templates.find(t=>t.id===f.template_id); const tien=filmProjectTien(f,tpl,S.pricing); if(result===ST.DAT){ f.trang_thai=ST.DAT; f.thanh_tien=tien; f.reviewed_by=meRef.current.ho_ten; f.reviewed_at=now(); f.ky_thanh_toan=kyOf(); f.ly_do_loai=''; } else { f.trang_thai=ST.KHONG_DAT; f.thanh_tien=0; f.reviewed_by=meRef.current.ho_ten; f.reviewed_at=now(); f.ly_do_loai=reason||''; } commit(); return true; },
      uploadMedia: (file, onProgress) => new Promise((resolve,reject)=>{ if(onProgress){ onProgress(40,4,10); setTimeout(()=>onProgress(100,10,10),150); } const r=new FileReader(); r.onload=e=>resolve({ media_url:e.target.result, media_type: (file.type||'').startsWith('image/')?MEDIA_TYPE.IMAGE:MEDIA_TYPE.VIDEO }); r.onerror=()=>reject(new Error('Đọc file lỗi')); r.readAsDataURL(file); }),
      deleteUpload: async (id) => { S.project_filmings.forEach(p=>{ p.uploads=(p.uploads||[]).filter(u=>u.id!==id); }); commit(); return true; },
      cleanupMedia: async () => { const cut=new Date(Date.now()-30*864e5).toISOString(); let n=0; S.project_filmings.forEach(p=>{ if(!['DAT','DA_CHI'].includes(p.trang_thai) && (p.created_at||'')<cut){ n+=(p.uploads||[]).length; p.uploads=[]; } }); commit(); notify('Đã dọn media của '+n+' nguồn hết hạn'); return true; },
      upsertGuide: async (key, g) => { S.guides=S.guides||{}; S.guides[key]={ noi_dung:g.noi_dung||'', video_url:g.video_url||'' }; commit(); return true; },
    };
    return <AppCtx.Provider value={demoApi}>{children}{toast && <Toast toast={toast}/>}</AppCtx.Provider>;
  }

  /* ============ BACKEND: API Worker + D1 ============ */
  const call = async (path, opts) => {
    opts = opts || {};
    const res = await fetch(API_BASE+'/api'+path, {
      method: opts.method||'GET',
      headers: { 'Content-Type':'application/json', ...(token?{'Authorization':'Bearer '+token}:{}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ const err=new Error(data.error || ('Lỗi '+res.status)); err.blocked=data.blocked; err.thieu=data.thieu; err.status=res.status; throw err; }
    return data;
  };

  useEffect(()=>{
    if(DEMO) return;
    let alive=true;
    if(!token){ setDb(null); setLoading(false); return; }
    setLoading(true);
    call('/bootstrap')
      .then(r=>{ if(alive){ setDb(r.db); setLoading(false); } })
      .catch(()=>{ if(alive){ localStorage.removeItem(TOKEN_KEY); setToken(null); setDb(null); setLoading(false); } });
    return ()=>{ alive=false; };
  }, [token]);

  const login = async (email, password) => {
    try{
      const r = await call('/login', {method:'POST', body:{email, password}});
      localStorage.setItem(TOKEN_KEY, r.token); setDb(r.db); setToken(r.token);
      return { ok:true };
    }catch(e){ return { ok:false, msg:e.message }; }
  };
  const logout = async () => {
    try{ await call('/logout', {method:'POST'}); }catch(e){}
    localStorage.removeItem(TOKEN_KEY); setToken(null); setDb(null);
  };

  const mut = async (path, opts) => {
    try{ const r = await call(path, opts); if(r && r.db) setDb(r.db); return true; }
    catch(e){ notify(e.message,'err'); return false; }
  };

  const api = {
    db, me, meId, notify, loading, token,
    login, logout,
    refresh: () => call('/bootstrap').then(r=>setDb(r.db)).catch(()=>{}),
    audit: ()=>{},
    updateProfile: patch => mut('/me', {method:'PATCH', body:patch}),
    upsertGroup: g => mut(g.id?`/groups/${g.id}`:'/groups', {method:g.id?'PATCH':'POST', body:g}),
    deleteGroup: id => mut(`/groups/${id}`, {method:'DELETE'}),
    upsertTopic: t => mut(t.id?`/topics/${t.id}`:'/topics', {method:t.id?'PATCH':'POST', body:t}),
    deleteTopic: id => mut(`/topics/${id}`, {method:'DELETE'}),
    upsertCmt: c => mut(c.id?`/cmtsug/${c.id}`:'/cmtsug', {method:c.id?'PATCH':'POST', body:c}),
    deleteCmt: id => mut(`/cmtsug/${id}`, {method:'DELETE'}),
    createUser: u => mut('/users', {method:'POST', body:u}),
    updateUser: (id, patch) => mut(`/users/${id}`, {method:'PATCH', body:patch}),
    deleteUser: id => mut(`/users/${id}`, {method:'DELETE'}),
    setPricing: p => mut('/pricing', {method:'PATCH', body:p}),
    createPost: p => mut('/posts', {method:'POST', body:p}),
    reviewPost: async (id, result, reason) => { try { const r = await call(`/posts/${id}/review`, {method:'POST', body:{result, reason}}); if(r && r.db) setDb(r.db); return { ok:true, deduped:!!r.deduped, reason:r.reason }; } catch(e){ notify(e.message,'err'); return { ok:false }; } },
    dupCheckPost: async (topic_id, group_id) => { try { return await call(`/posts/dupcheck?topic_id=${encodeURIComponent(topic_id)}&group_id=${encodeURIComponent(group_id)}`); } catch(e){ return {dup:false}; } },
    setPostTypePref: (loai, patch) => mut('/posttypes/'+encodeURIComponent(loai), {method:'PATCH', body:patch}),
    regenSchedule: () => mut('/schedule/regen', {method:'POST'}),
    reassignSlot: (id, patch) => mut('/slots/'+id, {method:'PATCH', body:patch}),
    createLibImg: o => mut('/library', {method:'POST', body:o}),
    patchLibImg: (id, patch) => mut('/library/'+id, {method:'PATCH', body:patch}),
    deleteLibImg: id => mut('/library/'+id, {method:'DELETE'}),
    bulkDeleteLibImg: ids => mut('/library/bulkdelete', {method:'POST', body:{ids}}),
    upsertSanPham: o => mut(o.id?'/sanpham/'+o.id:'/sanpham', {method:o.id?'PATCH':'POST', body:o}),

    upsertClaim: o => mut(o.id?'/claimcam/'+o.id:'/claimcam', {method:o.id?'PATCH':'POST', body:o}),
    deleteClaim: id => mut('/claimcam/'+id, {method:'DELETE'}),
    upsertPillar: o => mut(o.id?'/pillars/'+o.id:'/pillars', {method:o.id?'PATCH':'POST', body:o}),
    deletePillar: id => mut('/pillars/'+id, {method:'DELETE'}),
    setStrategy: o => mut('/strategy', {method:'PATCH', body:o}),
    upsertContentItem: o => mut(o.id?'/content/'+o.id:'/content', {method:o.id?'PATCH':'POST', body:o}),
    deleteContentItem: id => mut('/content/'+id, {method:'DELETE'}),
    importContentItems: async items => { try { const r=await call('/content/import',{method:'POST',body:{items}}); if(r&&r.db) setDb(r.db); return r.imported||0; } catch(e){ notify(e.message,'err'); return 0; } },
    upsertKenh: o => mut(o.id?'/kenh/'+o.id:'/kenh', {method:o.id?'PATCH':'POST', body:o}),
    deleteKenh: id => mut('/kenh/'+id, {method:'DELETE'}),
    upsertFramework: o => mut(o.id?'/frameworks/'+o.id:'/frameworks', {method:o.id?'PATCH':'POST', body:o}),
    deleteFramework: id => mut('/frameworks/'+id, {method:'DELETE'}),
    upsertScript: async o => { try { const r=await call(o.id?'/scripts/'+o.id:'/scripts', {method:o.id?'PATCH':'POST', body:o}); if(r&&r.db) setDb(r.db); return {ok:true, id:r.id}; }
      catch(e){ return {ok:false, blocked:e.blocked, msg:e.message}; } },
    deleteScript: id => mut('/scripts/'+id, {method:'DELETE'}),
    fetchScriptVersions: async id => { try { return await call('/scripts/'+id+'/versions'); } catch(e){ return {versions:[]}; } },
    submitApproval: async (doi_tuong,doi_tuong_id) => { try { const r=await call('/approvals/submit',{method:'POST',body:{doi_tuong,doi_tuong_id}}); if(r&&r.db) setDb(r.db); return {ok:true}; }
      catch(e){ return {ok:false, blocked:e.blocked, msg:e.message}; } },
    decideApproval: (id,result,ghi_chu) => mut('/approvals/'+id+'/decide', {method:'POST', body:{result, ghi_chu}}),
    createAir: async o => { try { const r=await call('/air',{method:'POST',body:o}); if(r&&r.db) setDb(r.db); return {ok:true, id:r.id}; }
      catch(e){ return {ok:false, msg:e.message}; } },
    patchAir: async (id,patch) => { try { const r=await call('/air/'+id,{method:'PATCH',body:patch}); if(r&&r.db) setDb(r.db); return {ok:true}; }
      catch(e){ return {ok:false, msg:e.message}; } },
    publishAir: async id => { try { const r=await call('/air/'+id+'/publish',{method:'POST'}); if(r&&r.db) setDb(r.db); return {ok:true}; }
      catch(e){ return {ok:false, thieu:e.thieu, msg:e.message}; } },
    deleteAir: id => mut('/air/'+id, {method:'DELETE'}),
    scheduleAir: async (id,o) => { try { const r=await call('/air/'+id+'/schedule',{method:'POST',body:o}); if(r&&r.db) setDb(r.db); return {ok:true}; }
      catch(e){ return {ok:false, thieu:e.thieu, msg:e.message}; } },
    unscheduleAir: id => mut('/air/'+id+'/unschedule', {method:'POST'}),
    createKetQua: async o => { try { const r=await call('/ketqua',{method:'POST',body:o}); if(r&&r.db) setDb(r.db); return {ok:true}; }
      catch(e){ return {ok:false, msg:e.message}; } },
    deleteKetQua: id => mut('/ketqua/'+id, {method:'DELETE'}),
    importKetQua: async o => { try { const r=await call('/ketqua/import',{method:'POST',body:o}); if(r&&r.db) setDb(r.db); return {ok:true, gan:r.gan, cho:r.cho}; }
      catch(e){ return {ok:false, msg:e.message}; } },
    assignDon: async (id,air_post_id) => { try { const r=await call('/donchogan/'+id+'/assign',{method:'POST',body:{air_post_id}}); if(r&&r.db) setDb(r.db); return {ok:true}; }

    skipDon: (id,ly_do) => mut('/donchogan/'+id+'/skip', {method:'POST', body:{ly_do}}),
    createFootage: async o => { try { const r=await call('/footage',{method:'POST',body:o}); if(r&&r.db) setDb(r.db); return {ok:true,id:r.id}; }

    genShotList: async script_id => { try { const r=await call('/shotlist/from-script/'+script_id,{method:'POST'}); if(r&&r.db) setDb(r.db); return {ok:true,created:r.created}; }

    addShot: (script_id,o) => mut('/shotlist', {method:'POST', body:{script_id,...o}}),
    patchShot: (id,patch) => mut('/shotlist/'+id, {method:'PATCH', body:patch}),
    deleteShot: id => mut('/shotlist/'+id, {method:'DELETE'}),
    quetBaiHoc: async () => { try { const r=await call('/baihoc/quet',{method:'POST'}); if(r&&r.db) setDb(r.db); return {ok:true,them:r.them}; }
      catch(e){ return {ok:false,msg:e.message}; } },
    addBaiHoc: o => mut('/baihoc', {method:'POST', body:o}),
    decideBaiHoc: async (id,result,ghi_chu) => { try { const r=await call('/baihoc/'+id+'/decide',{method:'POST',body:{result,ghi_chu}}); if(r&&r.db) setDb(r.db); return {ok:true}; }
      catch(e){ return {ok:false,msg:e.message}; } },
    deleteBaiHoc: id => mut('/baihoc/'+id, {method:'DELETE'}),
    addTrend: async o => { try { const r=await call('/trends',{method:'POST',body:o}); if(r&&r.db) setDb(r.db); return {ok:true,id:r.id}; } catch(e){ return {ok:false,msg:e.message}; } },
    patchTrend: (id,patch) => mut('/trends/'+id, {method:'PATCH', body:patch}),
    decideTrend: async (id,result,ly_do) => { try { const r=await call('/trends/'+id+'/decide',{method:'POST',body:{result,ly_do}}); if(r&&r.db) setDb(r.db); return {ok:true}; }
      catch(e){ return {ok:false, thieu:e.thieu, msg:e.message}; } },
    trienKhaiTrend: async (id,o) => { try { const r=await call('/trends/'+id+'/trien-khai',{method:'POST',body:o||{}}); if(r&&r.db) setDb(r.db); return {ok:true,content_item_id:r.content_item_id}; }
      catch(e){ return {ok:false,msg:e.message}; } },
    deleteTrend: id => mut('/trends/'+id, {method:'DELETE'}),
    daySangSeeding: async (id,o) => { try { const r=await call('/content/'+id+'/day-seeding',{method:'POST',body:o||{}}); if(r&&r.db) setDb(r.db); return {ok:true,topic_id:r.topic_id}; }
      catch(e){ return {ok:false,msg:e.message}; } },
    createCmtSeed: c => mut('/cmtseed', {method:'POST', body:c}),
    reviewCmtSeed: (id, result, reason) => mut(`/cmtseed/${id}/review`, {method:'POST', body:{result, reason}}),
    markPaid: (sales_id, ky) => mut('/markpaid', {method:'POST', body:{sales_id, ky}}),
    // QUAY CÔNG TRÌNH (route Worker sẽ bổ sung khi tích hợp backend)
    upsertFilmTemplate: t => mut(t.id?`/filming/templates/${t.id}`:'/filming/templates', {method:t.id?'PATCH':'POST', body:t}),
    deleteFilmTemplate: id => mut(`/filming/templates/${id}`, {method:'DELETE'}),
    upsertFilmPhase: (templateId, phase) => mut(phase.id?`/filming/phases/${phase.id}`:'/filming/phases', {method:phase.id?'PATCH':'POST', body:{...phase, template_id:templateId}}),
    deleteFilmPhase: (templateId, phaseId) => mut(`/filming/phases/${phaseId}`, {method:'DELETE'}),
    upsertFilmShot: (templateId, phaseId, shot) => mut(shot.id?`/filming/shots/${shot.id}`:'/filming/shots', {method:shot.id?'PATCH':'POST', body:{...shot, phase_id:phaseId}}),
    deleteFilmShot: (templateId, phaseId, shotId) => mut(`/filming/shots/${shotId}`, {method:'DELETE'}),
    createFilming: proj => mut('/filming/projects', {method:'POST', body:proj}),
    editFilming: (id, proj) => mut(`/filming/projects/${id}`, {method:'PATCH', body:proj}),
    reviewFilming: (id, result, reason, ratings) => mut(`/filming/projects/${id}/review`, {method:'POST', body:{result, reason, ratings}}),
    deleteUpload: id => mut(`/filming/uploads/${id}`, {method:'DELETE'}),
    cleanupMedia: () => mut('/filming/cleanup', {method:'POST'}),
    upsertGuide: (key, g) => mut('/guides/'+key, {method:'PATCH', body:g}),
    uploadMedia: (file, onProgress) => new Promise((resolve,reject)=>{
      const xhr = new XMLHttpRequest();
      xhr.open('POST', API_BASE+'/api/filming/upload?type='+encodeURIComponent(file.type||''));
      if(token) xhr.setRequestHeader('Authorization','Bearer '+token);
      xhr.setRequestHeader('Content-Type', file.type||'application/octet-stream');
      xhr.timeout = 15*60*1000;
      xhr.upload.onprogress = (e)=>{ if(onProgress && e.lengthComputable) onProgress(Math.round(e.loaded/e.total*100), e.loaded, e.total); };
      xhr.onload = ()=>{ let d={}; try{ d=JSON.parse(xhr.responseText); }catch(_){} if(xhr.status>=200&&xhr.status<300) resolve(d); else reject(new Error(d.error||('Lỗi '+xhr.status))); };
      xhr.onerror = ()=> reject(new Error('Lỗi mạng khi tải lên'));
      xhr.ontimeout = ()=> reject(new Error('Hết thời gian tải lên — thử lại hoặc dùng link Drive'));
      xhr.send(file);
    }),
  };
  return <AppCtx.Provider value={api}>
    {children}
    {toast && <Toast toast={toast}/>}
  </AppCtx.Provider>;
}

============================================================ */
function Toast({toast}){
  const c = toast.type==='err' ? 'bg-rose-600' : toast.type==='warn' ? 'bg-amber-500' : 'bg-emerald-600';
  return <div className={"fixed bottom-5 left-1/2 -translate-x-1/2 z-50 text-white px-4 py-2.5 rounded-xl shadow-lift text-sm max-w-[90%] font-medium "+c}>{toast.msg}</div>;
}
function Badge({st}){ return <span className={"inline-block px-2 py-0.5 rounded-full text-xs font-medium "+(ST_STYLE[st]||'bg-slate-100')}>{ST_LABEL[st]||st}</span>; }
function PriBadge({small}){ return <span className={"inline-flex items-center gap-0.5 rounded-full font-semibold bg-brand/15 text-brand-dark "+(small?'text-[9px] px-1.5 py-0.5':'text-[10px] px-2 py-0.5')}>⭐ Ưu tiên</span>; }
const sortPri = (arr) => [...arr].sort((a,b)=> (b.uu_tien?1:0)-(a.uu_tien?1:0));
function PriSwitch({value, onChange, hint}){
  return <div className="mb-3 flex items-center justify-between p-3 rounded-xl border border-slate-200 bg-slate-50">
    <div><div className="text-xs font-semibold text-slate-700">⭐ Ưu tiên seeding</div>
      <div className="text-[11px] text-slate-400">{hint||'Yêu cầu Sales seeding mục này trước'}</div></div>
    <button type="button" onClick={()=>onChange(!value)}
      className={"w-12 h-7 rounded-full transition relative "+(value?'bg-brand':'bg-slate-300')}>
      <span className={"absolute top-0.5 w-6 h-6 bg-white rounded-full shadow transition-all "+(value?'left-[22px]':'left-0.5')}></span>
    </button>
  </div>;
}
function Btn({children, onClick, variant='primary', className='', type='button', disabled}){
  const v = {
    primary:'bg-ink text-white hover:bg-ink-soft',
    brand:'bg-brand text-white hover:bg-brand-dark shadow-brand',
    ghost:'bg-white border border-line text-ink hover:border-brand hover:text-brand-dark',
    danger:'bg-rose-600 text-white hover:bg-rose-700',
    ok:'bg-emerald-600 text-white hover:bg-emerald-700',
    soft:'bg-brand-bg text-brand-dark hover:bg-brand-light/60',
  }[variant];
  return <button type={type} disabled={disabled} onClick={onClick}
    className={"px-3.5 py-2.5 rounded-xl text-sm font-semibold transition active:scale-[.98] disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100 "+v+" "+className}>{children}</button>;
}
function Field({label, children, hint, required}){
  return <label className="block mb-3">
    <div className="text-[13px] font-semibold text-ink mb-1.5">{label}{required && <span className="text-rose-500"> *</span>}</div>
    {children}
    {hint && <div className="text-[11px] text-ink-muted mt-1">{hint}</div>}
  </label>;
}
const inputCls = "w-full px-3.5 py-2.5 rounded-xl border border-line text-sm text-ink placeholder:text-slate-400 focus:outline-none focus:ring-4 focus:ring-brand/15 focus:border-brand bg-white transition";
function Input(p){ return <input {...p} className={inputCls+" "+(p.className||'')}/>; }
function Textarea(p){ return <textarea {...p} className={inputCls+" "+(p.className||'')}/>; }
function Select({children, ...p}){ return <select {...p} className={inputCls+" "+(p.className||'')}>{children}</select>; }

function Modal({open, onClose, title, children, wide}){
  if(!open) return null;
  return <div className="fixed inset-0 z-40 bg-ink/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} className={"bg-white w-full rounded-t-3xl sm:rounded-2xl shadow-lift max-h-[92vh] overflow-auto "+(wide?'sm:max-w-3xl':'sm:max-w-lg')}>
      <div className="sticky top-0 bg-white/95 backdrop-blur border-b border-line px-4 py-3 flex items-center justify-between z-10">
        <h3 className="font-display font-700 text-ink">{title}</h3>
        <button onClick={onClose} className="w-8 h-8 rounded-lg text-ink-muted hover:bg-slate-100 text-xl leading-none">×</button>
      </div>
      <div className="p-4">{children}</div>
    </div>
  </div>;
}
function Empty({children}){ return <div className="text-center text-ink-muted text-sm py-10">{children}</div>; }
function Stat({label, value, sub, color='text-ink'}){
  return <div className="bg-white rounded-2xl p-4 shadow-card border border-line">
    <div className="text-[13px] text-ink-muted">{label}</div>
    <div className={"font-display text-xl font-800 mt-1 "+color}>{value}</div>
    {sub && <div className="text-[11px] text-ink-muted mt-0.5">{sub}</div>}
  </div>;
}
function Tabs({tabs, active, onChange}){
  return <div className="flex gap-1 bg-slate-100 p-1 rounded-xl overflow-x-auto">
    {tabs.map(t=><button key={t.key} onClick={()=>onChange(t.key)}
      className={"px-3 py-1.5 rounded-lg text-sm font-semibold whitespace-nowrap transition "+(active===t.key?'bg-white shadow-card text-ink':'text-ink-muted hover:text-ink')}>
      {t.label}{t.count!=null && <span className={"ml-1.5 text-xs px-1.5 rounded-full "+(active===t.key?'bg-brand text-white':'bg-slate-200 text-slate-500')}>{t.count}</span>}
    </button>)}
  </div>;
}
function Toggle({on, onClick, labels=['Hiện','Ẩn']}){
  return <button onClick={onClick} className={"px-2.5 py-1 rounded-lg text-xs font-semibold "+(on?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate-500')}>
    {on?labels[0]:labels[1]}
  </button>;
}

  const { me, updateProfile, notify } = useApp();

}

    </button>}
    {schedEnabled && !myTurnToday && myNextSlot && <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-xs text-amber-800">
      📅 Lượt đăng kế của bạn: <b>{fmtSlotDay(myNextSlot.ngay)}</b>{myNextSlot.topic_id && db.content_topics.find(t=>t.id===myNextSlot.topic_id) ? <> · gợi ý: <b>{db.content_topics.find(t=>t.id===myNextSlot.topic_id).chu_de}</b></> : ''}.
    </div>}
    <div className="grid grid-cols-2 gap-3">
      <Stat label="Đang chờ duyệt" value={cho} color="text-amber-600"/>
      <Stat label="Bị loại (sửa lại)" value={loai} color="text-rose-600"/>
      <Stat label="Thu nhập đã Đạt" value={fmtVND(tienDat)} color="text-emerald-600" sub="POST + CMT + QUAY · chưa chi"/>
      <Stat label="Đã được chi" value={fmtVND(tienChi)} color="text-indigo-600"/>

    {/* tổng hợp 3 mảng công việc */}

      <div className="grid grid-cols-3 divide-x text-center">

      <button onClick={()=>go('new_cmt')} className="bg-brand text-white rounded-2xl p-3 text-left hover:bg-brand-dark transition">

        {all.filter(x=>x.trang_thai===ST.KHONG_DAT).map(x=>
          <div key={x.id} className="text-xs bg-white rounded-lg p-2 flex justify-between">
            <span className="text-slate-600 truncate">{x.ten_cong_trinh||x.link_bai||x.post_link||CMT_LOAI_LABEL[x.loai]}</span>

    <RecentList posts={posts} cmts={cmts} filmings={filmings}/>
  </div>;
}
function RecentList({posts, cmts, filmings=[]}){
  const { db } = useApp();
  const rows = [
    ...posts.map(p=>({ ...p, kind:'POST', when:p.created_at, label:'POST · '+(db.content_topics.find(t=>t.id===p.topic_id)?.chu_de||'—') })),
    ...cmts.map(c=>({ ...c, kind:'CMT', when:c.created_at, label:CMT_LOAI_LABEL[c.loai] })),

      <div className="flex items-center gap-2 shrink-0">
        {r.trang_thai===ST.DAT || r.trang_thai===ST.DA_CHI ? <span className="text-xs font-semibold text-emerald-600">{fmtVND(r.thanh_tien)}</span> : null}

}

function CopyBtn({text, className='', label='📋 Copy'}){
  const { notify } = useApp();
  const [done, setDone] = useState(false);
  const copy = () => {
    const ok = navigator.clipboard?.writeText(text);
    // fallback cho file:// / trình duyệt cũ
    if(!navigator.clipboard){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); }
    setDone(true); notify('Đã copy nội dung'); setTimeout(()=>setDone(false), 2000);
  };
  return <Btn variant={done?'ok':'soft'} className={className} onClick={copy}>{done?'✓ Đã copy':label}</Btn>;
}
function SalesNewPost({go}){
  const { db, meId, createPost, notify, dupCheckPost } = useApp();
  const [q, setQ] = useState('');
  const [fLoai, setFLoai] = useState('');
  const [topicId, setTopicId] = useState('');
  const [groupId, setGroupId] = useState('');
  const [link, setLink] = useState('');
  const [react, setReact] = useState('');
  const [cmtS, setCmtS] = useState('');
  const [cmtT, setCmtT] = useState('');

  const [onlyPri, setOnlyPri] = useState(false);
  const ptPrefs = db.post_type_prefs||{};
  const typeHidden = (loai)=> !!(ptPrefs[loai] && ptPrefs[loai].an);   // loại bài Marketing đang ẩn theo giai đoạn
  const typePri = (loai)=> (ptPrefs[loai] && ptPrefs[loai].uu_tien)?1:0;
  const topics = db.content_topics.filter(t=>t.active
    && !typeHidden(t.loai_bai)
    && (!onlyPri || t.uu_tien || typePri(t.loai_bai))
    && (!fLoai || t.loai_bai===fLoai)
    && (!q || (t.chu_de+' '+t.noi_dung+' '+(t.tags||[]).join(' ')).toLowerCase().includes(q.toLowerCase())))
    .sort((a,b)=>{ const tp=typePri(b.loai_bai)-typePri(a.loai_bai); if(tp) return tp; return (b.uu_tien?1:0)-(a.uu_tien?1:0); });
  const groups = sortPri(db.groups.filter(g=>g.active));
  const topic = db.content_topics.find(t=>t.id===topicId);
  const chosenGroup = groups.find(g=>g.id===groupId);
  const priTopics = db.content_topics.filter(t=>t.active && t.uu_tien).length;
  const priGroups = groups.filter(g=>g.uu_tien).length;

  const dupLink = link && db.post_seedings.some(p=>p.link_bai && p.link_bai.trim()===link.trim());

  // Chống spam: cảnh báo mềm nếu nội dung này đã đăng ở nhóm này (bất kỳ Sales nào) trong N ngày
  const [dup, setDup] = useState(null);
  useEffect(()=>{ let live=true; setDup(null);
    if(topicId && groupId && dupCheckPost){ dupCheckPost(topicId, groupId).then(r=>{ if(live) setDup(r && r.dup ? r : null); }); }
    return ()=>{ live=false; };
  }, [topicId, groupId]);

  // Lịch đăng theo lượt (xoay vòng)
  const schedEnabled = schedOn(db.pricing);
  const schedHard = schedEnabled && schedEnforce(db.pricing);
  const slots = db.post_slots||[];
  const _today = todayYMD();
  const todaySlot = slots.find(s=>s.ngay===_today);
  const myTurnToday = schedEnabled && !!todaySlot && todaySlot.sales_id===meId && !todaySlot.post_id;
  const myNextSlot = slots.filter(s=>s.ngay>=_today && s.sales_id===meId && s.status==='CHO').sort((a,b)=>a.ngay<b.ngay?-1:1)[0];
  const suggestedTopic = todaySlot ? db.content_topics.find(t=>t.id===todaySlot.topic_id) : null;
  const blockedBySched = schedHard && !myTurnToday;
  // Tới lượt mình: tự chọn sẵn chủ đề gợi ý
  useEffect(()=>{ if(myTurnToday && suggestedTopic && !topicId) setTopicId(suggestedTopic.id); }, [myTurnToday, suggestedTopic && suggestedTopic.id]);

  const submit = async (asDraft) => {
    if(!topicId) return notify('Chọn chủ đề/nội dung','warn');
    if(!groupId) return notify('Chọn group mục tiêu','warn');
    if(!asDraft){
      if(!isFbUrl(link)) return notify('Cần link Facebook hợp lệ để gửi nghiệm thu','warn');
    }
    const ok = await createPost({
      topic_id:topicId, group_id:groupId, link_bai:link.trim(),
      react:Number(react)||0, so_cmt_seeding:Number(cmtS)||0, so_cmt_tu_nhien:Number(cmtT)||0,
      submit: !asDraft,
    });
    if(ok){ notify(asDraft?'Đã lưu nháp':'Đã gửi nghiệm thu POST'); go('home'); }
  };

  return <div className="space-y-4 max-w-2xl">
    <div className="flex items-center justify-between gap-2 flex-wrap"><h2 className="font-display text-lg font-bold text-ink">📝 Tạo POST seeding</h2><div className="flex gap-2"><ImageLibModalBtn/><GuideBtn guideKey="post" title="Tạo POST seeding"/></div></div>

    {schedEnabled && (myTurnToday
      ? <div className="bg-emerald-50 border border-emerald-300 rounded-2xl p-3.5 text-sm text-emerald-800">
          <div className="font-semibold">🟢 Hôm nay tới lượt bạn đăng bài!</div>
          <div className="text-xs mt-0.5">Chỉ đăng <b>1 post</b> hôm nay.{suggestedTopic && <> Chủ đề gợi ý (đã chọn sẵn): <b>{suggestedTopic.chu_de}</b>.</>}</div>
        </div>
      : <div className="bg-amber-50 border border-amber-300 rounded-2xl p-3.5 text-sm text-amber-800">
          <div className="font-semibold">{todaySlot ? '⏳ Hôm nay là lượt của '+(db.users.find(u=>u.id===todaySlot.sales_id)?.ho_ten||'người khác') : '📅 Hôm nay không đăng bài (chỉ Thứ 3 · Thứ 5 · Thứ 7 · Chủ nhật)'}</div>
          <div className="text-xs mt-0.5">{myNextSlot ? <>Lượt kế của bạn: <b>{fmtSlotDay(myNextSlot.ngay)}</b>{myNextSlot.topic_id && db.content_topics.find(t=>t.id===myNextSlot.topic_id) ? ' · gợi ý: '+db.content_topics.find(t=>t.id===myNextSlot.topic_id).chu_de : ''}.</> : 'Bạn chưa có suất nào sắp tới — hỏi Marketing.'}{schedHard && ' Bạn chỉ gửi nghiệm thu được vào đúng ngày tới lượt.'}</div>
        </div>)}

    {(priTopics>0 || priGroups>0) && <div className="bg-brand/10 border border-brand/30 rounded-2xl p-3 text-xs text-brand-dark">
      ⭐ Marketing đang ưu tiên {priTopics>0 && <b>{priTopics} tuyến nội dung</b>}{priTopics>0&&priGroups>0 && ' và '}{priGroups>0 && <b>{priGroups} group</b>} — hãy seeding các mục ⭐ trước.
    </div>}

    {/* B1: chọn nội dung */}
    <div className="bg-white rounded-2xl p-4 border border-slate-100">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-semibold text-ink">1. Chọn chủ đề / nội dung</div>
        {priTopics>0 && <button onClick={()=>setOnlyPri(v=>!v)}
          className={"px-2.5 py-1 rounded-lg text-xs font-medium "+(onlyPri?'bg-brand text-white':'bg-slate-100 text-slate-500')}>⭐ Chỉ ưu tiên</button>}
      </div>
      <div className="flex gap-2 mb-2">
        <Input placeholder="Tìm theo từ khoá…" value={q} onChange={e=>setQ(e.target.value)}/>
        <Select value={fLoai} onChange={e=>setFLoai(e.target.value)} className="max-w-[45%]">
          <option value="">Mọi loại bài</option>

        </Select>
      </div>
      <div className="space-y-2 max-h-64 overflow-auto">

            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-1.5 min-w-0">

              </div>

function ImageUploader({images, setImages}){
  const { notify } = useApp();
  const ref = useRef();
  const onPick = async (e) => {
    const files = Array.from(e.target.files||[]);
    for(const f of files){
      try{ const b64 = await compressImage(f); setImages(prev=>[...prev, {id:uid('img'), image_url:b64, uploaded_at:nowISO()}]); }
      catch(err){ notify('Lỗi đọc ảnh','err'); }
    }
    e.target.value='';
  };
  return <div>
    <div className="flex flex-wrap gap-2 mb-2">
      {images.map(im=><div key={im.id} className="relative w-20 h-20 rounded-lg overflow-hidden border">
        <img src={im.image_url} className="w-full h-full object-cover"/>
        <button onClick={()=>setImages(prev=>prev.filter(x=>x.id!==im.id))} className="absolute top-0.5 right-0.5 bg-black/60 text-white w-5 h-5 rounded-full text-xs leading-none">×</button>
      </div>)}
      <button onClick={()=>ref.current.click()} className="w-20 h-20 rounded-lg border-2 border-dashed border-slate-300 text-slate-400 flex flex-col items-center justify-center text-xs hover:border-brand">
        <span className="text-xl">＋</span>Chụp/Up

    </div>
    <input ref={ref} type="file" accept="image/*" capture="environment" multiple hidden onChange={onPick}/>

}

function inRange(iso, from, to){
  if(!iso) return false; const d=iso.slice(0,10);
  if(from && d<from) return false; if(to && d>to) return false; return true;
}
function MktDashboard(){
  const { db } = useApp();
  const [from, setFrom] = useState(''); const [to, setTo] = useState('');
  const posts = db.post_seedings.filter(p=>inRange(p.created_at,from,to));
  const cmts  = db.cmt_seedings.filter(c=>inRange(c.created_at,from,to));
  const films = (db.project_filmings||[]).filter(f=>inRange(f.created_at,from,to));
  const all = [...posts.map(p=>({...p,_k:'POST'})), ...cmts.map(c=>({...c,_k:'CMT'})), ...films.map(f=>({...f,_k:'QUAY'}))];

  const pending = all.filter(x=>x.trang_thai===ST.CHO_DUYET).length;
  const tamTinh = all.filter(x=>x.trang_thai===ST.CHO_DUYET).reduce((s,x)=> s + (x._k==='POST'?tienPost(db.pricing):x._k==='CMT'?tienCmt(db.pricing,x.so_cmt_seeding):0),0);
  const datCount = all.filter(x=>x.trang_thai===ST.DAT||x.trang_thai===ST.DA_CHI).length;
  const tongChi = all.filter(x=>x.trang_thai===ST.DAT||x.trang_thai===ST.DA_CHI).reduce((s,x)=>s+(x.thanh_tien||0),0);

  // theo loại bài (POST) + theo người
  const byLoai = {};
  posts.filter(p=>p.trang_thai===ST.DAT||p.trang_thai===ST.DA_CHI).forEach(p=>{
    const t=db.content_topics.find(x=>x.id===p.topic_id); const k=t?.loai_bai||'—'; byLoai[k]=(byLoai[k]||0)+1; });
  const byMucTieu = {};
  posts.filter(p=>p.trang_thai===ST.DAT||p.trang_thai===ST.DA_CHI).forEach(p=>{
    const t=db.content_topics.find(x=>x.id===p.topic_id); const k=t?.muc_tieu||'—'; byMucTieu[k]=(byMucTieu[k]||0)+1; });
  const byNguoi = {};
  all.filter(x=>x.trang_thai===ST.DAT||x.trang_thai===ST.DA_CHI).forEach(x=>{
    const u=db.users.find(u=>u.id===x.sales_id); const k=u?.ho_ten||'—';
    byNguoi[k] ||= {dat:0, tien:0}; byNguoi[k].dat++; byNguoi[k].tien+=x.thanh_tien; });

  // Vinh danh Top 1-2-3 theo thành tiền ĐÃ DUYỆT (trong khoảng lọc)
  const honor = (kinds) => {
    const m = {};
    all.filter(x=> kinds.includes(x._k) && (x.trang_thai===ST.DAT||x.trang_thai===ST.DA_CHI)).forEach(x=>{
      const u=db.users.find(u=>u.id===x.sales_id); if(!u) return;
      m[u.id] ||= {name:u.ho_ten, dat:0, tien:0}; m[u.id].dat++; m[u.id].tien+=(x.thanh_tien||0); });
    return Object.values(m).filter(v=>v.tien>0).sort((a,b)=> (b.tien-a.tien) || (b.dat-a.dat)).slice(0,3);
  };
  const topSeeding = honor(['POST','CMT']);
  const topQuay = honor(['QUAY']);

  return <div className="space-y-4">
    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
      <h2 className="font-display text-lg font-bold text-ink">📊 Dashboard</h2>
      <DateRange from={from} to={to} setFrom={setFrom} setTo={setTo}/>

    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <Stat label="Chờ duyệt" value={pending} color="text-amber-600" sub="POST · CMT · QUAY"/>
      <Stat label="Tổng chi tạm tính" value={fmtVND(tamTinh)} color="text-amber-600" sub="nếu duyệt hết"/>
      <Stat label="Item đã Đạt" value={datCount} color="text-emerald-600"/>
      <Stat label="Tổng đã ghi công" value={fmtVND(tongChi)} color="text-emerald-600" sub="gồm cả quay công trình"/>
    </div>

    <div>
      <div className="text-sm font-semibold text-ink mb-2 flex items-center gap-2">🏆 Vinh danh Top 3 <span className="text-[11px] font-normal text-slate-400">theo thành tiền đã duyệt{(from||to)?' · trong khoảng lọc':''}</span></div>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Podium icon="🌱" title="Seeding (POST + CMT)" list={topSeeding}/>
        <Podium icon="🎬" title="Quay công trình" list={topQuay}/>
      </div>
    </div>

    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <BreakdownCard title="Sản lượng đạt theo loại bài" data={byLoai}/>
      <BreakdownCard title="Theo mục tiêu (BIẾT→HÀNH ĐỘNG)" data={byMucTieu}/>
    </div>

    <div className="bg-white rounded-2xl border border-line shadow-card p-4">
      <div className="text-sm font-semibold text-ink mb-3">Theo người</div>
      {Object.keys(byNguoi).length===0 ? <Empty>Chưa có item đạt.</Empty> :
        <table className="w-full text-sm">
          <thead><tr className="text-left text-xs text-slate-400"><th className="pb-2">Sales</th><th className="pb-2 text-right">Item đạt</th><th className="pb-2 text-right">Thành tiền</th></tr></thead>
          <tbody className="divide-y">
            {Object.entries(byNguoi).sort((a,b)=>b[1].tien-a[1].tien).map(([k,v])=>
              <tr key={k}><td className="py-2">{k}</td><td className="py-2 text-right">{v.dat}</td><td className="py-2 text-right font-semibold">{fmtVND(v.tien)}</td></tr>)}
          </tbody>
        </table>}
    </div>
  </div>;
}
function Podium({icon, title, list}){
  const medals=['🥇','🥈','🥉'];
  const rowCls=['border-amber-300 bg-amber-50','border-slate-300 bg-slate-50','border-orange-300 bg-orange-50/50'];

          <div className="font-display font-800 text-brand-dark shrink-0 tabular-nums">{fmtVND(v.tien)}</div>
        </div>)}

}
function BreakdownCard({title, data}){
  const entries = Object.entries(data).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(1, ...entries.map(e=>e[1]));
  return <div className="bg-white rounded-2xl border border-line shadow-card p-4">
    <div className="text-sm font-semibold text-ink mb-3">{title}</div>
    {entries.length===0 ? <Empty>Chưa có dữ liệu.</Empty> :
      <div className="space-y-2">{entries.map(([k,v])=>
        <div key={k}>
          <div className="flex justify-between text-xs mb-0.5"><span className="text-slate-600">{k}</span><span className="font-semibold">{v}</span></div>
          <div className="h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-brand rounded-full" style={{width:(v/max*100)+'%'}}/></div>
        </div>)}
      </div>}
  </div>;
}

  const lech = pillars.map(p=>{ const actual= withP? (dist[p.id]||0)/withP*100 : 0; return {p, actual, diff:actual-(Number(p.ty_trong)||0)}; }).filter(x=>Math.abs(x.diff)>15);
  const showLech = withP>=5 && lech.length>0;
  const move=(it,st)=> upsertContentItem({id:it.id, trang_thai:st});
  const Card=({it})=>{ const pil=pillars.find(p=>p.id===it.pillar_id); const kn=kenhs.find(k=>k.id===it.kenh_id); const pic=db.users.find(u=>u.id===(it.pic&&it.pic.chinh));
    return <div className="bg-white rounded-xl border border-line p-2.5 shadow-card text-left">

const IMPORT_FIELD_HINTS={
  tieu_de:['tên nội dung','nội dung chi tiết','content angle','tiêu đề','tên bài','title','kịch bản'],
  framework:['nhóm kịch bản','cấu trúc','framework','định dạng','format'],
  kenh:['kênh','shop','channel'],
  san_pham:['sản phẩm','product'],
  pillar:['content pillar','pillar','trụ cột'],
  ngay_dang:['ngày đăng','lịch đăng','ngày giao','lịch air','ngày quay','ngày'],
};
const impNorm=s=>String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' ');
function impAutoMap(header){
  const H=(header||[]).map(impNorm); const map={}; const used=new Set();
  for(const field in IMPORT_FIELD_HINTS){ let bi=-1;
    outer: for(const h of IMPORT_FIELD_HINTS[field]){ for(let i=0;i<H.length;i++){ if(used.has(i)||!H[i])continue; if(H[i].includes(h)){ bi=i; break outer; } } }
    map[field]=bi; if(bi>=0)used.add(bi);
  }
  return map;
}
function impDetectHeader(rows){ let hi=0,best=0; for(let i=0;i<Math.min(15,(rows||[]).length);i++){ const c=(rows[i]||[]).filter(x=>String(x==null?'':x).trim()).length; if(c>best){best=c;hi=i;} } return hi; }
function impToMonth(v){ if(v==null||v==='')return ''; if(v instanceof Date){ return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0'); } const s=String(v); const m=s.match(/(\d{4})[-/](\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0'); const d=new Date(s); if(!isNaN(d.getTime())) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); return ''; }

  const [map,setMap]=useState({});                 // field -> col index
  const [def,setDef]=useState({loai:'SOCIAL',loai_muc_tieu:'BAN_HANG',kenh_id:'',thang:''});
  const HEAD=['Tiêu đề','Loại (ECOM/SOCIAL)','Mục tiêu','Pillar','Framework','Kênh','Sản phẩm','Tháng (YYYY-MM)'];
  const dlTpl=()=>download('mau_ke_hoach_noi_dung.csv', toCSV([HEAD,['Review ColorMatch nền gạch trắng','SOCIAL','Thương hiệu','Branding','Review KOC','Fanpage Kingsmen','','2026-07']]));
  const findId=(arr,name,key)=>{ if(!name) return null; const n=String(name).trim().toLowerCase(); if(!n) return null; let x=(arr||[]).find(o=>String(o[key]||'').trim().toLowerCase()===n); if(!x) x=(arr||[]).find(o=>{const v=String(o[key]||'').trim().toLowerCase(); return v&&(n.includes(v)||v.includes(n));}); return x?x.id:null; };
  const kpiVal=(name)=>{ if(!name) return 'BAN_HANG'; const n=String(name).trim().toLowerCase(); const x=LOAI_MUC_TIEU_KPI.find(o=>o.label.toLowerCase()===n||o.v.toLowerCase()===n); return x?x.v:'BAN_HANG'; };
  const resetXlsx=()=>{ setWb(null); setSheet(''); setRows([]); setHi(0); setMap({}); };
  const pickSheet=(w,sn)=>{ setSheet(sn); const rr=XLSX.utils.sheet_to_json(w.Sheets[sn],{header:1,blankrows:false}); setRows(rr); const h=impDetectHeader(rr); setHi(h); setMap(impAutoMap(rr[h]||[])); };
  const changeHeader=(idx)=>{ setHi(idx); setMap(impAutoMap(rows[idx]||[])); };
  const onFile=e=>{ const fl=e.target.files&&e.target.files[0]; e.target.value=''; if(!fl) return;
    if(/\.(xlsx|xls)$/i.test(fl.name)){
      if(typeof XLSX==='undefined') return notify('Thư viện đọc Excel chưa tải xong, thử lại sau vài giây','warn');
      const r=new FileReader();
      r.onload=ev=>{ try{ const w=XLSX.read(ev.target.result,{type:'array',cellDates:true}); setTxt(''); setWb(w); pickSheet(w, w.SheetNames[0]); }catch(err){ notify('Không đọc được file: '+err.message,'err'); } };
      r.readAsArrayBuffer(fl);
    } else { resetXlsx(); const r=new FileReader(); r.onload=ev=>setTxt(String(ev.target.result||'')); r.readAsText(fl,'utf-8'); }
  };

  const header = rows[hi]||[];
  const colOpts = header.map((c,i)=>({i, name:String(c==null?'':c).trim()||('Cột '+(i+1))}));
  const buildXlsx=()=>{ const body=rows.slice(hi+1); const cell=(r,ci)=> (ci>=0? String(r[ci]==null?'':r[ci]).trim():'');
    return body.map(r=>({
      tieu_de: cell(r,map.tieu_de),
      loai: def.loai,
      loai_muc_tieu: def.loai_muc_tieu,
      pillar_id: findId(db.pillars, cell(r,map.pillar), 'ten'),
      framework_id: findId(db.frameworks, cell(r,map.framework), 'ten'),
      kenh_id: findId(db.kenh, cell(r,map.kenh), 'ten') || def.kenh_id || null,
      san_pham_id: findId(db.san_pham, cell(r,map.san_pham), 'ten'),
      thang: (map.ngay_dang>=0? impToMonth(r[map.ngay_dang]):'') || def.thang || '',
      trang_thai:'Y_TUONG',
    })).filter(x=>x.tieu_de);
  };
  const buildCsv=()=>{ const rr=parseTable(txt); if(!rr.length) return []; if((rr[0][0]||'').toLowerCase()==='tiêu đề') rr.shift();
    return rr.filter(c=>(c[0]||'').trim()).map(c=>({
      tieu_de:(c[0]||'').trim(), loai:(c[1]||'').trim().toUpperCase()==='ECOM'?'ECOM':'SOCIAL', loai_muc_tieu:kpiVal(c[2]),
      pillar_id:findId(db.pillars,c[3],'ten'), framework_id:findId(db.frameworks,c[4],'ten'), kenh_id:findId(db.kenh,c[5],'ten'),
      san_pham_id:findId(db.san_pham,c[6],'ten'), thang:(c[7]||'').trim(), trang_thai:'Y_TUONG',
    }));
  };
  const items = wb ? buildXlsx() : (txt.trim()? buildCsv() : []);
  const doImport=async()=>{ if(!items.length) return notify('Chưa có dữ liệu hợp lệ (thiếu Tiêu đề)','warn');
    setBusy(true); const n=await importContentItems(items); setBusy(false);
    notify('Đã import '+n+' nội dung'); onClose();
  };
  const xlsxReady = typeof XLSX!=='undefined';

  return <Modal open={true} onClose={onClose} title="Import kế hoạch nội dung" wide>
    <div className="flex flex-wrap gap-2 mb-3">
      <Btn variant="ghost" onClick={()=>fileRef.current&&fileRef.current.click()}>📄 Chọn file (.xlsx / .csv)</Btn>
      <Btn variant="ghost" onClick={dlTpl}>⬇ Tải file mẫu (.csv)</Btn>
      {wb && <Btn variant="ghost" onClick={resetXlsx}>✕ Bỏ file Excel</Btn>}
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv,.tsv,.txt" className="hidden" onChange={onFile}/>
    </div>
    {!xlsxReady && <div className="text-[11px] text-amber-600 mb-2">Đang tải thư viện đọc Excel… nếu chọn .xlsx báo lỗi, chờ vài giây rồi thử lại.</div>}

    {wb ? <div className="space-y-3">
      <div className="grid sm:grid-cols-2 gap-2">
        <Field label="Sheet"><Select value={sheet} onChange={e=>pickSheet(wb,e.target.value)}>{wb.SheetNames.map(n=><option key={n} value={n}>{n}</option>)}</Select></Field>
        <Field label="Dòng tiêu đề"><Select value={hi} onChange={e=>changeHeader(Number(e.target.value))}>{rows.slice(0,15).map((r,i)=><option key={i} value={i}>Dòng {i+1} — {(r||[]).map(x=>String(x==null?'':x).trim()).filter(Boolean).slice(0,3).join(' / ').slice(0,40)}</option>)}</Select></Field>
      </div>
      <div className="rounded-xl border border-line p-3">
        <div className="text-[11px] font-semibold text-ink-muted uppercase tracking-wide mb-2">Ghép cột (tự động gợi ý — chỉnh nếu sai)</div>
        <div className="grid sm:grid-cols-2 gap-2">
          {IMPORT_FIELDS.map(f=><Field key={f.k} label={f.label+(f.req?' *':'')}>
            <Select value={map[f.k]==null?-1:map[f.k]} onChange={e=>setMap({...map,[f.k]:Number(e.target.value)})}>
              <option value={-1}>— Bỏ qua —</option>
              {colOpts.map(o=><option key={o.i} value={o.i}>{o.name}</option>)}
            </Select>
          </Field>)}
        </div>
      </div>
      <div className="rounded-xl border border-line p-3">
        <div className="text-[11px] font-semibold text-ink-muted uppercase tracking-wide mb-2">Mặc định cho cả lần import</div>
        <div className="grid sm:grid-cols-2 gap-2">
          <Field label="Loại"><Select value={def.loai} onChange={e=>setDef({...def,loai:e.target.value})}><option value="SOCIAL">SOCIAL</option><option value="ECOM">ECOM</option></Select></Field>
          <Field label="Mục tiêu (KPI)"><Select value={def.loai_muc_tieu} onChange={e=>setDef({...def,loai_muc_tieu:e.target.value})}>{LOAI_MUC_TIEU_KPI.map(o=><option key={o.v} value={o.v}>{o.label}</option>)}</Select></Field>
          <Field label="Kênh mặc định (nếu file không có)"><Select value={def.kenh_id} onChange={e=>setDef({...def,kenh_id:e.target.value})}><option value="">— Không —</option>{(db.kenh||[]).map(k=><option key={k.id} value={k.id}>{k.ten}</option>)}</Select></Field>
          <Field label="Tháng mặc định (YYYY-MM)"><Input value={def.thang} onChange={e=>setDef({...def,thang:e.target.value})} placeholder="2026-07"/></Field>
        </div>
      </div>
      {(map.tieu_de==null||map.tieu_de<0) ? <div className="text-[11px] text-rose-500">⚠ Chọn cột <b>Tiêu đề</b> để import.</div>
        : <div className="text-xs text-slate-600">Xem trước: <b className="text-brand-dark">{items.length}</b> nội dung hợp lệ. {items[0] && <span className="text-slate-400">VD: “{items[0].tieu_de.slice(0,60)}”</span>}</div>}
    </div>
    : <div>
      <ol className="text-sm text-slate-600 list-decimal ml-4 space-y-1 mb-3">
        <li>Chọn thẳng file <b>.xlsx</b> kế hoạch (ECOM / Social) — app tự đọc sheet, dò dòng tiêu đề &amp; ghép cột.</li>
        <li>Hoặc tải <b>file mẫu .csv</b>, điền rồi chọn lại. Cũng có thể copy từ Excel dán vào ô dưới.</li>
      </ol>
      <div className="text-xs font-mono bg-slate-100 rounded-lg p-2 mb-1 overflow-x-auto whitespace-nowrap">{HEAD.join(' | ')}</div>
      <p className="text-[11px] text-slate-400 mb-2">Loại: ECOM/SOCIAL · Mục tiêu: Bán hàng/Thương hiệu/Kỹ thuật/Kênh đại lý · Pillar/Framework/Kênh/Sản phẩm khớp theo tên (không khớp thì để trống, sửa sau).</p>
      <Textarea rows="6" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Dán từ Excel vào đây…"/>
      {txt.trim() && <div className="text-xs text-slate-600 mt-1">Xem trước: <b className="text-brand-dark">{items.length}</b> nội dung hợp lệ.</div>}
    </div>}

    <div className="flex gap-2 mt-3"><Btn variant="ghost" onClick={onClose} disabled={busy}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={doImport} disabled={busy||!items.length}>{busy?'Đang import…':'Import '+(items.length?('('+items.length+')'):'')}</Btn></div>
  </Modal>;
}

const SCRIPT_ST = { NHAP:'Nháp', CHO_DUYET:'Chờ duyệt', DUYET:'Đã duyệt' };
const SCRIPT_ST_STYLE = { NHAP:'bg-slate-100 text-slate-600', CHO_DUYET:'bg-amber-100 text-amber-700', DUYET:'bg-emerald-100 text-emerald-700' };
// Công cụ Lọc video chạy cục bộ trên máy (File System Access API + AI chạy trong trình duyệt).

// Cầu nối: lọc xong ở công cụ → kéo thẳng file đã chọn vào kho footage (gắn thẻ chung 1 lần)
function CauNoiFootage(){
  const { db, createFootage, uploadMedia, notify } = useApp();
  const [files,setFiles]=useState([]); const [meta,setMeta]=useState({tags:'',san_pham_id:'',dia_diem:'',ngay_quay:'',nguoi_quay:''});
  const [busy,setBusy]=useState(false); const [tien,setTien]=useState({i:0,n:0}); const [keo,setKeo]=useState(false);
  const inputRef=useRef();
  const them=(fl)=>{ const arr=Array.from(fl||[]).filter(f=>/^(video|image)\//.test(f.type)); if(!arr.length) return;
    setFiles(prev=>[...prev, ...arr.filter(f=>!prev.some(p=>p.name===f.name&&p.size===f.size))]); };
  const day=async()=>{ if(!files.length) return notify('Chưa chọn file nào','warn');
    setBusy(true); let ok=0, loi=0;
    for(let i=0;i<files.length;i++){
      setTien({i:i+1,n:files.length});
      try{
        const r=await uploadMedia(files[i]);
        if(!r||!r.media_url){ loi++; continue; }
        const res=await createFootage({ ten:files[i].name.replace(/\.[^.]+$/,''), media_url:r.media_url, media_type:r.media_type||'VIDEO',
          tags:meta.tags.split(',').map(x=>x.trim()).filter(Boolean), san_pham_id:meta.san_pham_id||null,
          dia_diem:meta.dia_diem, ngay_quay:meta.ngay_quay, nguoi_quay:meta.nguoi_quay });
        if(res&&res.ok) ok++; else loi++;
      }catch(e){ loi++; }
    }
    setBusy(false); setTien({i:0,n:0}); setFiles([]);
    notify(loi? ('Đưa vào kho '+ok+' file, '+loi+' file lỗi') : ('Đã đưa '+ok+' file vào Kho footage'), loi?'warn':'ok'); };
  return <div className="bg-white rounded-2xl border border-line shadow-card p-4 space-y-3">
    <div>
      <div className="text-sm font-semibold text-ink">📥 Đưa file đã lọc vào Kho footage</div>
      <div className="text-[11px] text-slate-500 mt-0.5 leading-relaxed">
        Công cụ lọc chạy trên máy nên <b>không tự đẩy lên được</b>. Lọc xong, mở folder kết quả rồi <b>kéo-thả các file đã chọn</b> vào đây —
        chúng sẽ lên kho, gắn <b>thẻ chung một lần</b>, và dùng lại được cho mọi kịch bản.
      </div>
    </div>
    <div onDragOver={e=>{e.preventDefault(); setKeo(true);}} onDragLeave={()=>setKeo(false)}
      onDrop={e=>{e.preventDefault(); setKeo(false); them(e.dataTransfer.files);}}
      onClick={()=>inputRef.current&&inputRef.current.click()}
      className={"rounded-xl border-2 border-dashed p-6 text-center cursor-pointer transition "+(keo?'border-brand bg-brand-bg':'border-line hover:border-brand/50')}>
      <div className="text-2xl">🎞</div>
      <div className="text-xs text-ink font-semibold mt-1">Kéo-thả video/ảnh vào đây</div>
      <div className="text-[11px] text-slate-400">hoặc bấm để chọn file</div>
      <input ref={inputRef} type="file" multiple accept="video/*,image/*" className="hidden" onChange={e=>{them(e.target.files); e.target.value='';}}/>
    </div>
    {files.length>0 && <>
      <div className="flex items-center justify-between">
        <span className="text-xs font-semibold text-ink">{files.length} file đã chọn</span>
        <button onClick={()=>setFiles([])} className="text-[11px] text-rose-400 hover:underline" disabled={busy}>Bỏ hết</button>
      </div>
      <div className="max-h-32 overflow-y-auto space-y-0.5">{files.map((f,i)=>
        <div key={i} className="flex items-center gap-2 text-[11px] text-slate-600">
          <span className="flex-1 truncate">{f.name}</span>
          <span className="text-slate-400 shrink-0">{(f.size/1048576).toFixed(1)} MB</span>
          <button onClick={()=>setFiles(p=>p.filter((_,j)=>j!==i))} className="text-rose-400 shrink-0" disabled={busy}>✕</button>
        </div>)}
      </div>
      <div className="rounded-xl border border-line p-2">
        <div className="text-[11px] font-semibold text-ink-muted uppercase tracking-wide mb-1">Gắn chung cho cả lô</div>
        <Field label="Thẻ (tag)" hint="Cách nhau bằng dấu phẩy — để sau tìm lại nhanh">
          <Input value={meta.tags} onChange={e=>setMeta({...meta,tags:e.target.value})} placeholder="chít mạch, cận cảnh"/></Field>
        <div className="grid sm:grid-cols-2 gap-2">
          <Field label="Sản phẩm"><Select value={meta.san_pham_id} onChange={e=>setMeta({...meta,san_pham_id:e.target.value})}><option value="">—</option>{(db.san_pham||[]).map(p=><option key={p.id} value={p.id}>{p.ten}</option>)}</Select></Field>
          <Field label="Địa điểm"><Input value={meta.dia_diem} onChange={e=>setMeta({...meta,dia_diem:e.target.value})}/></Field>
          <Field label="Ngày quay"><Input type="date" value={meta.ngay_quay} onChange={e=>setMeta({...meta,ngay_quay:e.target.value})}/></Field>
          <Field label="Người quay"><Input value={meta.nguoi_quay} onChange={e=>setMeta({...meta,nguoi_quay:e.target.value})}/></Field>
        </div>
      </div>
      {busy && <div className="text-[11px] text-brand-dark font-semibold">Đang đưa lên… {tien.i}/{tien.n}</div>}
      <Btn variant="brand" className="w-full" onClick={day} disabled={busy}>{busy?('Đang xử lý '+tien.i+'/'+tien.n):('📥 Đưa '+files.length+' file vào Kho footage')}</Btn>
      <p className="text-[10px] text-slate-400">File &gt;100MB sẽ bị từ chối — với video lớn, nén ở công cụ trước rồi mới đẩy lên.</p>
    </>}
  </div>;
}

/* ============================================================
   CONTENT OS · P6 — HÀNG ĐỢI DUYỆT 2 CỔNG (nội dung · claim)

const GATE_LABEL = { NOI_DUNG:'Nội dung', CLAIM:'Claim (Kỹ thuật)' };
const GATE_ICON  = { NOI_DUNG:'📝', CLAIM:'🧪' };
const AP_ST = { CHO:'Chờ', DAT:'Đạt', TRA_LAI:'Trả lại', HUY:'Đã huỷ' };
const AP_ST_STYLE = { CHO:'bg-amber-100 text-amber-700', DAT:'bg-emerald-100 text-emerald-700', TRA_LAI:'bg-rose-100 text-rose-700', HUY:'bg-slate-100 text-slate-400' };
// Ai được quyết cổng nào — khớp canDecideGate ở worker
function canDecideGateFE(me, cong){
  if(!me) return false;
  if(me.vai_tro===ROLES.ADMIN) return true;
  if(cong==='NOI_DUNG') return me.vai_tro===ROLES.MARKETING;
  if(cong==='CLAIM') return me.vai_tro===ROLES.KY_THUAT;
  return false;
}
// Khối trạng thái 2 cổng + nút Gửi duyệt, nhúng trong trình soạn
function ApprovalStatus({doi_tuong, doi_tuong_id, trang_thai, canSubmit}){
  const { db, submitApproval, notify } = useApp();
  const [busy,setBusy]=useState(false);
  const gates=(db.approvals||[]).filter(a=>a.doi_tuong===doi_tuong && a.doi_tuong_id===doi_tuong_id);
  const active=gates.filter(g=>g.trang_thai!=='HUY');
  const send=async()=>{ if(!canSubmit) return notify('Còn cụm bị CHẶN, không gửi duyệt được','err');
    setBusy(true); const r=await submitApproval(doi_tuong,doi_tuong_id); setBusy(false);
    if(r&&r.ok) notify('Đã gửi duyệt — chờ 2 cổng: Nội dung & Claim');
    else if(r&&r.blocked) notify('Bị chặn: '+r.blocked.join(', '),'err');
    else if(r&&r.msg) notify(r.msg,'err'); };
  const done = trang_thai==='DUYET';
  return <div className="bg-white rounded-2xl border border-line shadow-card p-4">
    <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
      <div className="text-sm font-semibold text-ink">Duyệt 2 cổng song song</div>
      {done ? <span className="text-[11px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-semibold">✓ Đã duyệt</span>
        : trang_thai==='CHO_DUYET' ? <span className="text-[11px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-semibold">Đang chờ duyệt</span>
        : <Btn variant="brand" onClick={send} disabled={busy||!canSubmit}>{busy?'Đang gửi…':'📤 Gửi duyệt'}</Btn>}
    </div>
    {active.length===0 ? <div className="text-[11px] text-slate-400">Chưa gửi duyệt. Cả 2 cổng phải Đạt thì nội dung mới được duyệt.</div>
      : <div className="grid sm:grid-cols-2 gap-2">{active.map(g=>
        <div key={g.id} className="rounded-xl border border-line p-2">
          <div className="flex items-center gap-1.5">
            <span>{GATE_ICON[g.cong]}</span>
            <span className="text-xs font-semibold text-ink flex-1">{GATE_LABEL[g.cong]}</span>
            <span className={"text-[10px] px-1.5 py-0.5 rounded-full font-semibold "+(AP_ST_STYLE[g.trang_thai]||'')}>{AP_ST[g.trang_thai]}</span>
          </div>
          {g.nguoi_duyet_ten && <div className="text-[10px] text-slate-400 mt-1">{g.nguoi_duyet_ten} · {fmtDate(g.decided_at)}</div>}
          {g.ghi_chu && <div className="text-[11px] text-rose-600 mt-1">“{g.ghi_chu}”</div>}
        </div>)}
      </div>}
    {trang_thai==='NHAP' && gates.some(g=>g.trang_thai==='TRA_LAI') && <div className="text-[11px] text-rose-600 mt-2">Đã bị trả lại — sửa theo góp ý rồi bấm <b>Gửi duyệt</b> lại.</div>}
  </div>;
}
// Màn hàng đợi: mỗi người chỉ thấy việc thuộc cổng mình có quyền

    else { setReject(a); setLy(''); } };

  return <div className="space-y-4">

          <div className="font-display font-bold text-ink text-sm mt-2">{o.tieu_de||o.hook||'(không tên)'}</div>
          {o.hook && o.tieu_de && <div className="text-xs text-slate-500 mt-0.5">{o.hook}</div>}
          {Array.isArray(o.sections) && o.sections.length>0 && <div className="mt-2 space-y-1">
            {o.sections.map((s,i)=><div key={i} className="text-xs"><span className="font-semibold text-brand-dark">{s.label}: </span><span className="text-slate-600">{s.text}</span></div>)}
          </div>}
          {o.cta && <div className="text-xs text-slate-600 mt-1"><b>CTA:</b> {o.cta}</div>}
          {a.cong==='CLAIM' && <div className="mt-2 rounded-xl bg-slate-50 border border-line p-2">
            <div className="text-[11px] font-semibold text-ink-muted mb-1">Rà claim:</div>
            {flags.length===0 ? <div className="text-[11px] text-emerald-600">✓ Không chạm cụm từ cấm nào trong danh sách.</div>
              : <ul className="space-y-0.5">{flags.map((x,i)=><li key={i} className="text-[11px] text-amber-700">⚠ “{x.cum_tu}”{x.ly_do?' — '+x.ly_do:''}</li>)}</ul>}
          </div>}
          {Number(o.so_lan_tra)>0 && <div className="text-[10px] text-rose-500 mt-1">Đã bị trả lại {o.so_lan_tra} lần</div>}
          {can ? <div className="flex gap-2 mt-3">
              <Btn variant="ghost" onClick={()=>decide(a,'TRA_LAI')} disabled={busy}>↩ Trả lại</Btn>
              <Btn variant="brand" className="flex-1" onClick={()=>decide(a,'DAT')} disabled={busy}>✓ Duyệt cổng {GATE_LABEL[a.cong]}</Btn>
            </div>
            : <div className="text-[11px] text-slate-400 mt-3">Chờ {GATE_LABEL[a.cong]} duyệt — bạn không có quyền ở cổng này.</div>}
        </div>; })}
      </div>}
    {reject && <Modal open={true} onClose={()=>setReject(null)} title="Trả lại — nêu lý do">
      <p className="text-xs text-slate-500 mb-2">Lý do sẽ hiện cho người soạn để sửa. Cổng còn lại sẽ tự huỷ.</p>
      <Textarea rows="3" value={ly} onChange={e=>setLy(e.target.value)} placeholder="VD: Thiếu căn cứ thông số, câu chốt thổi phồng…"/>
      <div className="flex gap-2 mt-3"><Btn variant="ghost" onClick={()=>setReject(null)} disabled={busy}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={doReject} disabled={busy}>{busy?'…':'Trả lại'}</Btn></div>
    </Modal>}
  </div>;
}

/* ============================================================
   CONTENT OS · P7 — ĐĂNG & CHECKLIST (thủ công) + khoá mã theo dõi
============================================================ */
function AirPosts(){
  const { db, createAir, deleteAir, notify } = useApp();

  const [tab,setTab]=useState('CHUAN_BI');
  const [pick,setPick]=useState(false);       // modal chọn nội dung đã duyệt

  // nguồn: kịch bản + nội dung ĐÃ DUYỆT mà chưa có bài đăng
  const used=new Set(posts.map(p=>p.script_id||p.content_item_id));
  const ready=[
    ...(db.scripts||[]).filter(s=>s.trang_thai==='DUYET'&&!used.has(s.id)).map(s=>({...s,_loai:'SCRIPT'})),
    ...(db.content_items||[]).filter(c=>c.trang_thai==='DUYET'&&!used.has(c.id)).map(c=>({...c,_loai:'CONTENT'})),
  ];
  const list=posts.filter(p=>tab==='DEN_GIO'?(p.trang_thai==='DEN_GIO'||p.trang_thai==='LOI'):tab==='DA_LEN_LICH'?(p.trang_thai==='DA_LEN_LICH'||p.trang_thai==='DANG_GUI'):p.trang_thai===tab);
  const add=async(o)=>{ const r=await createAir(o._loai==='SCRIPT'?{script_id:o.id}:{content_item_id:o.id});
    if(r&&r.ok){ notify('Đã đưa vào khâu đăng'); setPick(false); setOpen(r.id); } else notify((r&&r.msg)||'Lỗi','err'); };
  const cur = open ? posts.find(p=>p.id===open) : null;
  if(cur) return <AirEditor post={cur} onClose={()=>setOpen(null)}/>;
  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <h2 className="font-display text-lg font-bold text-ink">🚀 Đăng bài</h2>
      <Btn variant="brand" onClick={()=>setPick(true)}>＋ Đưa nội dung vào đăng</Btn>
    </div>
    <div className="bg-white rounded-2xl border border-line shadow-card p-3 text-[11px] text-slate-500">
      App <b>không tự đăng</b> (nền tảng không cho phép) — bạn đăng tay theo checklist, rồi dán link + <b>mã theo dõi</b>.
      Mỗi <b>mã chỉ thuộc 1 bài</b>, nhờ vậy bước đo lường sau này quy đơn được chính xác thay vì chia đều theo phỏng đoán.
    </div>
    <div className="flex gap-1 bg-slate-100 rounded-xl p-1 w-fit">
      {[['CHUAN_BI','Đang chuẩn bị'],['DA_LEN_LICH','Đã lên lịch'],['DEN_GIO','Cần xử lý'],['DA_DANG','Đã đăng']].map(([k,l])=>
        <button key={k} onClick={()=>setTab(k)} className={"px-3 py-1 rounded-lg text-xs font-semibold "+(tab===k?'bg-white text-ink shadow-sm':'text-slate-500')}>
          {l} ({posts.filter(p=>k==='DEN_GIO'?(p.trang_thai==='DEN_GIO'||p.trang_thai==='LOI'):k==='DA_LEN_LICH'?(p.trang_thai==='DA_LEN_LICH'||p.trang_thai==='DANG_GUI'):p.trang_thai===k).length})</button>)}
    </div>
    {list.length===0 ? <Empty>{tab==='CHUAN_BI'?'Chưa có bài nào đang chuẩn bị.':'Chưa có bài nào được đánh dấu đã đăng.'}</Empty> :
      <div className="grid sm:grid-cols-2 gap-3">{list.map(p=>{
        const done=(db.air_checklist||[]).filter(c=>(p.checklist||{})[c.k]).length;
        const total=(db.air_checklist||[]).length;
        return <div key={p.id} className="bg-white rounded-2xl border border-line shadow-card p-3">
          <div className="flex items-start justify-between gap-2">
            <div className="font-display font-bold text-ink text-sm flex-1 min-w-0">{p.tieu_de||'(không tên)'}</div>
            <span className={"text-[10px] px-1.5 py-0.5 rounded-full font-semibold shrink-0 "+(AIR_ST_STYLE[p.trang_thai]||'bg-slate-100 text-slate-600')}>{AIR_ST_LABEL[p.trang_thai]||p.trang_thai}</span>
          </div>
          <div className="flex flex-wrap gap-1 mt-2">
            <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600">{kenhTen(p.kenh_id)}</span>
            {p.ma_theo_doi ? <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-brand/10 text-brand-dark font-mono">{p.ma_theo_doi}</span>
              : <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-rose-50 text-rose-500">chưa có mã</span>}
            <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-500">✓ {done}/{total}</span>
            {p.lich_dang && p.trang_thai!=='DA_DANG' && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-blue-50 text-blue-600">{p.tu_dong?'🤖 tự động':'🔔 nhắc'} {fmtDate(p.lich_dang)}</span>}
          </div>
          <div className="flex items-center justify-between mt-3 pt-2 border-t border-line/60">
            <span className="text-[10px] text-slate-400">{p.nguoi_dang_ten||''}</span>
            <div className="flex gap-2">
              {p.trang_thai!=='DA_DANG' && <button onClick={()=>{ if(confirm('Xoá bài đăng này?')) deleteAir(p.id).then(ok=>ok&&notify('Đã xoá')); }} className="text-xs text-rose-400 hover:underline">Xoá</button>}

            </div>
          </div>
