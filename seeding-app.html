    {pick && <Modal open={true} onClose={()=>setPick(false)} title="Chọn nội dung ĐÃ DUYỆT để đăng" wide>
      {ready.length===0 ? <Empty>Chưa có nội dung nào đã duyệt (hoặc đã đưa vào đăng hết). Duyệt xong ở Hàng đợi duyệt sẽ hiện ở đây.</Empty> :
        <div className="space-y-2">{ready.map(o=>
          <button key={o.id} onClick={()=>add(o)} className="w-full text-left rounded-xl border border-line p-2 hover:border-brand transition">
            <div className="flex items-center gap-2">
              <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600">{o._loai==='SCRIPT'?'Kịch bản':'Nội dung'}</span>
              <span className="text-sm font-semibold text-ink flex-1 truncate">{o.tieu_de||o.hook||'(không tên)'}</span>
            </div>
          </button>)}
        </div>}
    </Modal>}
  </div>;
}
function AirEditor({post, onClose}){
  const { db, patchAir, publishAir, notify } = useApp();
  const CL = db.air_checklist||AIR_CHECKLIST_FE;
  const [f,setF]=useState({ kenh_id:post.kenh_id||'', tieu_de:post.tieu_de||'', ngay_dang:post.ngay_dang||'', link_bai:post.link_bai||'', ma_theo_doi:post.ma_theo_doi||'', loai_ma:post.loai_ma||'VOUCHER', ghi_chu:post.ghi_chu||'', media_url:post.media_url||'' });
  const [pickFt,setPickFt]=useState(false);
  const [cl,setCl]=useState(post.checklist||{});
  const [busy,setBusy]=useState(false);
  const posted = post.trang_thai==='DA_DANG';
  const missing = CL.filter(c=>c.bat_buoc && !cl[c.k]);
  const save=async()=>{ setBusy(true); const r=await patchAir(post.id,{...f, checklist:cl}); setBusy(false);
    if(r&&r.ok) notify('Đã lưu'); else notify((r&&r.msg)||'Lỗi','err'); return r&&r.ok; };
  const publish=async()=>{ const okSave=await save(); if(!okSave) return;
    setBusy(true); const r=await publishAir(post.id); setBusy(false);
    if(r&&r.ok) notify('Đã đánh dấu ĐÃ ĐĂNG');
    else if(r&&r.thieu) notify('Còn thiếu: '+r.thieu.join(' · '),'err');
    else notify((r&&r.msg)||'Lỗi','err'); };
  return <div className="space-y-4">
    <div className="flex items-center gap-2">
      <button onClick={onClose} className="text-sm text-slate-500 hover:underline">← Danh sách</button>
      <h2 className="font-display text-lg font-bold text-ink flex-1 truncate">{f.tieu_de||'Bài đăng'}</h2>
      {posted && <span className="text-[11px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-semibold">✓ Đã đăng</span>}
    </div>

    <div className="bg-white rounded-2xl border border-line shadow-card p-4 space-y-2">
      <div className="grid sm:grid-cols-2 gap-2">
        <Field label="Tiêu đề"><Input value={f.tieu_de} onChange={e=>setF({...f,tieu_de:e.target.value})} disabled={posted}/></Field>
        <Field label="Kênh"><Select value={f.kenh_id} onChange={e=>setF({...f,kenh_id:e.target.value})} disabled={posted}><option value="">— Chọn —</option>{(db.kenh||[]).filter(k=>k.active!==false).map(k=><option key={k.id} value={k.id}>{k.ten}</option>)}</Select></Field>
        <Field label="Ngày đăng"><Input type="date" value={f.ngay_dang} onChange={e=>setF({...f,ngay_dang:e.target.value})} disabled={posted}/></Field>
        <Field label="Loại mã"><Select value={f.loai_ma} onChange={e=>setF({...f,loai_ma:e.target.value})} disabled={posted}>{LOAI_MA.map(o=><option key={o.v} value={o.v}>{o.label}</option>)}</Select></Field>
      </div>
      <Field label="Mã theo dõi" required hint="1 mã chỉ dùng cho 1 bài — để bước đo lường quy đơn chính xác">
        <Input value={f.ma_theo_doi} onChange={e=>setF({...f,ma_theo_doi:e.target.value})} placeholder="VD: KM-T7-001" className="font-mono" disabled={posted}/></Field>
      <Field label="Link bài đã đăng" required><Input value={f.link_bai} onChange={e=>setF({...f,link_bai:e.target.value})} placeholder="https://…" disabled={posted}/></Field>
      <Field label="Media để đăng" hint="Bắt buộc nếu để hệ thống/n8n tự đăng — chọn từ Kho footage hoặc dán link">
        <div className="flex gap-2">
          <Input value={f.media_url} onChange={e=>setF({...f,media_url:e.target.value})} placeholder="/media/… hoặc https://…" disabled={posted}/>
          {!posted && <Btn variant="ghost" onClick={()=>setPickFt(true)}>🎞 Kho</Btn>}
        </div></Field>
      <Field label="Ghi chú"><Textarea rows="2" value={f.ghi_chu} onChange={e=>setF({...f,ghi_chu:e.target.value})} disabled={posted}/></Field>
    </div>

    <div className="bg-white rounded-2xl border border-line shadow-card p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-semibold text-ink">Checklist trước khi đăng</div>
        <span className={"text-[11px] px-2 py-0.5 rounded-full font-semibold "+(missing.length?'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700')}>
          {missing.length? missing.length+' mục bắt buộc còn thiếu' : 'Đủ mục bắt buộc ✓'}</span>
      </div>
      <div className="space-y-1">{CL.map(c=>
        <label key={c.k} className={"flex items-start gap-2 rounded-xl p-2 "+(posted?'opacity-60':'hover:bg-slate-50 cursor-pointer')}>
          <input type="checkbox" checked={!!cl[c.k]} disabled={posted} onChange={e=>setCl({...cl,[c.k]:e.target.checked})} className="mt-0.5 w-4 h-4 accent-brand shrink-0"/>
          <span className="text-sm text-ink flex-1">{c.label}</span>
          {c.bat_buoc && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-rose-50 text-rose-500 shrink-0">bắt buộc</span>}
        </label>)}
      </div>
    </div>

    {!posted && <LichDangBox post={post} onSaveFirst={save}/>}

    {!posted && <div className="flex flex-wrap gap-2">
      <Btn variant="ghost" onClick={save} disabled={busy}>💾 Lưu nháp</Btn>
      <Btn variant="brand" className="flex-1 min-w-[160px]" onClick={publish} disabled={busy}>{busy?'…':'✓ Đánh dấu ĐÃ ĐĂNG'}</Btn>
    </div>}
    {posted && <div className="text-[11px] text-slate-400">Đã đăng lúc {fmtDate(post.posted_at)} — khoá chỉnh sửa để giữ nguyên dữ liệu quy đơn.</div>}
    {pickFt && <Modal open={true} onClose={()=>setPickFt(false)} title="Chọn media từ Kho footage" wide>
      {(db.footage||[]).filter(x=>x.active!==false).length===0 ? <Empty>Kho footage đang trống.</Empty> :
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-96 overflow-y-auto">
          {(db.footage||[]).filter(x=>x.active!==false).map(ft=>
            <button key={ft.id} onClick={()=>{ setF(v=>({...v,media_url:ft.media_url})); setPickFt(false); }}
              className="rounded-xl border border-line overflow-hidden hover:border-brand transition text-left">
              <div className="bg-slate-900 aspect-video">
                {ft.media_type==='IMAGE'?<img src={ft.media_url} className="w-full h-full object-cover"/>:<video src={ft.media_url} className="w-full h-full object-cover" preload="metadata"/>}
              </div>
              <div className="p-1.5 text-[11px] font-semibold text-ink truncate">{ft.ten||'(chưa đặt tên)'}</div>
            </button>)}
        </div>}
    </Modal>}
  </div>;
}

/* ============================================================
   CONTENT OS · TREND — nghiên cứu & triển khai
   Ranh giới: KHÔNG scrape (ToS) · KHÔNG dự đoán viral. Người ghi nhận, người đánh giá.
============================================================ */
function TrendModule(){
  const { db, addTrend, patchTrend, decideTrend, trienKhaiTrend, deleteTrend, notify } = useApp();
  const TR=db.trends||[]; const CHK=db.trend_check||TREND_CHECK_FE;
  const [tab,setTab]=useState('dang_lam'); const [add,setAdd]=useState(false); const [open,setOpen]=useState(null);
  const homNay=new Date().toISOString().slice(0,10);
  const conHan=t=>!t.han_dung || t.han_dung>=homNay;
  const dangLam=TR.filter(t=>['MOI','DANH_GIA','DUYET'].includes(t.trang_thai));
  const xong=TR.filter(t=>['DA_TRIEN_KHAI','TU_CHOI'].includes(t.trang_thai));
  const list = tab==='dang_lam' ? dangLam : xong;
  const sapHet=dangLam.filter(t=>t.han_dung && conHan(t) && (new Date(t.han_dung)-new Date(homNay))/864e5 <= 7);
  const hetHan=dangLam.filter(t=>t.han_dung && !conHan(t));
  const cur = open ? TR.find(t=>t.id===open) : null;
  if(cur) return <TrendDetail trend={cur} onClose={()=>setOpen(null)}/>;
  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <h2 className="font-display text-lg font-bold text-ink">🔥 Trend</h2>
      <Btn variant="brand" onClick={()=>setAdd(true)}>＋ Ghi nhận trend</Btn>
    </div>
    <div className="bg-white rounded-2xl border border-line shadow-card p-3 text-[11px] text-slate-500 leading-relaxed">
      Bạn <b>tự phát hiện và ghi nhận</b> trend (app không tự quét — nền tảng không cho phép), rồi đánh giá theo checklist trước khi làm.
      App <b>không đoán trend sẽ nổ hay không</b> — chỉ giúp kiểm tra <b>có nên làm</b>, <b>có kịp không</b>, và <b>có an toàn không</b>.
    </div>
    {hetHan.length>0 && <div className="rounded-2xl border border-rose-200 bg-rose-50 p-3 text-[11px] text-rose-700">
      ⏰ <b>{hetHan.length} trend đã quá hạn</b> mà chưa triển khai — trend nguội thì làm nữa cũng ít tác dụng, nên bỏ qua để tập trung cái còn kịp.
    </div>}
    {sapHet.length>0 && <div className="rounded-2xl border border-amber-200 bg-amber-50 p-3 text-[11px] text-amber-800">
      ⚡ <b>{sapHet.length} trend sắp hết hạn</b> (còn ≤7 ngày) — quyết sớm kẻo lỡ nhịp.
    </div>}
    <div className="flex gap-1 bg-slate-100 rounded-xl p-1 w-fit">
      <button onClick={()=>setTab('dang_lam')} className={"px-3 py-1 rounded-lg text-xs font-semibold "+(tab==='dang_lam'?'bg-white text-ink shadow-sm':'text-slate-500')}>Đang xử lý ({dangLam.length})</button>
      <button onClick={()=>setTab('xong')} className={"px-3 py-1 rounded-lg text-xs font-semibold "+(tab==='xong'?'bg-white text-ink shadow-sm':'text-slate-500')}>Đã xong ({xong.length})</button>
    </div>
    {list.length===0 ? <Empty>{tab==='dang_lam'?'Chưa có trend nào đang xử lý.':'Chưa có trend nào đã xong.'}</Empty> :
      <div className="grid sm:grid-cols-2 gap-3">{list.map(t=>{
        const dg=t.danh_gia||{}; const dat=CHK.filter(c=>c.bat_buoc&&dg[c.k]).length; const tong=CHK.filter(c=>c.bat_buoc).length;
        return <div key={t.id} className="bg-white rounded-2xl border border-line shadow-card p-3">
          <div className="flex items-start gap-2 flex-wrap">
            <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600">{t.nguon}</span>
            <span className={"text-[10px] px-1.5 py-0.5 rounded-full font-semibold ml-auto "+(TREND_ST_STYLE[t.trang_thai]||'')}>{TREND_ST_FE[t.trang_thai]}</span>
          </div>
          <div className="font-display font-bold text-ink text-sm mt-2">{t.ten}</div>
          {t.mo_ta && <div className="text-xs text-slate-500 mt-0.5 line-clamp-2">{t.mo_ta}</div>}
          <div className="flex items-center gap-2 mt-2 flex-wrap">
            {t.han_dung && <span className={"text-[10px] px-1.5 py-0.5 rounded-full "+(conHan(t)?'bg-slate-100 text-slate-500':'bg-rose-100 text-rose-600 font-semibold')}>
              {conHan(t)?'Hạn '+t.han_dung:'Quá hạn '+t.han_dung}</span>}
            {['MOI','DANH_GIA'].includes(t.trang_thai) && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-500">Đánh giá {dat}/{tong}</span>}
          </div>
          <div className="flex items-center justify-between mt-3 pt-2 border-t border-line/60">
            <span className="text-[10px] text-slate-400">{t.nguoi_de_xuat||''}</span>
            <button onClick={()=>setOpen(t.id)} className="text-xs text-brand-dark font-semibold hover:underline">Mở →</button>
          </div>
        </div>; })}
      </div>}
    {add && <TrendForm onClose={()=>setAdd(false)}/>}
  </div>;
}
function TrendForm({onClose}){
  const { db, addTrend, notify } = useApp();
  const [f,setF]=useState({ten:'',nguon:'TIKTOK',link:'',mo_ta:'',phat_hien_ngay:new Date().toISOString().slice(0,10),han_dung:'',pillar_id:'',san_pham_id:'',rui_ro:''});
  const [busy,setBusy]=useState(false);
  const save=async()=>{ if(!f.ten.trim()) return notify('Nhập tên trend','warn');
    setBusy(true); const r=await addTrend({...f,pillar_id:f.pillar_id||null,san_pham_id:f.san_pham_id||null}); setBusy(false);
    if(r&&r.ok){ notify('Đã ghi nhận trend'); onClose(); } else notify((r&&r.msg)||'Lỗi','err'); };
  return <Modal open={true} onClose={onClose} title="Ghi nhận trend" wide>
    <Field label="Tên trend" required><Input value={f.ten} onChange={e=>setF({...f,ten:e.target.value})} placeholder='VD: Trend "đừng mua nếu chưa biết…"'/></Field>
    <div className="grid sm:grid-cols-2 gap-2">
      <Field label="Nguồn"><Select value={f.nguon} onChange={e=>setF({...f,nguon:e.target.value})}>{TREND_NGUON.map(n=><option key={n} value={n}>{n}</option>)}</Select></Field>
      <Field label="Link tham khảo"><Input value={f.link} onChange={e=>setF({...f,link:e.target.value})} placeholder="https://…"/></Field>
    </div>
    <Field label="Mô tả — trend này là gì, vì sao đáng chú ý" hint="Tự ghi bằng quan sát của bạn; app không đọc nội dung từ link">
      <Textarea rows="3" value={f.mo_ta} onChange={e=>setF({...f,mo_ta:e.target.value})}/></Field>
    <div className="grid sm:grid-cols-2 gap-2">
      <Field label="Phát hiện ngày"><Input type="date" value={f.phat_hien_ngay} onChange={e=>setF({...f,phat_hien_ngay:e.target.value})}/></Field>
      <Field label="Hạn dùng (trend nguội sau)" hint="Để app nhắc trước khi lỡ nhịp"><Input type="date" value={f.han_dung} onChange={e=>setF({...f,han_dung:e.target.value})}/></Field>
    </div>
    <div className="grid sm:grid-cols-2 gap-2">
      <Field label="Gắn trụ cột"><Select value={f.pillar_id} onChange={e=>setF({...f,pillar_id:e.target.value})}><option value="">—</option>{(db.pillars||[]).map(p=><option key={p.id} value={p.id}>{p.ten}</option>)}</Select></Field>
      <Field label="Gắn sản phẩm"><Select value={f.san_pham_id} onChange={e=>setF({...f,san_pham_id:e.target.value})}><option value="">—</option>{(db.san_pham||[]).map(p=><option key={p.id} value={p.id}>{p.ten}</option>)}</Select></Field>
    </div>
    <Field label="Rủi ro cần lưu ý"><Input value={f.rui_ro} onChange={e=>setF({...f,rui_ro:e.target.value})} placeholder="VD: dễ bị hiểu là nói xấu đối thủ"/></Field>
    <div className="flex gap-2 mt-3"><Btn variant="ghost" onClick={onClose} disabled={busy}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={save} disabled={busy}>{busy?'…':'Lưu'}</Btn></div>
  </Modal>;
}
function TrendDetail({trend,onClose}){
  const { db, patchTrend, decideTrend, trienKhaiTrend, deleteTrend, notify } = useApp();
  const CHK=db.trend_check||TREND_CHECK_FE;
  const [dg,setDg]=useState(trend.danh_gia||{});
  const [reject,setReject]=useState(false); const [ly,setLy]=useState(''); const [tk,setTk]=useState(false); const [busy,setBusy]=useState(false);
  const thieu=CHK.filter(c=>c.bat_buoc&&!dg[c.k]);
  const t=(db.trends||[]).find(x=>x.id===trend.id)||trend;
  const tick=async(k,v)=>{ const n={...dg,[k]:v}; setDg(n); await patchTrend(t.id,{danh_gia:n}); };
  const duyet=async()=>{ setBusy(true); const r=await decideTrend(t.id,'DUYET',''); setBusy(false);
    if(r&&r.ok) notify('Đã duyệt — giờ có thể triển khai thành nội dung');
    else if(r&&r.thieu) notify('Còn thiếu: '+r.thieu.join(' · '),'err'); else notify((r&&r.msg)||'Lỗi','err'); };
  const boQua=async()=>{ if(!ly.trim()) return notify('Nhập lý do','warn');
    const r=await decideTrend(t.id,'TU_CHOI',ly.trim()); if(r&&r.ok){ notify('Đã bỏ qua'); setReject(false); } else notify((r&&r.msg)||'Lỗi','err'); };
  return <div className="space-y-4">
    <div className="flex items-center gap-2">
      <button onClick={onClose} className="text-sm text-slate-500 hover:underline">← Danh sách</button>
      <h2 className="font-display text-lg font-bold text-ink flex-1 truncate">{t.ten}</h2>
      <span className={"text-[11px] px-2 py-0.5 rounded-full font-semibold "+(TREND_ST_STYLE[t.trang_thai]||'')}>{TREND_ST_FE[t.trang_thai]}</span>
    </div>
    <div className="bg-white rounded-2xl border border-line shadow-card p-4 space-y-1">
      <div className="flex flex-wrap gap-2 text-[11px]">
        <span className="px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600">{t.nguon}</span>
        {t.phat_hien_ngay && <span className="text-slate-400">Phát hiện {t.phat_hien_ngay}</span>}
        {t.han_dung && <span className="text-slate-400">· Hạn {t.han_dung}</span>}
      </div>
      {t.link && <a href={t.link} target="_blank" rel="noopener noreferrer" className="text-xs text-blue-500 hover:underline break-all block">{t.link}</a>}
      {t.mo_ta && <div className="text-sm text-ink mt-1 whitespace-pre-wrap">{t.mo_ta}</div>}
      {t.rui_ro && <div className="text-[11px] text-amber-700 mt-1">⚠ Rủi ro: {t.rui_ro}</div>}
      {t.ly_do && <div className="text-[11px] text-rose-600 mt-1">Lý do bỏ qua: “{t.ly_do}”</div>}
    </div>

    {['MOI','DANH_GIA'].includes(t.trang_thai) && <div className="bg-white rounded-2xl border border-line shadow-card p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-semibold text-ink">Đánh giá trước khi làm</div>
        <span className={"text-[11px] px-2 py-0.5 rounded-full font-semibold "+(thieu.length?'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700')}>
          {thieu.length?thieu.length+' mục còn thiếu':'Đủ điều kiện ✓'}</span>
      </div>
      <div className="space-y-1">{CHK.map(c=>
        <label key={c.k} className="flex items-start gap-2 rounded-xl p-2 hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" checked={!!dg[c.k]} onChange={e=>tick(c.k,e.target.checked)} className="mt-0.5 w-4 h-4 accent-brand shrink-0"/>
          <span className="text-sm text-ink flex-1">{c.label}</span>
          {c.bat_buoc && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-rose-50 text-rose-500 shrink-0">bắt buộc</span>}
        </label>)}
      </div>
      <div className="text-[10px] text-slate-400 mt-2">Cố ý <b>không có mục chấm điểm khả năng viral</b> — không ai đoán được, và đoán sai sẽ dẫn tới quyết định sai.</div>
      <div className="flex gap-2 mt-3">
        <Btn variant="ghost" onClick={()=>{ setReject(true); setLy(''); }}>Bỏ qua trend</Btn>
        <Btn variant="brand" className="flex-1" onClick={duyet} disabled={busy||thieu.length>0}>{thieu.length?'Tick đủ mục bắt buộc để duyệt':'✓ Duyệt triển khai'}</Btn>
      </div>
    </div>}

    {t.trang_thai==='DUYET' && <div className="bg-white rounded-2xl border border-line shadow-card p-4">
      <div className="text-sm font-semibold text-ink mb-1">Triển khai thành nội dung</div>
      <div className="text-[11px] text-slate-500 mb-2">Tạo một mục trong <b>Kế hoạch nội dung</b>, kế thừa trụ cột & sản phẩm của trend, và <b>ghi lại nguồn gốc từ trend nào</b> để sau này truy vết được kết quả.</div>
      <Btn variant="brand" onClick={()=>setTk(true)}>🚀 Đưa vào kế hoạch nội dung</Btn>
    </div>}

    {t.trang_thai==='DA_TRIEN_KHAI' && <div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-3 text-[11px] text-emerald-800">
      ✓ Đã tạo mục trong Kế hoạch nội dung. Mở <b>Content → Kế hoạch</b> để soạn kịch bản và đi tiếp quy trình duyệt → đăng → đo.
    </div>}

    <div className="flex justify-end">
      <button onClick={()=>{ if(confirm('Xoá trend này?')) deleteTrend(t.id).then(ok=>{ if(ok){ notify('Đã xoá'); onClose(); } }); }} className="text-xs text-rose-400 hover:underline">Xoá trend</button>
    </div>

    {reject && <Modal open={true} onClose={()=>setReject(false)} title="Bỏ qua trend — nêu lý do">
      <p className="text-xs text-slate-500 mb-2">Ghi lại để lần sau gặp trend tương tự không mất công đánh giá lại.</p>
      <Textarea rows="3" value={ly} onChange={e=>setLy(e.target.value)} placeholder="VD: không gắn được sản phẩm nào, rủi ro hiểu nhầm…"/>
      <div className="flex gap-2 mt-3"><Btn variant="ghost" onClick={()=>setReject(false)}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={boQua}>Bỏ qua</Btn></div>
    </Modal>}
    {tk && <TrendTrienKhai trend={t} onClose={()=>setTk(false)} onDone={onClose}/>}
  </div>;
}
function TrendTrienKhai({trend,onClose,onDone}){
  const { db, trienKhaiTrend, notify } = useApp();
  const [f,setF]=useState({tieu_de:'[Trend] '+trend.ten, loai:'SOCIAL', loai_muc_tieu:'THUONG_HIEU', kenh_id:'', framework_id:'', thang:(trend.han_dung||'').slice(0,7)});
  const [busy,setBusy]=useState(false);
  const go=async()=>{ setBusy(true); const r=await trienKhaiTrend(trend.id,{...f,kenh_id:f.kenh_id||null,framework_id:f.framework_id||null}); setBusy(false);
    if(r&&r.ok){ notify('Đã đưa vào Kế hoạch nội dung'); onClose(); onDone&&onDone(); } else notify((r&&r.msg)||'Lỗi','err'); };
  return <Modal open={true} onClose={onClose} title="Đưa trend vào kế hoạch nội dung" wide>
    <Field label="Tiêu đề nội dung"><Input value={f.tieu_de} onChange={e=>setF({...f,tieu_de:e.target.value})}/></Field>
    <div className="grid sm:grid-cols-2 gap-2">
      <Field label="Loại"><Select value={f.loai} onChange={e=>setF({...f,loai:e.target.value})}><option value="SOCIAL">SOCIAL</option><option value="ECOM">ECOM</option></Select></Field>
      <Field label="Mục tiêu"><Select value={f.loai_muc_tieu} onChange={e=>setF({...f,loai_muc_tieu:e.target.value})}>{LOAI_MUC_TIEU_KPI.map(o=><option key={o.v} value={o.v}>{o.label}</option>)}</Select></Field>
      <Field label="Kênh"><Select value={f.kenh_id} onChange={e=>setF({...f,kenh_id:e.target.value})}><option value="">—</option>{(db.kenh||[]).map(k=><option key={k.id} value={k.id}>{k.ten}</option>)}</Select></Field>
      <Field label="Framework"><Select value={f.framework_id} onChange={e=>setF({...f,framework_id:e.target.value})}><option value="">—</option>{(db.frameworks||[]).map(x=><option key={x.id} value={x.id}>{x.ten}</option>)}</Select></Field>
    </div>
    <Field label="Tháng (YYYY-MM)"><Input value={f.thang} onChange={e=>setF({...f,thang:e.target.value})} placeholder="2026-08"/></Field>
    <div className="flex gap-2 mt-3"><Btn variant="ghost" onClick={onClose} disabled={busy}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={go} disabled={busy}>{busy?'…':'Tạo nội dung'}</Btn></div>
  </Modal>;
}

/* ============================================================
   CONTENT OS · P10 — THƯ VIỆN HỌC (máy rút đề xuất · NGƯỜI quyết)
   Ranh giới: KHÔNG dự đoán viral. Chỉ tổng hợp cái đã quan sát, đủ mẫu mới kết luận.
============================================================ */
const BH_LOAI = { FRAMEWORK:'Framework', CLAIM:'Claim', BRAND_VOICE:'Brand voice', KHAC:'Khác' };
const BH_ST = { DE_XUAT:'Đề xuất', DA_DUYET:'Đã duyệt', TU_CHOI:'Từ chối' };
const BH_ST_STYLE = { DE_XUAT:'bg-amber-100 text-amber-700', DA_DUYET:'bg-emerald-100 text-emerald-700', TU_CHOI:'bg-slate-100 text-slate-400' };
function ThuVienHoc(){
  const { db, quetBaiHoc, addBaiHoc, decideBaiHoc, deleteBaiHoc, notify } = useApp();
  const BH=db.bai_hoc||[]; const minMau=db.min_mau||MIN_MAU;
  const [tab,setTab]=useState('DE_XUAT');
  const [busy,setBusy]=useState(false); const [reject,setReject]=useState(null); const [ly,setLy]=useState(''); const [add,setAdd]=useState(null);
  const list=BH.filter(b=>b.trang_thai===tab);
  const quet=async()=>{ setBusy(true); const r=await quetBaiHoc(); setBusy(false);
    if(r&&r.ok) notify(r.them>0?('Tìm được '+r.them+' đề xuất mới'):'Chưa có đề xuất mới — cần thêm dữ liệu thật');
    else notify((r&&r.msg)||'Lỗi','err'); };
  const duyet=async(b)=>{ const r=await decideBaiHoc(b.id,'DUYET',''); if(r&&r.ok) notify('Đã duyệt — bài học này giờ hiện trong Creative Studio'); else notify((r&&r.msg)||'Lỗi','err'); };
  const tuChoi=async()=>{ if(!ly.trim()) return notify('Nhập lý do từ chối','warn');
    const r=await decideBaiHoc(reject.id,'TU_CHOI',ly.trim()); if(r&&r.ok){ notify('Đã từ chối'); setReject(null); } else notify((r&&r.msg)||'Lỗi','err'); };
  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <h2 className="font-display text-lg font-bold text-ink">🎓 Thư viện học</h2>
      <div className="flex gap-2">
        <Btn variant="ghost" onClick={()=>setAdd({loai:'KHAC'})}>＋ Ghi bài học</Btn>
        <Btn variant="brand" onClick={quet} disabled={busy}>{busy?'Đang quét…':'🔍 Quét dữ liệu'}</Btn>
      </div>
    </div>

    <div className="rounded-2xl border border-brand/30 bg-brand-bg p-3 text-[11px] text-ink-soft leading-relaxed">
      <b>Vòng lặp học:</b> Kết quả thật → máy rút <b>đề xuất</b> → <b>bạn duyệt</b> → bài học đã duyệt hiện lại trong Creative Studio khi soạn kịch bản.
      <div className="mt-1 text-ink-muted">
        Máy <b>chỉ tổng hợp cái đã xảy ra</b>, không dự đoán bài sau sẽ viral hay không. Chưa đủ <b>{minMau}</b> mẫu thì <b>không rút kết luận nào</b> —
        và <b>đề xuất không tự thành quy tắc</b>, phải có người duyệt.
      </div>
    </div>

    <div className="flex gap-1 bg-slate-100 rounded-xl p-1 w-fit">
      {Object.keys(BH_ST).map(k=>
        <button key={k} onClick={()=>setTab(k)} className={"px-3 py-1 rounded-lg text-xs font-semibold "+(tab===k?'bg-white text-ink shadow-sm':'text-slate-500')}>
          {BH_ST[k]} ({BH.filter(b=>b.trang_thai===k).length})</button>)}
    </div>

    {list.length===0 ? <Empty>{tab==='DE_XUAT'?'Chưa có đề xuất. Bấm “Quét dữ liệu” sau khi đã có kết quả thật.':'Chưa có mục nào.'}</Empty> :
      <div className="space-y-2">{list.map(b=>
        <div key={b.id} className="bg-white rounded-2xl border border-line shadow-card p-3">
          <div className="flex items-start gap-2 flex-wrap">
            <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-brand/10 text-brand-dark font-semibold">{BH_LOAI[b.loai]||b.loai}</span>
            {Number(b.so_mau)>0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600">{b.so_mau} mẫu</span>}
            {Number(b.nguon_tu_dong)===1 && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-500">máy rút</span>}
            <span className={"text-[10px] px-1.5 py-0.5 rounded-full font-semibold ml-auto "+(BH_ST_STYLE[b.trang_thai]||'')}>{BH_ST[b.trang_thai]}</span>
          </div>
          <div className="font-display font-bold text-ink text-sm mt-2">{b.tieu_de}</div>
          {b.noi_dung && <div className="text-xs text-slate-600 mt-1 leading-relaxed">{b.noi_dung}</div>}
          {b.ghi_chu && <div className="text-[11px] text-rose-600 mt-1">Lý do: “{b.ghi_chu}”</div>}
          {b.nguoi_duyet_ten && <div className="text-[10px] text-slate-400 mt-1">{b.nguoi_duyet_ten} · {fmtDate(b.decided_at)}</div>}
          {b.trang_thai==='DE_XUAT'
            ? <div className="flex gap-2 mt-3">
                <Btn variant="ghost" onClick={()=>{ setReject(b); setLy(''); }}>Từ chối</Btn>
                <Btn variant="brand" className="flex-1" onClick={()=>duyet(b)}>✓ Duyệt thành bài học</Btn>
              </div>
            : <div className="flex justify-end mt-2">
                <button onClick={()=>{ if(confirm('Xoá bài học này?')) deleteBaiHoc(b.id).then(ok=>ok&&notify('Đã xoá')); }} className="text-xs text-rose-400 hover:underline">Xoá</button>
              </div>}
        </div>)}
      </div>}

    {reject && <Modal open={true} onClose={()=>setReject(null)} title="Từ chối đề xuất">
      <p className="text-xs text-slate-500 mb-2">Ghi lý do để lần quét sau bạn (hoặc người khác) biết vì sao đã bỏ.</p>
      <Textarea rows="3" value={ly} onChange={e=>setLy(e.target.value)} placeholder="VD: mẫu chưa đại diện, do đợt khuyến mãi…"/>
      <div className="flex gap-2 mt-3"><Btn variant="ghost" onClick={()=>setReject(null)}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={tuChoi}>Từ chối</Btn></div>
    </Modal>}
    {add && <Modal open={true} onClose={()=>setAdd(null)} title="Ghi bài học (tự rút)">
      <BaiHocForm onClose={()=>setAdd(null)}/>
    </Modal>}
  </div>;
}
function BaiHocForm({onClose}){
  const { addBaiHoc, notify } = useApp();
  const [f,setF]=useState({loai:'KHAC',tieu_de:'',noi_dung:''});
  const save=async()=>{ if(!f.tieu_de.trim()) return notify('Nhập tiêu đề','warn');
    const ok=await addBaiHoc(f); if(ok){ notify('Đã ghi — vẫn cần duyệt để thành bài học'); onClose(); } };
  return <>
    <Field label="Loại"><Select value={f.loai} onChange={e=>setF({...f,loai:e.target.value})}>{Object.keys(BH_LOAI).map(k=><option key={k} value={k}>{BH_LOAI[k]}</option>)}</Select></Field>
    <Field label="Tiêu đề" required><Input value={f.tieu_de} onChange={e=>setF({...f,tieu_de:e.target.value})} placeholder="VD: Hook hỏi ngược hiệu quả với tệp thầu thợ"/></Field>
    <Field label="Nội dung / bằng chứng"><Textarea rows="4" value={f.noi_dung} onChange={e=>setF({...f,noi_dung:e.target.value})} placeholder="Ghi rõ quan sát dựa trên bài nào, số liệu nào…"/></Field>
    <div className="flex gap-2 mt-2"><Btn variant="ghost" onClick={onClose}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={save}>Lưu</Btn></div>
  </>;
}

/* ============================================================
   CONTENT OS · P9 — DASHBOARD 4 HỆ KPI + HIỆU SUẤT NGƯỜI (Process ≠ Outcome)
   Nguyên tắc: KHÔNG cộng dồn 3 mức tin cậy · KHÔNG xếp hạng khi chưa đủ mẫu.
============================================================ */
const MIN_MAU = 5;   // dưới ngưỡng này thì hiện số nhưng KHÔNG xếp hạng (tránh oan cho người ít việc)
// Nhắc việc — chỉ hiện việc ĐANG KẸT quá ngưỡng, kèm số ngày để lâu. Hết kẹt thì tự biến mất.
function ViecKet(){
  const { db } = useApp();
  const v = db.viec_ket || tinhViecKetFE(db);
  const [mo,setMo]=useState(false);
  if(!v || v.tong===0) return <div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-3 text-[11px] text-emerald-800">
    ✓ Không có việc nào đang kẹt. Mọi khâu đang chạy đúng nhịp.</div>;
  const N=v.nguong||NGUONG_KET_FE;
  const Nhom=({icon,ten,items,mo_ta,render})=> items.length===0?null:<div className="rounded-xl border border-line p-2">
    <div className="text-xs font-semibold text-ink">{icon} {ten} <span className="text-rose-600">({items.length})</span></div>
    <div className="text-[10px] text-slate-400 mb-1">{mo_ta}</div>
    <ul className="space-y-0.5">{items.slice(0,5).map((x,i)=><li key={i} className="text-[11px] text-slate-600">• {render(x)}</li>)}
      {items.length>5 && <li className="text-[11px] text-slate-400">… và {items.length-5} mục nữa</li>}</ul>
  </div>;
  return <div className="rounded-2xl border border-amber-200 bg-amber-50 p-3">
    <button onClick={()=>setMo(m=>!m)} className="w-full flex items-center justify-between text-left">
      <span className="text-sm font-semibold text-amber-900">🔔 {v.tong} việc đang kẹt</span>
      <span className="text-[11px] text-amber-700">{mo?'Thu gọn ▲':'Xem chi tiết ▼'}</span>
    </button>
    {!mo && <div className="text-[11px] text-amber-700 mt-1">
      {[v.sua_lai.length&&v.sua_lai.length+' kịch bản bị trả chưa sửa', v.cho_duyet.length&&v.cho_duyet.length+' cổng duyệt tồn',
        v.chua_nhap_kq.length&&v.chua_nhap_kq.length+' bài chưa nhập kết quả', v.trend_gap.length&&v.trend_gap.length+' trend gấp',
        v.don_ket.length&&v.don_ket.length+' đơn chờ gán'].filter(Boolean).join(' · ')}
    </div>}
    {mo && <div className="space-y-2 mt-2">
      <Nhom icon="✍️" ten="Kịch bản bị trả chưa sửa" items={v.sua_lai} mo_ta={'Để quá '+N.sua_lai+' ngày'} render={x=>x.ten+' — '+x.ngay+' ngày'}/>
      <Nhom icon="🛂" ten="Cổng duyệt còn tồn" items={v.cho_duyet} mo_ta={'Chờ quá '+N.cho_duyet+' ngày'} render={x=>(x.cong==='CLAIM'?'Claim (Kỹ thuật)':'Nội dung')+' — '+x.ngay+' ngày'}/>
      <Nhom icon="📈" ten="Bài đã đăng chưa nhập kết quả" items={v.chua_nhap_kq} mo_ta={'Đăng quá '+N.chua_nhap_kq+' ngày — để lâu sẽ khó đối soát'} render={x=>x.ten+' — '+x.ngay+' ngày'}/>
      <Nhom icon="🔥" ten="Trend sắp/đã hết hạn" items={v.trend_gap} mo_ta="Quyết sớm kẻo lỡ nhịp" render={x=>x.ten+(x.con<0?(' — quá hạn '+(-x.con)+' ngày'):(' — còn '+x.con+' ngày'))}/>
      <Nhom icon="🚀" ten="Bài tới giờ mà chưa lên sóng" items={v.den_gio||[]} mo_ta="Đăng tay ngay hoặc sửa lỗi rồi lên lịch lại" render={x=>x.ten+(x.loi?(' — '+x.loi):'')}/>
      <Nhom icon="🕗" ten="Đơn chờ gán tay" items={v.don_ket} mo_ta={'Tồn quá '+N.don_cho_gan+' ngày — chưa gán thì chưa quy đơn được'} render={x=>(x.ma||'không mã')+' — '+x.ngay+' ngày'}/>
    </div>}
  </div>;
}
// Kế hoạch vs Thực hiện — đối chiếu cái ĐỊNH LÀM với cái ĐÃ LÀM, và chỉ ra nghẽn ở khâu nào
function KeHoachVsThucHien(){
  const { db } = useApp();
  const CI=db.content_items||[], AIR=db.air_posts||[], PIL=db.pillars||[], KENH=db.kenh||[];
  const thangList=[...new Set(CI.map(c=>c.thang).filter(Boolean))].sort().reverse();
  const [thang,setThang]=useState('');
  const inT=c=>!thang || (c.thang||'')===thang;
  const keHoach=CI.filter(inT);
  // "đã đăng" = có bài đăng DA_DANG trỏ về nội dung/kịch bản đó
  const scrOf={}; (db.scripts||[]).forEach(s=>scrOf[s.id]=s);
  const daDangIds=new Set();
  AIR.filter(a=>a.trang_thai==='DA_DANG').forEach(a=>{
    if(a.content_item_id) daDangIds.add(a.content_item_id);
    const sc=a.script_id?scrOf[a.script_id]:null;
    if(sc&&sc.content_item_id) daDangIds.add(sc.content_item_id);
  });
  const daDang=keHoach.filter(c=>daDangIds.has(c.id)).length;
  const pct=keHoach.length?Math.round(daDang/keHoach.length*100):0;
  // kịch bản mồ côi: không nối về kế hoạch → làm mọi con số bên dưới bị thiếu
  const scriptRoi=(db.scripts||[]).filter(s=>!s.content_item_id).length;

  // Nghẽn ở khâu nào: đếm theo trạng thái pipeline
  const theoTrangThai={};
  keHoach.forEach(c=>{ const k=c.trang_thai||'(chưa đặt)'; theoTrangThai[k]=(theoTrangThai[k]||0)+1; });

  // Pillar: tỷ trọng MỤC TIÊU (ty_trong) vs tỷ trọng THỰC TẾ trong kế hoạch
  const pilRows=PIL.filter(p=>p.active!==false).map(p=>{
    const n=keHoach.filter(c=>c.pillar_id===p.id).length;
    const thucTe=keHoach.length?(n/keHoach.length*100):0;
    const mucTieu=Number(p.ty_trong)||0;
    return { ...p, n, thucTe, mucTieu, lech: thucTe-mucTieu };
  });
  const chuaGanPillar=keHoach.filter(c=>!c.pillar_id).length;

  // Kênh
  const kenhRows=KENH.filter(k=>k.active!==false).map(k=>{
    const kh=keHoach.filter(c=>c.kenh_id===k.id).length;
    const dd=keHoach.filter(c=>c.kenh_id===k.id&&daDangIds.has(c.id)).length;
    return { ...k, kh, dd };
  }).filter(k=>k.kh>0);

  const Bar=({a,b,warn})=> <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden">
    <div className="h-full rounded-full" style={{width:Math.min(100,b?Math.round(a/b*100):0)+'%', background:warn?'#f59e0b':'#0a92b4'}}></div></div>;

  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <div className="text-sm font-semibold text-ink">Kế hoạch vs Thực hiện</div>
      <Select value={thang} onChange={e=>setThang(e.target.value)} className="w-auto"><option value="">Tất cả tháng</option>{thangList.map(t=><option key={t} value={t}>{t}</option>)}</Select>
    </div>

    {keHoach.length===0 ? <Empty>Chưa có nội dung nào trong kế hoạch{thang?(' tháng '+thang):''}.</Empty> : <>
      <div className="grid sm:grid-cols-3 gap-3">
        <div className="bg-white rounded-2xl border border-line shadow-card p-3">
          <div className="text-[11px] text-ink-muted uppercase tracking-wide">Đã lên kế hoạch</div>
          <div className="text-2xl font-display font-bold text-ink">{keHoach.length}</div>
        </div>
        <div className="bg-white rounded-2xl border border-line shadow-card p-3">
          <div className="text-[11px] text-ink-muted uppercase tracking-wide">Đã đăng thật</div>
          <div className="text-2xl font-display font-bold text-ink">{daDang}</div>
        </div>
        <div className={"rounded-2xl border shadow-card p-3 "+(pct>=80?'bg-emerald-50 border-emerald-200':pct>=50?'bg-amber-50 border-amber-200':'bg-rose-50 border-rose-200')}>
          <div className="text-[11px] text-ink-muted uppercase tracking-wide">Tỷ lệ hoàn thành</div>
          <div className="text-2xl font-display font-bold text-ink">{pct}%</div>
          <div className="text-[10px] text-ink-muted mt-0.5">{keHoach.length-daDang} mục chưa lên sóng</div>
        </div>
      </div>

      {/* Nghẽn ở khâu nào */}
      <div className="bg-white rounded-2xl border border-line shadow-card p-4">
        <div className="text-sm font-semibold text-ink mb-1">Đang nghẽn ở khâu nào</div>
        <div className="text-[11px] text-slate-500 mb-2">Nhìn chỗ dồn nhiều nhất để biết nên gỡ ở đâu, thay vì chỉ thấy “chậm tiến độ”.</div>
        <div className="space-y-1.5">{Object.keys(theoTrangThai).sort((a,b)=>theoTrangThai[b]-theoTrangThai[a]).map(k=>
          <div key={k} className="flex items-center gap-2">
            <span className="text-xs text-ink w-32 shrink-0 truncate">{(PIPELINE.find(p=>p.v===k)||{}).label||k}</span>
            <div className="flex-1"><Bar a={theoTrangThai[k]} b={keHoach.length}/></div>
            <span className="text-xs font-semibold text-ink w-8 text-right">{theoTrangThai[k]}</span>
          </div>)}
        </div>
      </div>

      {/* Pillar: mục tiêu vs thực tế */}
      <div className="bg-white rounded-2xl border border-line shadow-card p-4">
        <div className="text-sm font-semibold text-ink mb-1">Phân bổ trụ cột — mục tiêu vs thực tế</div>
        <div className="text-[11px] text-slate-500 mb-2">Lệch quá <b>15%</b> nghĩa là đang làm khác chiến lược đã đặt ra.</div>
        {pilRows.length===0 ? <Empty>Chưa có trụ cột.</Empty> :
          <div className="space-y-2">{pilRows.map(p=>{ const lech=Math.abs(p.lech)>15;
            return <div key={p.id}>
              <div className="flex items-center justify-between text-xs">
                <span className="font-semibold text-ink">{p.ten}</span>
                <span className={lech?'text-amber-600 font-semibold':'text-slate-500'}>
                  {Math.round(p.thucTe)}% thực tế / {p.mucTieu}% mục tiêu {lech?(p.lech>0?'· cao hơn':'· thấp hơn'):''}
                </span>
              </div>
              <div className="mt-1"><Bar a={p.thucTe} b={100} warn={lech}/></div>
            </div>; })}
          </div>}
        {chuaGanPillar>0 && <div className="text-[11px] text-amber-600 mt-2">⚠ {chuaGanPillar} nội dung chưa gắn trụ cột — chưa tính vào tỷ lệ trên.</div>}
      </div>

      {/* Cảnh báo mắt xích đứt: kịch bản không nối về kế hoạch thì mọi con số trên đây đều thiếu */}
      {scriptRoi>0 && <div className="rounded-2xl border border-amber-200 bg-amber-50 p-3">
        <div className="text-xs font-semibold text-amber-800">⚠ {scriptRoi} kịch bản chưa nối về mục kế hoạch nào</div>
        <div className="text-[11px] text-amber-700 mt-1 leading-relaxed">
          Những bài này <b>không được tính</b> vào tỷ lệ hoàn thành ở trên, và cũng <b>không vào hệ KPI nào</b> ở tab KPI —
          nghĩa là số thật cao hơn số đang hiển thị. Mở <b>Content → Kịch bản</b>, chọn mục “Thuộc mục kế hoạch nào” để nối lại.
        </div>
      </div>}

      {/* Kênh */}
      {kenhRows.length>0 && <div className="bg-white rounded-2xl border border-line shadow-card p-4">
        <div className="text-sm font-semibold text-ink mb-2">Theo kênh</div>
        <div className="overflow-x-auto">
          <table className="w-full text-xs min-w-[380px]">
            <thead><tr className="text-left text-ink-muted border-b border-line"><th className="py-1.5 pr-2">Kênh</th><th className="py-1.5 px-2">Kế hoạch</th><th className="py-1.5 px-2">Đã đăng</th><th className="py-1.5 px-2">Hoàn thành</th></tr></thead>
            <tbody>{kenhRows.map(k=>
              <tr key={k.id} className="border-b border-line/50">
                <td className="py-1.5 pr-2 font-semibold text-ink">{k.ten}</td>
                <td className="py-1.5 px-2">{k.kh}</td>
                <td className="py-1.5 px-2">{k.dd}</td>
                <td className="py-1.5 px-2">{k.kh?Math.round(k.dd/k.kh*100)+'%':'—'}</td>
              </tr>)}
            </tbody>
          </table>
        </div>
      </div>}
    </>}
  </div>;
}
function ContentDashboard(){
  const { db } = useApp();
  const [view,setView]=useState('kpi');
  const [ky,setKy]=useState('');
  const SCR=db.scripts||[], AIR=db.air_posts||[], KQ=db.ket_qua||[], AP=db.approvals||[], CI=db.content_items||[];
  const kyList=[...new Set(KQ.map(k=>k.ky).filter(Boolean))].sort().reverse();
  const kqIn = KQ.filter(k=>!ky || (k.ky||'')===ky);

  // ---- map bài đăng → kịch bản/nội dung → hệ KPI + người tạo ----
  const airMeta = {};
  AIR.forEach(a=>{
    const src = a.script_id ? SCR.find(s=>s.id===a.script_id) : CI.find(c=>c.id===a.content_item_id);
    const ci  = a.content_item_id ? CI.find(c=>c.id===a.content_item_id) : null;
    airMeta[a.id] = {
      he: (ci&&ci.loai_muc_tieu) || (src&&src.loai_muc_tieu) || '',
      nguoi: (src&&src.created_by_name) || a.nguoi_dang_ten || '',
    };
  });
  const sum=(arr,f)=>arr.reduce((s,x)=>s+(Number(x[f])||0),0);

  // ---- 4 hệ KPI: đếm TÁCH BẠCH, không gộp ----
  const heRows = LOAI_MUC_TIEU_KPI.map(o=>{
    const airs = AIR.filter(a=>(airMeta[a.id]||{}).he===o.v);
    const ids = new Set(airs.map(a=>a.id));
    const kqs = kqIn.filter(k=>ids.has(k.air_post_id));
    return { ...o, soBai:airs.length, daDang:airs.filter(a=>a.trang_thai==='DA_DANG').length,
      tt:kqs.filter(k=>k.muc_tin_cay==='TRUC_TIEP'), gt:kqs.filter(k=>k.muc_tin_cay==='GIAN_TIEP'), kqd:kqs.filter(k=>k.muc_tin_cay==='KHONG_QUY_DON') };
  });
  const chuaGanHe = AIR.filter(a=>!(airMeta[a.id]||{}).he).length;

  // ---- Hiệu suất NGƯỜI: Process (cách làm) tách khỏi Outcome (kết quả) ----
  const submitted = {};   // người → số lần gửi duyệt (đếm theo đối tượng, không theo cổng)
  AP.forEach(a=>{ if(a.cong!=='NOI_DUNG') return; const n=a.nguoi_gui_ten||''; if(!n) return; (submitted[n] ||= []).push(a); });
  const people = [...new Set([...SCR.map(s=>s.created_by_name), ...Object.keys(submitted)].filter(Boolean))];
  const rows = people.map(n=>{
    const mine = SCR.filter(s=>s.created_by_name===n);
    const sent = mine.filter(s=>(submitted[n]||[]).some(a=>a.doi_tuong_id===s.id));
    const duyet = mine.filter(s=>s.trang_thai==='DUYET');
    const lan1 = duyet.filter(s=>Number(s.so_lan_tra||0)===0).length;
    const traTong = mine.reduce((t,s)=>t+Number(s.so_lan_tra||0),0);
    const canhBao = mine.filter(s=>(s.claim_flags||[]).length>0).length;
    const myAir = AIR.filter(a=>(airMeta[a.id]||{}).nguoi===n);
    const ids=new Set(myAir.map(a=>a.id));
    const kqs = kqIn.filter(k=>ids.has(k.air_post_id));
    return { n, soKB:mine.length, soGui:sent.length, duyet:duyet.length, lan1, traTong, canhBao,
      daDang:myAir.filter(a=>a.trang_thai==='DA_DANG').length,
      tt:sum(kqs.filter(k=>k.muc_tin_cay==='TRUC_TIEP'),'doanh_thu'),
      gt:sum(kqs.filter(k=>k.muc_tin_cay==='GIAN_TIEP'),'doanh_thu'),
      view:sum(kqs.filter(k=>k.muc_tin_cay==='KHONG_QUY_DON'),'luot_xem'),
      duMau: mine.length>=MIN_MAU };
  }).sort((a,b)=>b.soKB-a.soKB);

  // ---- Kỹ thuật: đo bằng số claim CHẶN ĐƯỢC, không phải số bài làm ----
  const ktRows = (()=>{ const m={};
    AP.filter(a=>a.cong==='CLAIM' && a.trang_thai==='TRA_LAI').forEach(a=>{ const n=a.nguoi_duyet_ten||''; if(n) m[n]=(m[n]||0)+1; });
    AP.filter(a=>a.cong==='CLAIM' && a.trang_thai==='DAT').forEach(a=>{ const n=a.nguoi_duyet_ten||''; if(n) m[n]=m[n]||0; });
    return Object.keys(m).map(n=>({n, chan:m[n]})).sort((a,b)=>b.chan-a.chan); })();

  const Pct=({a,b})=> b>0 ? <span className="font-semibold text-ink">{Math.round(a/b*100)}%</span> : <span className="text-slate-300">—</span>;
  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <h2 className="font-display text-lg font-bold text-ink">📊 Dashboard nội dung</h2>
      {view==='kpi' && <Select value={ky} onChange={e=>setKy(e.target.value)} className="w-auto"><option value="">Tất cả kỳ</option>{kyList.map(k=><option key={k} value={k}>{k}</option>)}</Select>}
    </div>

    <div className="flex gap-1 bg-slate-100 rounded-xl p-1 w-fit">
      {[['kpi','KPI & hiệu suất'],['kh','Kế hoạch vs Thực hiện']].map(([k,l])=>
        <button key={k} onClick={()=>setView(k)} className={"px-3 py-1 rounded-lg text-xs font-semibold whitespace-nowrap "+(view===k?'bg-white text-ink shadow-sm':'text-slate-500')}>{l}</button>)}
    </div>

    <ViecKet/>

    {view==='kh' ? <KeHoachVsThucHien/> : <>

    <div className="rounded-2xl border border-amber-200 bg-amber-50 p-3 text-[11px] text-amber-800 leading-relaxed">
      <b>Cách đọc bảng này:</b> 4 hệ KPI đo 4 mục tiêu khác nhau nên <b>không so trực tiếp với nhau</b>;
      3 mức tin cậy <b>không được cộng dồn</b> thành “doanh thu từ content”;
      người có dưới <b>{MIN_MAU}</b> kịch bản thì <b>không xếp hạng</b> (chưa đủ mẫu để kết luận).
    </div>

    {/* 4 hệ KPI — mỗi hệ 1 dòng, 3 cột tin cậy tách bạch */}
    <div className="bg-white rounded-2xl border border-line shadow-card p-4">
      <div className="text-sm font-semibold text-ink mb-2">4 hệ KPI (đo riêng, không gộp)</div>
      <div className="overflow-x-auto">
        <table className="w-full text-xs min-w-[560px]">
          <thead><tr className="text-left text-ink-muted border-b border-line">
            <th className="py-1.5 pr-2">Hệ mục tiêu</th><th className="py-1.5 px-2">Bài</th><th className="py-1.5 px-2">Đã đăng</th>
            <th className="py-1.5 px-2 text-emerald-700">Trực tiếp</th><th className="py-1.5 px-2 text-amber-700">Gián tiếp</th><th className="py-1.5 px-2 text-slate-500">Không quy đơn</th>
          </tr></thead>
          <tbody>{heRows.map(h=>
            <tr key={h.v} className="border-b border-line/50">
              <td className="py-1.5 pr-2 font-semibold text-ink">{h.label}</td>
              <td className="py-1.5 px-2">{h.soBai}</td>
              <td className="py-1.5 px-2">{h.daDang}</td>
              <td className="py-1.5 px-2 text-emerald-700">{h.tt.length?sum(h.tt,'doanh_thu').toLocaleString('vi-VN')+'đ':'—'}</td>
              <td className="py-1.5 px-2 text-amber-700">{h.gt.length?sum(h.gt,'doanh_thu').toLocaleString('vi-VN')+'đ':'—'}</td>
              <td className="py-1.5 px-2 text-slate-500">{h.kqd.length?sum(h.kqd,'luot_xem').toLocaleString('vi-VN')+' xem':'—'}</td>
            </tr>)}
          </tbody>
        </table>
      </div>
      {chuaGanHe>0 && <div className="text-[11px] text-amber-600 mt-2">⚠ {chuaGanHe} bài chưa gắn hệ mục tiêu → không vào hệ nào. Bổ sung ở Kế hoạch nội dung để số liệu đủ.</div>}
      <div className="text-[10px] text-slate-400 mt-2">Cột trống nghĩa là <b>chưa có dữ liệu</b> — không phải bằng 0.</div>
    </div>

    {/* Hiệu suất người — Process */}
    <div className="bg-white rounded-2xl border border-line shadow-card p-4">
      <div className="text-sm font-semibold text-ink">Hiệu suất người — <span className="text-brand-dark">Cách làm (Process)</span></div>
      <div className="text-[11px] text-slate-500 mb-2">Đo <b>cách làm việc</b>, không phụ thuộc may rủi thị trường. Đây là phần công bằng nhất để nhận xét.</div>
      {rows.length===0 ? <Empty>Chưa có dữ liệu.</Empty> :
        <div className="overflow-x-auto">
          <table className="w-full text-xs min-w-[560px]">
            <thead><tr className="text-left text-ink-muted border-b border-line">
              <th className="py-1.5 pr-2">Người</th><th className="py-1.5 px-2">Kịch bản</th><th className="py-1.5 px-2">Đã duyệt</th>
              <th className="py-1.5 px-2">Qua lần 1</th><th className="py-1.5 px-2">Bị trả</th><th className="py-1.5 px-2">Bài có cảnh báo claim</th>
            </tr></thead>
            <tbody>{rows.map(r=>
              <tr key={r.n} className="border-b border-line/50">
                <td className="py-1.5 pr-2 font-semibold text-ink">{r.n}{!r.duMau && <span className="ml-1 text-[9px] px-1 py-0.5 rounded bg-slate-100 text-slate-400">chưa đủ mẫu</span>}</td>

   CONTENT OS · P5 — KHO FOOTAGE + SHOT LIST (mobile-first, R2)

const SHOT_ST = { CHUA_QUAY:'Chưa quay', DA_QUAY:'Đã quay', DAT:'Đạt' };
const SHOT_ST_STYLE = { CHUA_QUAY:'bg-slate-100 text-slate-500', DA_QUAY:'bg-amber-100 text-amber-700', DAT:'bg-emerald-100 text-emerald-700' };
function FootageLib(){
  const { db, createFootage, patchFootage, deleteFootage, uploadMedia, notify } = useApp();
  const FT=db.footage||[];
  const [tab,setTab]=useState('kho');
  const [q,setQ]=useState(''); const [tag,setTag]=useState('');
  const [edit,setEdit]=useState(null); const [up,setUp]=useState(0); const fileRef=useRef();
  const allTags=[...new Set(FT.flatMap(f=>f.tags||[]))].sort();
  const list=FT.filter(f=>f.active!==false)
    .filter(f=>!tag || (f.tags||[]).includes(tag))
    .filter(f=>!q || (f.ten||'').toLowerCase().includes(q.toLowerCase()) || (f.mo_ta||'').toLowerCase().includes(q.toLowerCase()) || (f.tags||[]).some(t=>t.toLowerCase().includes(q.toLowerCase())));
  const onFile=async e=>{ const fl=e.target.files&&e.target.files[0]; e.target.value=''; if(!fl) return;
    setUp(1);
    try{ const r=await uploadMedia(fl,(p)=>setUp(Math.max(1,p)));
      setUp(0);
      if(r&&r.media_url) setEdit({ media_url:r.media_url, media_type:r.media_type||'VIDEO', ten:fl.name.replace(/\.[^.]+$/,''), tags:[] });
    }catch(err){ setUp(0); notify(err.message||'Tải lên lỗi','err'); } };
  if(tab==='shot') return <ShotListTab onBack={()=>setTab('kho')}/>;
  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <h2 className="font-display text-lg font-bold text-ink">🎞 Kho footage</h2>
      <div className="flex gap-2">
        <Btn variant="ghost" onClick={()=>setEdit({media_url:'',media_type:'VIDEO',tags:[]})}>🔗 Dán link</Btn>
        <Btn variant="brand" onClick={()=>fileRef.current&&fileRef.current.click()} disabled={up>0}>{up>0?('Đang tải '+up+'%'):'⬆ Tải lên'}</Btn>
        <input ref={fileRef} type="file" accept="video/*,image/*" className="hidden" onChange={onFile}/>
      </div>
    </div>
    <div className="flex gap-1 bg-slate-100 rounded-xl p-1 w-fit">
      <button onClick={()=>setTab('kho')} className={"px-3 py-1 rounded-lg text-xs font-semibold "+(tab==='kho'?'bg-white text-ink shadow-sm':'text-slate-500')}>Kho ({FT.filter(f=>f.active!==false).length})</button>
      <button onClick={()=>setTab('shot')} className="px-3 py-1 rounded-lg text-xs font-semibold text-slate-500">Shot list theo kịch bản</button>
    </div>
    <div className="bg-white rounded-2xl border border-line shadow-card p-3 text-[11px] text-slate-500">
      Footage tải lên đây <b>dùng lại được cho nhiều kịch bản</b> — gắn thẻ (tag) để tìm nhanh thay vì quay lại từ đầu.
    </div>
    <div className="flex flex-wrap gap-2">
      <Input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm theo tên, mô tả, thẻ…" className="flex-1 min-w-[200px]"/>
    </div>
    {allTags.length>0 && <div className="flex flex-wrap gap-1">
      <button onClick={()=>setTag('')} className={"text-[11px] px-2 py-0.5 rounded-full "+(!tag?'bg-brand text-white':'bg-slate-100 text-slate-600')}>Tất cả</button>
      {allTags.map(t=><button key={t} onClick={()=>setTag(t===tag?'':t)} className={"text-[11px] px-2 py-0.5 rounded-full "+(t===tag?'bg-brand text-white':'bg-slate-100 text-slate-600')}>{t}</button>)}
    </div>}
    {list.length===0 ? <Empty>Chưa có footage nào.</Empty> :
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">{list.map(f=>
        <div key={f.id} className="bg-white rounded-2xl border border-line shadow-card overflow-hidden">
          <div className="bg-slate-900 aspect-video flex items-center justify-center">
            {f.media_type==='IMAGE'
              ? <img src={f.media_url} alt={f.ten} className="w-full h-full object-cover"/>
              : <video src={f.media_url} className="w-full h-full object-cover" controls preload="metadata"/>}
          </div>
          <div className="p-2">
            <div className="text-xs font-semibold text-ink truncate">{f.ten||'(chưa đặt tên)'}</div>
            {f.dia_diem && <div className="text-[10px] text-slate-400 truncate">📍 {f.dia_diem}</div>}
            <div className="flex flex-wrap gap-1 mt-1">{(f.tags||[]).slice(0,3).map((t,i)=><span key={i} className="text-[9px] px-1.5 py-0.5 rounded-full bg-brand/10 text-brand-dark">{t}</span>)}</div>
            <div className="flex justify-between mt-2 pt-1.5 border-t border-line/60">
              <button onClick={()=>setEdit(f)} className="text-[11px] text-blue-500 hover:underline">Sửa</button>
              <button onClick={()=>{ if(confirm('Xoá footage này? Các cảnh đang dùng sẽ được gỡ liên kết.')) deleteFootage(f.id).then(ok=>ok&&notify('Đã xoá')); }} className="text-[11px] text-rose-400 hover:underline">Xoá</button>
            </div>
          </div>
        </div>)}
      </div>}
    {edit && <FootageForm init={edit} onClose={()=>setEdit(null)}/>}
  </div>;
}
function FootageForm({init,onClose}){
  const { db, createFootage, patchFootage, notify } = useApp();
  const [f,setF]=useState({ ten:init.ten||'', mo_ta:init.mo_ta||'', media_url:init.media_url||'', media_type:init.media_type||'VIDEO',
    tags:(init.tags||[]).join(', '), san_pham_id:init.san_pham_id||'', dia_diem:init.dia_diem||'', ngay_quay:init.ngay_quay||'', nguoi_quay:init.nguoi_quay||'' });
  const [busy,setBusy]=useState(false);
  const save=async()=>{ if(!f.media_url.trim()) return notify('Cần file hoặc link media','warn');
    const payload={ ...f, tags:f.tags.split(',').map(x=>x.trim()).filter(Boolean), san_pham_id:f.san_pham_id||null };
    setBusy(true);
    const r = init.id ? await patchFootage(init.id,payload) : await createFootage(payload);
    setBusy(false);
    if(r===true || (r&&r.ok)){ notify(init.id?'Đã lưu':'Đã thêm footage'); onClose(); } else notify((r&&r.msg)||'Lỗi','err'); };
  return <Modal open={true} onClose={onClose} title={init.id?'Sửa footage':'Thêm footage'} wide>
    {!init.id && <Field label="Link media" required hint="Tải lên xong sẽ tự điền; hoặc dán link Drive/R2">
      <Input value={f.media_url} onChange={e=>setF({...f,media_url:e.target.value})} placeholder="/media/… hoặc https://…"/></Field>}
    <div className="grid sm:grid-cols-2 gap-2">
      <Field label="Tên cảnh"><Input value={f.ten} onChange={e=>setF({...f,ten:e.target.value})} placeholder="VD: Cận cảnh chít mạch"/></Field>
      <Field label="Loại"><Select value={f.media_type} onChange={e=>setF({...f,media_type:e.target.value})}><option value="VIDEO">Video</option><option value="IMAGE">Ảnh</option></Select></Field>
    </div>
    <Field label="Thẻ (tag)" hint="Cách nhau bằng dấu phẩy — dùng để tìm lại nhanh">
      <Input value={f.tags} onChange={e=>setF({...f,tags:e.target.value})} placeholder="chít mạch, cận cảnh, nhà tắm"/></Field>
    <Field label="Mô tả"><Textarea rows="2" value={f.mo_ta} onChange={e=>setF({...f,mo_ta:e.target.value})}/></Field>
    <div className="grid sm:grid-cols-3 gap-2">
      <Field label="Sản phẩm"><Select value={f.san_pham_id} onChange={e=>setF({...f,san_pham_id:e.target.value})}><option value="">—</option>{(db.san_pham||[]).map(p=><option key={p.id} value={p.id}>{p.ten}</option>)}</Select></Field>
      <Field label="Địa điểm"><Input value={f.dia_diem} onChange={e=>setF({...f,dia_diem:e.target.value})}/></Field>
      <Field label="Ngày quay"><Input type="date" value={f.ngay_quay} onChange={e=>setF({...f,ngay_quay:e.target.value})}/></Field>
    </div>
    <Field label="Người quay"><Input value={f.nguoi_quay} onChange={e=>setF({...f,nguoi_quay:e.target.value})}/></Field>
    <div className="flex gap-2 mt-3"><Btn variant="ghost" onClick={onClose} disabled={busy}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={save} disabled={busy}>{busy?'…':'Lưu'}</Btn></div>
  </Modal>;
}

        : <>
          <div className="flex items-center justify-between flex-wrap gap-2">
            <span className={"text-[11px] px-2 py-0.5 rounded-full font-semibold "+(done===shots.length?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700')}>
              {done}/{shots.length} cảnh đã có footage</span>

                <div className="flex-1 min-w-0">

              </div>

                <span className="text-xs text-ink flex-1 truncate">{ft.ten||'(footage)'}</span>
                <button onClick={()=>patchShot(s.id,{footage_id:''}).then(ok=>ok&&notify('Đã gỡ'))} className="text-[11px] text-rose-400 hover:underline shrink-0">Gỡ</button>
              </div>}
              <div className="flex gap-2 mt-2">
                <Btn variant="ghost" onClick={()=>setPick(s)}>{ft?'Đổi footage':'🎞 Gắn footage'}</Btn>
                {s.trang_thai==='DA_QUAY' && <Btn variant="ghost" onClick={()=>patchShot(s.id,{trang_thai:'DAT'}).then(ok=>ok&&notify('Đã đánh dấu Đạt'))}>✓ Đạt</Btn>}
                <button onClick={()=>{ if(confirm('Xoá cảnh này?')) deleteShot(s.id).then(ok=>ok&&notify('Đã xoá')); }} className="text-xs text-rose-400 hover:underline ml-auto">Xoá</button>
              </div>
            </div>; })}
          </div>

    </>}
    {pick && <Modal open={true} onClose={()=>setPick(null)} title={'Gắn footage cho: '+pick.ten_canh} wide>

        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-96 overflow-y-auto">

              <div className="p-1.5 text-[11px] font-semibold text-ink truncate">{f.ten||'(chưa đặt tên)'}</div>
            </button>)}

// Lên lịch đăng. Nói rõ kênh nào tự đăng được, kênh nào chỉ nhắc — không hứa suông.
function LichDangBox({post,onSaveFirst}){
  const { db, scheduleAir, unscheduleAir, notify } = useApp();
  const cur=(db.air_posts||[]).find(a=>a.id===post.id)||post;
  const kenh=(db.kenh||[]).find(k=>k.id===cur.kenh_id);
  const cap=(db.kenh_tu_dong||KENH_TU_DONG_FE)[String(kenh&&kenh.loai||'').toUpperCase()];
  const sanSang=(db.kenh_san_sang||{})[cur.kenh_id];
  const tuDongDuoc = !!(cap&&cap.duoc) && !!(kenh&&kenh.tu_dong_dang) && !!sanSang;
  const [lich,setLich]=useState((cur.lich_dang||'').slice(0,16));
  const [tuDong,setTuDong]=useState(!!cur.tu_dong);
  const [busy,setBusy]=useState(false);
  const daLen=['DA_LEN_LICH','DEN_GIO','LOI'].includes(cur.trang_thai);
  const len=async()=>{ if(!lich) return notify('Chọn thời điểm đăng','warn');
    setBusy(true); await onSaveFirst();
    const r=await scheduleAir(cur.id,{lich_dang:new Date(lich).toISOString(), tu_dong:tuDong});
    setBusy(false);
    if(r&&r.ok) notify(tuDong?'Đã lên lịch — hệ thống sẽ tự đăng':'Đã lên lịch — tới giờ sẽ nhắc bạn đăng');
    else if(r&&r.thieu) notify('Còn thiếu: '+r.thieu.join(' · '),'err');
    else notify((r&&r.msg)||'Lỗi','err'); };
  const huy=async()=>{ const ok=await unscheduleAir(cur.id); if(ok) notify('Đã huỷ lịch'); };
  return <div className="bg-white rounded-2xl border border-line shadow-card p-4 space-y-2">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <div className="text-sm font-semibold text-ink">⏰ Lịch đăng</div>
      {daLen && <span className={"text-[11px] px-2 py-0.5 rounded-full font-semibold "+(AIR_ST_STYLE[cur.trang_thai]||'')}>{AIR_ST_LABEL[cur.trang_thai]}</span>}
    </div>
    {cur.loi && <div className="rounded-xl bg-rose-50 border border-rose-200 p-2 text-[11px] text-rose-700">
      ⚠ {cur.loi}{Number(cur.lan_thu)>0?(' (đã thử '+cur.lan_thu+' lần)'):''}
    </div>}
    <div className="grid sm:grid-cols-2 gap-2">
      <Field label="Đăng lúc"><Input type="datetime-local" value={lich} onChange={e=>setLich(e.target.value)}/></Field>
      <Field label="Cách đăng">
        <Select value={tuDong?'auto':'nhac'} onChange={e=>setTuDong(e.target.value==='auto')} disabled={!tuDongDuoc}>
          <option value="nhac">🔔 Tới giờ nhắc tôi đăng tay</option>
          {tuDongDuoc && <option value="auto">🤖 Hệ thống tự đăng</option>}
        </Select>
      </Field>
    </div>
    {!kenh ? <div className="text-[11px] text-amber-600">Chưa gắn kênh — chọn kênh ở trên để dùng lịch đăng.</div>
      : !cap ? null
      : !cap.duoc ? <div className="text-[11px] text-slate-500">
          <b>{cap.ten}</b> không đăng tự động được: {cap.dieu_kien}. Lịch này sẽ <b>nhắc bạn đăng tay</b> đúng giờ.

function KetQuaImport({onClose}){
  const { importKetQua, notify } = useApp();
  const [nguon,setNguon]=useState('SHOPEE'); const [ky,setKy]=useState(''); const [txt,setTxt]=useState(''); const [busy,setBusy]=useState(false);
  const HEAD=['Mã theo dõi','Doanh thu','Số đơn'];
  const dlTpl=()=>download('mau_doi_soat.csv', toCSV([HEAD,['KM-T7-001','1500000','3']]));
  const rows=()=>{ const rr=parseTable(txt); if(!rr.length) return [];
    if(/mã/i.test(rr[0][0]||'')) rr.shift();
    return rr.map(c=>({ ma_theo_doi:(c[0]||'').trim(), doanh_thu:Number(String(c[1]||'').replace(/[^\d.-]/g,''))||0, so_don:Number(String(c[2]||'').replace(/[^\d-]/g,''))||0 }))
             .filter(r=>r.ma_theo_doi||r.doanh_thu||r.so_don); };
  const list=rows();
  const run=async()=>{ if(!list.length) return notify('Chưa có dữ liệu','warn');
    setBusy(true); const r=await importKetQua({nguon,ky,rows:list}); setBusy(false);
    if(r&&r.ok){ notify('Khớp mã '+r.gan+' dòng · '+r.cho+' dòng vào hàng đợi gán tay'); onClose(); }
    else notify((r&&r.msg)||'Lỗi','err'); };
  return <Modal open={true} onClose={onClose} title="Import đối soát từ sàn" wide>
    <div className="rounded-xl bg-slate-50 border border-line p-2 mb-3 text-[11px] text-slate-500">
      Dòng nào <b>khớp đúng 1 bài</b> theo mã theo dõi thì tự quy đơn. Dòng <b>không có mã</b>, <b>không khớp</b>, hoặc <b>khớp nhiều bài</b> sẽ vào
      <b> hàng đợi gán tay</b> — hệ thống cố ý <b>không chia đều</b> để tránh tạo ra số liệu sai.
    </div>
    <div className="grid sm:grid-cols-2 gap-2">
      <Field label="Nguồn"><Select value={nguon} onChange={e=>setNguon(e.target.value)}>{NGUON_KQ_FE.filter(n=>n.v==='TIKTOK_SHOP'||n.v==='SHOPEE').map(n=><option key={n.v} value={n.v}>{n.label}</option>)}</Select></Field>
      <Field label="Kỳ (YYYY-MM)"><Input value={ky} onChange={e=>setKy(e.target.value)} placeholder="2026-07"/></Field>
    </div>
    <div className="text-[11px] text-slate-400 mb-1">Mức tin cậy tự đặt theo nguồn: TikTok Shop → <b>Trực tiếp</b>, Shopee → <b>Gián tiếp</b>.</div>
    <Btn variant="ghost" onClick={dlTpl}>⬇ Tải file mẫu</Btn>
    <div className="text-xs font-mono bg-slate-100 rounded-lg p-2 my-2 overflow-x-auto whitespace-nowrap">{HEAD.join(' | ')}</div>
    <Textarea rows="6" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Dán bảng đối soát từ Excel vào đây…"/>
    {list.length>0 && <div className="text-xs text-slate-600 mt-1">Đọc được <b className="text-brand-dark">{list.length}</b> dòng.</div>}
    <div className="flex gap-2 mt-3"><Btn variant="ghost" onClick={onClose} disabled={busy}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={run} disabled={busy||!list.length}>{busy?'…':'Import'}</Btn></div>
  </Modal>;
}

function StrategyPillar(){
  const { db, setStrategy, upsertPillar, deletePillar, notify } = useApp();

  const [edit,setEdit]=useState(null);

  const blank={ten:'',objective:'',point_of_difference:'',request:'',ty_trong:0,active:true};

    <div className="bg-white rounded-2xl border border-line shadow-card p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-semibold text-ink">Định hướng chiến lược</div>
        {editStrat ? <div className="flex gap-2"><Btn variant="ghost" onClick={()=>{ setSt(db.content_strategy||{}); setEditStrat(false); }}>Huỷ</Btn><Btn variant="brand" onClick={saveStrat} disabled={busy}>{busy?'…':'Lưu'}</Btn></div>
          : <Btn variant="ghost" onClick={()=>setEditStrat(true)}>Sửa</Btn>}
      </div>

        <SField label="Đối tượng (Audience)" k="audience"/>

        <div className="sm:col-span-2"><SField label="SWOT / phân tích nền" k="swot" rows={3}/></div>
      </div>
    </div>

    {/* Pillars */}
    <div className="bg-white rounded-2xl border border-line shadow-card p-4">
      <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
        <div className="flex items-center gap-2">
          <span className="text-sm font-semibold text-ink">Trụ cột nội dung (Pillar)</span>
          <span className={"text-[11px] px-2 py-0.5 rounded-full font-semibold "+(total===100?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700')}>Tổng {total}%{total===100?' ✓':' · nên = 100%'}</span>
        </div>
        <Btn variant="brand" onClick={()=>setEdit({...blank})}>＋ Thêm pillar</Btn>
      </div>
      {activePil.length>0 && <div className="h-6 rounded-full overflow-hidden flex bg-slate-100 mb-3">
        {activePil.map((p,i)=><div key={p.id} style={{width:Math.max(0,Number(p.ty_trong)||0)+'%',background:barColors[i%barColors.length]}} className="flex items-center justify-center text-[10px] text-white font-semibold overflow-hidden whitespace-nowrap" title={p.ten+' '+p.ty_trong+'%'}>{(Number(p.ty_trong)||0)>=9?p.ten:''}</div>)}
        {total<100 && <div style={{width:(100-total)+'%'}} className="flex items-center justify-center text-[10px] text-slate-400">chưa phân bổ</div>}
      </div>}
      {pillars.length===0 ? <Empty>Chưa có pillar.</Empty> :

                {p.objective && <div className="text-xs text-slate-600 mt-0.5">{p.objective}</div>}
                {p.point_of_difference && <div className="text-[11px] text-slate-400 mt-0.5">Điểm khác biệt: {p.point_of_difference}</div>}
                {p.request && <div className="text-[11px] text-brand-dark mt-0.5">Yêu cầu: {p.request}</div>}
              </div>
              <div className="flex flex-col items-end gap-1 shrink-0">

      <p className="text-[11px] text-slate-400 mt-3">Tỷ lệ này là <b>mục tiêu phân bổ nội dung</b>. Khi có Kế hoạch (P3), hệ thống sẽ cảnh báo nếu kế hoạch lệch khỏi tỷ lệ này &gt;15%.</p>
    </div>

    {edit && <Modal open={!!edit} onClose={()=>setEdit(null)} title={(edit.id?'Sửa ':'Thêm ')+'pillar'}>
      <PillarForm init={edit} onClose={()=>setEdit(null)}/>
    </Modal>}
  </div>;
}
function PillarForm({init,onClose}){

function SanPhamTab(){
  const { db, upsertSanPham, deleteSanPham, notify } = useApp();
  const list = db.san_pham||[];
  const [edit,setEdit]=useState(null);
  const fileRef=useRef();
  const blank = {ma:'',ten:'',dong:DONG_SP[0],thong_so:[],tieu_chuan:'',huong_dan:'',anh:'',active:true};
  const exportCSV=()=>{ const r=[['Mã','Tên','Dòng','Thông số (k=v; k=v)','Tiêu chuẩn','Hướng dẫn']];
    list.forEach(p=>r.push([p.ma,p.ten,p.dong,(p.thong_so||[]).map(t=>t.k+'='+t.v).join('; '),p.tieu_chuan,p.huong_dan]));
    download('san_pham.csv', toCSV(r)); };
  const onImport=(e)=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
    const rd=new FileReader(); rd.onload=async ev=>{ const rows=parseTable(String(ev.target.result||'')); if(!rows.length) return notify('File rỗng','warn');
      if((rows[0][0]||'').toLowerCase()==='mã') rows.shift(); let n=0;
      for(const c of rows){ if(!(c[1]||'').trim()) continue; const ts=(c[3]||'').split(/[;\n]/).map(s=>s.trim()).filter(Boolean).map(kv=>{ const i=kv.indexOf('='); return {k:(i>=0?kv.slice(0,i):kv).trim(), v:(i>=0?kv.slice(i+1):'').trim()}; });
        await upsertSanPham({ma:(c[0]||'').trim(),ten:(c[1]||'').trim(),dong:(c[2]||'').trim()||DONG_SP[0],thong_so:ts,tieu_chuan:(c[4]||'').trim(),huong_dan:(c[5]||'').trim(),active:true}); n++; }
      notify('Đã import '+n+' sản phẩm'); };
    rd.readAsText(f,'utf-8'); };
  return <div className="space-y-3">
    <div className="flex gap-2 flex-wrap justify-end">
      <Btn variant="ghost" onClick={exportCSV}>⬇ Xuất Excel</Btn>
      <Btn variant="ghost" onClick={()=>fileRef.current&&fileRef.current.click()}>⬆ Import</Btn>
      <input ref={fileRef} type="file" accept=".csv,.tsv,.txt" className="hidden" onChange={onImport}/>
      <Btn variant="brand" onClick={()=>setEdit({...blank})}>＋ Thêm sản phẩm</Btn>
    </div>
    {list.length===0 ? <Empty>Chưa có sản phẩm. Bấm "Thêm sản phẩm" hoặc Import — nhập <b>thông số thật</b>, đừng bịa.</Empty> :
      <div className="grid sm:grid-cols-2 gap-3">{list.map(p=>
        <div key={p.id} className={"bg-white rounded-2xl border border-line shadow-card p-4 "+(p.active?'':'opacity-50')}>
          <div className="flex items-start gap-3">
            {p.anh ? <img src={p.anh} className="w-14 h-14 rounded-xl object-cover border border-line shrink-0"/> : <div className="w-14 h-14 rounded-xl bg-slate-100 flex items-center justify-center text-2xl shrink-0">🧴</div>}
            <div className="flex-1 min-w-0">

function Library(){
  const { db, upsertGroup, upsertTopic, upsertCmt, deleteGroup, deleteTopic, deleteCmt, setPostTypePref, notify, audit } = useApp();
  const [tab, setTab] = useState('groups');
  const [edit, setEdit] = useState(null); // {type, item}
  const [selMode, setSelMode] = useState(false);
  const [sel, setSel] = useState(()=>new Set());
  useEffect(()=>{ setSelMode(false); setSel(new Set()); }, [tab]); // đổi tab thì reset chọn

  const curItems = tab==='groups'?sortPri(db.groups) : tab==='topics'?sortPri(db.content_topics) : tab==='cmts'?db.cmt_suggestions : [];
  const toggleSel = (id)=> setSel(prev=>{ const s=new Set(prev); s.has(id)?s.delete(id):s.add(id); return s; });
  const allSel = curItems.length>0 && curItems.every(it=>sel.has(it.id));
  const toggleAll = ()=> setSel(allSel ? new Set() : new Set(curItems.map(it=>it.id)));
  const bulkDelete = async ()=>{
    const ids=[...sel]; if(!ids.length) return;
    if(!confirm(`Xoá ${ids.length} mục đã chọn khỏi thư viện?`)) return;
    const fn = tab==='groups'?deleteGroup : tab==='topics'?deleteTopic : deleteCmt;
    let n=0; for(const id of ids){ if(await fn(id)) n++; }
    audit('xoá hàng loạt', tab, `${n} mục`);
    setSel(new Set()); setSelMode(false); notify(`Đã xoá ${n} mục`);
  };

  const openNew = (type) => setEdit({type, item:blankOf(type)});
  const blankOf = (type) => type==='groups' ? {ten_group:'',link:'',loai:GROUP_LOAI[0],so_member:0,active:true,uu_tien:false}
    : type==='topics' ? {chu_de:'',noi_dung:'',loai_bai:LOAI_BAI[0],muc_tieu:'',tags:[],active:true,uu_tien:false}
    : {noi_dung_goi_y:'',tuyen:'',loai_bai:'',tags:[],thu_tu:0,active:true};

  const toggle = (type, item) => {
    if(type==='groups') upsertGroup({...item, active:!item.active});
    if(type==='topics') upsertTopic({...item, active:!item.active});
    if(type==='cmts')   upsertCmt({...item, active:!item.active});
    audit('đổi hiện/ẩn', type, item.id);
  };
  const togglePri = (type, item) => {
    if(type==='groups') upsertGroup({...item, uu_tien:!item.uu_tien});
    if(type==='topics') upsertTopic({...item, uu_tien:!item.uu_tien});
    audit(item.uu_tien?'bỏ ưu tiên':'đặt ưu tiên', type, item.id);

// Bóc tách bảng CSV/TSV: tự nhận dấu phân tách (tab khi dán từ Excel, phẩy khi mở file .csv),
// hỗ trợ ô có dấu ngoặc kép chứa phẩy/xuống dòng theo chuẩn CSV.
function parseTable(text){
  text = (text||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const firstLine = text.split('\n').find(l=>l.trim()) || '';
  const delim = firstLine.includes('\t') ? '\t' : ',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    } else if(ch==='"'){ q=true; }
    else if(ch===delim){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=ch;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c!==''));
}
// Import từ file mẫu (.csv) hoặc dán trực tiếp từ Excel
function ImportBtn({tab}){
  const { upsertGroup, upsertTopic, upsertCmt, notify } = useApp();
  const [open, setOpen] = useState(false);
  const [txt, setTxt] = useState('');
  const fileRef = useRef(null);
  const tpl = IMPORT_TPL[tab];
  const upsert = { groups:upsertGroup, topics:upsertTopic, cmts:upsertCmt }[tab];

  const downloadTpl = () => download('mau_'+tab+'.csv', toCSV([tpl.headers, tpl.sample]));

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file){ return; }
    const r = new FileReader();
    r.onload = ev => setTxt(String(ev.target.result||''));
    r.onerror = () => notify('Không đọc được file','warn');
    r.readAsText(file, 'utf-8');
    e.target.value = '';
  };

  const doImport = async () => {
    const rows = parseTable(txt);
    if(!rows.length) return notify('Chưa có dữ liệu để import','warn');
    // Bỏ dòng tiêu đề nếu ô đầu trùng với tên cột mẫu
    const firstCell = (rows[0][0]||'').toLowerCase();
    if(firstCell === tpl.headers[0].toLowerCase()) rows.shift();
    let n=0, skip=0;
    for(const c of rows){
      if(!(c[0]||'').trim()){ skip++; continue; }
      await upsert(tpl.make(c));
      n++;
    }
    notify('Đã import '+n+' dòng'+(skip?' (bỏ qua '+skip+' dòng thiếu cột đầu)':''));
    setTxt(''); setOpen(false);
  };

  return <>
    <Btn variant="ghost" onClick={()=>setOpen(true)}>⬇ Import file</Btn>
    <Modal open={open} onClose={()=>setOpen(false)} title={'Import '+tpl.label} wide>
      <ol className="text-sm text-slate-600 list-decimal ml-4 space-y-1 mb-3">
        <li>Bấm <b>Tải file mẫu</b> → mở bằng Excel/Google Sheets.</li>
        <li>Điền thông tin theo các cột (giữ nguyên dòng tiêu đề), lưu lại dạng <b>.csv</b>.</li>
        <li>Bấm <b>Chọn file</b> để tải lên, xem trước rồi bấm <b>Import</b> để cập nhật danh sách.</li>
      </ol>
      <div className="flex flex-wrap gap-2 mb-3">
        <Btn variant="ghost" onClick={downloadTpl}>⬇ Tải file mẫu</Btn>
        <Btn variant="ghost" onClick={()=>fileRef.current && fileRef.current.click()}>📄 Chọn file (.csv)</Btn>
        <input ref={fileRef} type="file" accept=".csv,.tsv,.txt,text/csv" className="hidden" onChange={onFile}/>
      </div>
      <div className="text-xs font-mono bg-slate-100 rounded-lg p-2 mb-1 overflow-x-auto whitespace-nowrap">{tpl.headers.join(' | ')}</div>
      <p className="text-[11px] text-slate-400 mb-2">{tpl.note}</p>
      <p className="text-xs text-slate-500 mb-1">Hoặc copy các cột từ Excel rồi dán trực tiếp vào ô dưới (mỗi dòng 1 mục):</p>
      <Textarea rows="7" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Nội dung file sẽ hiện ở đây sau khi chọn file, hoặc dán dữ liệu từ Excel…"/>
      <div className="flex gap-2 mt-3"><Btn variant="ghost" onClick={()=>setOpen(false)}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={doImport}>Import</Btn></div>
    </Modal>
  </>;
}

        <li>Điền theo 3 cột <b>Tên · Tài khoản · Mật khẩu</b> (giữ nguyên dòng tiêu đề), lưu dạng <b>.csv</b>.</li>
        <li>Bấm <b>Chọn file</b> để tải lên, xem trước rồi bấm <b>Import</b>.</li>

        <input ref={fileRef} type="file" accept=".csv,.tsv,.txt,text/csv" className="hidden" onChange={onFile}/>

      <Textarea rows="7" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Nội dung file sẽ hiện ở đây sau khi chọn file, hoặc dán dữ liệu từ Excel…"/>
