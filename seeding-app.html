   15. MARKETING — HÀNG CHỜ NGHIỆM THU
============================================================ */
function MktQueue(){
  const { db, reviewPost, reviewCmtSeed, notify } = useApp();
  const [tab, setTab] = useState('post');
  const [sel, setSel] = useState({}); // id->true để duyệt hàng loạt
  const [rejFor, setRejFor] = useState(null);
  const [rejTxt, setRejTxt] = useState('');

  const [showDup, setShowDup] = useState(false);
  const postItems = db.post_seedings.filter(p=>p.trang_thai===ST.CHO_DUYET);
  const cmtMine   = db.cmt_seedings.filter(c=>c.trang_thai===ST.CHO_DUYET && c.loai===CMT_LOAI.MINH_DANG);
  const cmtDao    = db.cmt_seedings.filter(c=>c.trang_thai===ST.CHO_DUYET && c.loai===CMT_LOAI.DAO);

  // Chống trùng: gom các bài "còn hiệu lực" (không nháp/không loại) theo cặp nội dung–nhóm
  const dKey = p => (p.topic_id||'')+'|'+(p.group_id||'');
  const cellPosts = {};
  db.post_seedings.forEach(p=>{ if(p.topic_id && p.group_id && p.trang_thai!==ST.NHAP && p.trang_thai!==ST.KHONG_DAT){ (cellPosts[dKey(p)] ||= []).push(p); } });
  const dupOf = (p)=> (p.topic_id&&p.group_id) ? (cellPosts[dKey(p)]||[]) : [];
  const dupInfoFor = (p)=>{ const arr=dupOf(p); if(arr.length<=1) return null;
    return { count:arr.length, hasWinner: arr.some(x=>x.id!==p.id && (x.trang_thai===ST.DAT||x.trang_thai===ST.DA_CHI)) }; };
  const dupClusters = Object.values(cellPosts).filter(arr=>arr.length>1)
    .map(arr=>arr.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)));

  const approve = async (item) => {
    if(item._t==='post'){
      const r = await reviewPost(item.id, ST.DAT);
      if(r && r.ok) notify(r.deduped ? '🔁 Bài trùng nội dung–nhóm → đã đánh Loại, không tính tiền' : '✅ Đã duyệt Đạt — tự tính tiền', r.deduped?'warn':undefined);
    } else { const ok = await reviewCmtSeed(item.id, ST.DAT); if(ok) notify('✅ Đã duyệt Đạt — tự tính tiền'); }
  };
  const reject = async () => {
    if(!rejTxt.trim()) return notify('Nhập lý do','warn');
    const item = rejFor;
    const res = item._t==='post' ? await reviewPost(item.id, ST.KHONG_DAT, rejTxt.trim()) : await reviewCmtSeed(item.id, ST.KHONG_DAT, rejTxt.trim());
    const ok = item._t==='post' ? (res && res.ok) : res;
    if(ok){ notify('Đã trả về Sales sửa'); setRejFor(null); setRejTxt(''); }
  };

  const curItems = (tab==='post'?postItems.map(x=>({...x,_t:'post'})):tab==='mine'?cmtMine.map(x=>({...x,_t:'cmt'})):cmtDao.map(x=>({...x,_t:'cmt'})));
  const selIds = Object.keys(sel).filter(k=>sel[k]);
  const bulkApprove = async () => {
    for(const i of curItems.filter(i=>sel[i.id])) await approve(i);
    setSel({});
  };

  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <h2 className="font-display text-lg font-bold text-ink">✅ Hàng chờ nghiệm thu</h2>
      {selIds.length>0 && <Btn variant="ok" onClick={bulkApprove}>Duyệt {selIds.length} mục đã chọn</Btn>}
    </div>
    {dupClusters.length>0 && <div className="bg-amber-50 border border-amber-300 rounded-2xl overflow-hidden">
      <button onClick={()=>setShowDup(v=>!v)} className="w-full flex items-center justify-between gap-2 px-4 py-3 text-left">
        <span className="text-sm font-semibold text-amber-800">🔁 Trùng lặp nội dung–nhóm cần chú ý — {dupClusters.length} cặp</span>
        <span className="text-amber-700 text-xs">{showDup?'Ẩn ▲':'Xem ▼'}</span>
      </button>
      {showDup && <div className="px-4 pb-3 space-y-2">
        <p className="text-[11px] text-amber-700">Mỗi cặp nội dung–nhóm chỉ được tính công 1 lần. Khi bạn duyệt Đạt bài đầu, các bài trùng còn lại tự động bị đánh Loại (không tính tiền).</p>
        {dupClusters.map((arr,i)=>{ const t=db.content_topics.find(x=>x.id===arr[0].topic_id); const g=db.groups.find(x=>x.id===arr[0].group_id);
          return <div key={i} className="bg-white rounded-xl border border-amber-200 p-2.5 text-xs">
            <div className="font-medium text-ink">{t?.chu_de||'—'} <span className="text-slate-400">·</span> <span className="text-slate-500">{g?.ten_group||'—'}</span></div>
            <div className="mt-1 flex flex-wrap gap-1.5">{arr.map(p=>{ const s=db.users.find(u=>u.id===p.sales_id);
              return <span key={p.id} className={"px-1.5 py-0.5 rounded-full "+(ST_STYLE[p.trang_thai]||'bg-slate-100 text-slate-600')}>{s?.ho_ten||'—'} · {ST_LABEL[p.trang_thai]}</span>; })}</div>
          </div>; })}
      </div>}
    </div>}

    <Tabs active={tab} onChange={t=>{setTab(t);setSel({});}} tabs={[
      {key:'post', label:'POST', count:postItems.length},
      {key:'mine', label:'CMT mình đăng', count:cmtMine.length},
      {key:'dao', label:'CMT dạo', count:cmtDao.length},
    ]}/>

    {curItems.length===0 ? <Empty>Không có mục nào chờ duyệt 🎉</Empty> :
      <div className="space-y-3">
        {curItems.map(item=><QueueCard key={item.id} item={item} checked={!!sel[item.id]} dupInfo={item._t==='post'?dupInfoFor(item):null}
          onCheck={()=>setSel(s=>({...s,[item.id]:!s[item.id]}))}
          onApprove={()=>approve(item)} onReject={()=>{setRejFor(item);setRejTxt('');}}/>)}
      </div>}

    <Modal open={!!rejFor} onClose={()=>setRejFor(null)} title="Lý do không đạt">
      <Field label="Nhập lý do (bắt buộc)" required><Textarea rows="3" value={rejTxt} onChange={e=>setRejTxt(e.target.value)} placeholder="VD: thiếu ảnh, sai group, link hỏng…"/></Field>
      <div className="flex gap-2"><Btn variant="ghost" onClick={()=>setRejFor(null)}>Huỷ</Btn><Btn variant="danger" className="flex-1" onClick={reject}>Trả về Sales</Btn></div>
    </Modal>
  </div>;
}
function QueueCard({item, checked, onCheck, onApprove, onReject, dupInfo}){
  const { db } = useApp();
  const sales = db.users.find(u=>u.id===item.sales_id);
  const topic = item._t==='post' ? db.content_topics.find(t=>t.id===item.topic_id) : null;
  const group = item._t==='post' ? db.groups.find(g=>g.id===item.group_id) : null;
  const sug = item.suggestion_id ? db.cmt_suggestions.find(s=>s.id===item.suggestion_id) : null;
  const tien = item._t==='post' ? tienPost(db.pricing) : tienCmt(db.pricing, item.so_cmt_seeding);
  const link = item._t==='post' ? item.link_bai : item.post_link;

  return <div className="bg-white rounded-2xl border border-line shadow-card p-4">
    <div className="flex items-start gap-3">
      <input type="checkbox" checked={checked} onChange={onCheck} className="mt-1 w-4 h-4 accent-emerald-600"/>
      <div className="flex-1 min-w-0">
        <div className="flex items-center justify-between gap-2">
          <div className="text-sm font-semibold text-ink">{sales?.ho_ten||'—'}</div>
          <div className="text-xs text-slate-400">{fmtDate(item.created_at)}</div>
        </div>
        {topic && <div className="text-sm text-slate-700 mt-1">{topic.chu_de} <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-500">{topic.loai_bai}</span></div>}
        {group && <div className="text-xs text-slate-500">Group: {group.ten_group}</div>}
        {dupInfo && <div className={"mt-1 inline-flex items-center gap-1 text-[11px] font-medium px-2 py-0.5 rounded-full "+(dupInfo.hasWinner?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700')}>
          🔁 {dupInfo.hasWinner?'Trùng — đã có bài Đạt, duyệt sẽ tự Loại (0đ)':'Trùng nội dung–nhóm ('+dupInfo.count+' bài)'}</div>}
        {sug && <div className="text-xs text-slate-500 mt-0.5">Gợi ý: "{sug.noi_dung_goi_y.slice(0,60)}…"</div>}
        {link && <div className="text-xs mt-1 truncate"><a href={link} target="_blank" className="text-blue-500 underline">🔗 {link}</a></div>}
        <div className="flex gap-3 text-xs text-slate-500 mt-1">
          {item._t==='post' && <span>👍 {item.react} · 💬 {item.so_cmt_seeding} seed · {item.so_cmt_tu_nhien} tự nhiên</span>}
          {item._t==='cmt' && <span>💬 {item.so_cmt_seeding} cmt · 👍 {item.react}</span>}
        </div>
        {item.proofs && item.proofs.length>0 && <div className="flex gap-2 mt-2 flex-wrap">
          {item.proofs.map(p=><a key={p.id} href={p.image_url} target="_blank"><img src={p.image_url} className="w-16 h-16 object-cover rounded-lg border"/></a>)}
        </div>}
        <div className="flex items-center justify-between mt-3">
          <span className="text-xs text-slate-400">Nếu Đạt: <b className="text-emerald-600">{fmtVND(tien)}</b></span>
          <div className="flex gap-2">
            <Btn variant="danger" onClick={onReject}>Không đạt</Btn>
            <Btn variant="ok" onClick={onApprove}>Đạt ✓</Btn>
          </div>
        </div>
      </div>
    </div>
  </div>;
}

function allRows(db){
  const posts = db.post_seedings.map(p=>({
    ...p, _t:'POST',
    sales: db.users.find(u=>u.id===p.sales_id)?.ho_ten||'—',
    chu_de: db.content_topics.find(t=>t.id===p.topic_id)?.chu_de||'—',
    loai_bai: db.content_topics.find(t=>t.id===p.topic_id)?.loai_bai||'—',
    group: db.groups.find(g=>g.id===p.group_id)?.ten_group||'—',
    link: p.link_bai,
  }));
  const cmts = db.cmt_seedings.map(c=>({
    ...c, _t: c.loai===CMT_LOAI.MINH_DANG?'CMT_MINE':'CMT_DAO',
    sales: db.users.find(u=>u.id===c.sales_id)?.ho_ten||'—',
    sug: db.cmt_suggestions.find(s=>s.id===c.suggestion_id)?.noi_dung_goi_y||'—',
    link: c.post_link,
  }));
  return { posts, cmts };
}
function MktPayReport(){

  const [fSales, setFSales] = useState(''); const [fSt, setFSt] = useState('');

  function inRangeOrAll(iso,f,t){ if(!f&&!t) return true; return inRange(iso,f,t); }

  const exportCSV = () => {
    let rows, name;
    if(tab==='post'){ name='POST_SEEDING';
      rows=[['Ngày','Sales','Chủ đề','Loại bài','Group','Link','React','Cmt seeding','Cmt tự nhiên','Trạng thái','Thành tiền']];
      posts.filter(flt).forEach(r=>rows.push([fmtDay(r.created_at),r.sales,r.chu_de,r.loai_bai,r.group,r.link,r.react,r.so_cmt_seeding,r.so_cmt_tu_nhien,ST_LABEL[r.trang_thai],r.thanh_tien]));
    } else { const isMine=tab==='mine'; name=isMine?'CMT_MINH_DANG':'CMT_DAO';

    download(name+'.csv', toCSV(rows));

      <Select value={fSt} onChange={e=>setFSt(e.target.value)} className="max-w-[160px]"><option value="">Mọi trạng thái</option>{Object.keys(ST_LABEL).map(s=><option key={s} value={s}>{ST_LABEL[s]}</option>)}</Select>

    <div className="bg-white rounded-2xl border border-line shadow-card overflow-auto">
      <table className="w-full text-sm min-w-[720px]">
        <thead className="bg-slate-50/70 text-[11px] font-semibold uppercase tracking-wide text-ink-muted text-left">
          {tab==='post' ? <tr><Th>Ngày</Th><Th>Sales</Th><Th>Chủ đề</Th><Th>Loại bài</Th><Th>Group</Th><Th>Link</Th><Th r>React</Th><Th r>Cmt</Th><Th>Trạng thái</Th><Th r>Thành tiền</Th></tr>
            : <tr><Th>Ngày</Th><Th>Sales</Th><Th>Link post</Th><Th>Gợi ý cmt</Th><Th r>Số cmt</Th><Th>Ảnh</Th><Th>Trạng thái</Th><Th r>Thành tiền</Th></tr>}
        </thead>
        <tbody className="divide-y">
          {tab==='post' ? posts.filter(flt).sort(byDateDesc).map(r=><tr key={r.id} className="hover:bg-slate-50">
            <Td>{fmtDay(r.created_at)}</Td><Td>{r.sales}</Td><Td>{r.chu_de}</Td><Td>{r.loai_bai}</Td><Td>{r.group}</Td>
            <Td>{r.link?<a href={r.link} target="_blank" className="text-blue-500 underline">link</a>:'—'}</Td>
            <Td r>{r.react}</Td><Td r>{r.so_cmt_seeding}</Td><Td><Badge st={r.trang_thai}/></Td><Td r><b>{r.thanh_tien?fmtVND(r.thanh_tien):'—'}</b></Td>
          </tr>) : cmts.filter(c=>tab==='mine'?c.loai===CMT_LOAI.MINH_DANG:c.loai===CMT_LOAI.DAO).filter(flt).sort(byDateDesc).map(r=><tr key={r.id} className="hover:bg-slate-50">
            <Td>{fmtDay(r.created_at)}</Td><Td>{r.sales}</Td>
            <Td>{r.link?<a href={r.link} target="_blank" className="text-blue-500 underline">link</a>:'—'}</Td>
            <Td className="max-w-[220px] truncate">{r.sug}</Td><Td r>{r.so_cmt_seeding}</Td>
            <Td>{(r.proofs||[]).length? <span className="flex gap-1">{r.proofs.slice(0,3).map(p=><a key={p.id} href={p.image_url} target="_blank"><img src={p.image_url} className="w-8 h-8 object-cover rounded"/></a>)}</span> : '—'}</Td>
            <Td><Badge st={r.trang_thai}/></Td><Td r><b>{r.thanh_tien?fmtVND(r.thanh_tien):'—'}</b></Td>
          </tr>)}
        </tbody>
      </table>
      {((tab==='post'?posts.filter(flt):cmts.filter(c=>tab==='mine'?c.loai===CMT_LOAI.MINH_DANG:c.loai===CMT_LOAI.DAO).filter(flt)).length===0) && <Empty>Không có dữ liệu.</Empty>}
    </div>
  </div>;
}
const byDateDesc = (a,b)=>(b.created_at||'').localeCompare(a.created_at||'');
function Th({children, r}){ return <th className={"px-3 py-2.5 whitespace-nowrap "+(r?'text-right':'')}>{children}</th>; }

/* ============================================================
   17. QUẢN LÝ TÀI KHOẢN (Marketing quyền cao nhất — duyệt tài khoản)
============================================================ */
function UserManagement(){
  const { db, me, createUser, updateUser, deleteUser, notify } = useApp();
  const [edit, setEdit] = useState(null);
  const [selMode, setSelMode] = useState(false);
  const [sel, setSel] = useState(()=>new Set());
  const blank = {ho_ten:'',email:'',password:'123456',vai_tro:ROLES.SALES,active:true,is_dev:false};

  const activeMkt = db.users.filter(u=>u.active && u.vai_tro===ROLES.MARKETING).length;

  const selectable = db.users.filter(u=>u.id!==me.id); // không cho chọn chính mình
  const toggleSel = (id)=> setSel(prev=>{ const s=new Set(prev); s.has(id)?s.delete(id):s.add(id); return s; });
  const allSel = selectable.length>0 && selectable.every(u=>sel.has(u.id));
  const toggleAll = ()=> setSel(allSel ? new Set() : new Set(selectable.map(u=>u.id)));
  const exitSel = ()=>{ setSelMode(false); setSel(new Set()); };
  const bulkDelete = async ()=>{
    let users=[...sel].map(id=>db.users.find(u=>u.id===id)).filter(u=>u && u.id!==me.id);
    if(!users.length) return notify('Chưa chọn tài khoản nào (không thể xoá chính mình)','warn');
    // giữ tối thiểu 1 Marketing đang hoạt động
    const activeMktIds = db.users.filter(u=>u.active && u.vai_tro===ROLES.MARKETING).map(u=>u.id);
    const delMkt = users.filter(u=>activeMktIds.includes(u.id));
    let blocked=0;
    if(delMkt.length && activeMktIds.length - delMkt.length < 1){ users=users.filter(u=>!activeMktIds.includes(u.id)); blocked=delMkt.length; }
    if(!users.length) return notify('Phải còn ít nhất 1 Marketing đang hoạt động','warn');
    if(!confirm(`Xoá ${users.length} tài khoản đã chọn?`)) return;
    let n=0; for(const u of users){ if(await deleteUser(u.id)) n++; }
    exitSel(); notify('Đã xoá '+n+' tài khoản'+(blocked?' · giữ lại '+blocked+' Marketing để không mất quyền quản trị':''));
  };

  const setActive = (u, on) => {
    if(!on && u.id===me.id) return notify('Không thể tự tắt tài khoản của mình','warn');
    if(!on && u.vai_tro===ROLES.MARKETING && activeMkt<=1) return notify('Phải còn ít nhất 1 Marketing đang hoạt động','warn');
    updateUser(u.id, {active:on});
  };
  const setRole = (u, role) => {
    if(u.id===me.id && role!==ROLES.MARKETING && u.vai_tro===ROLES.MARKETING && activeMkt<=1) return notify('Phải còn ít nhất 1 Marketing','warn');
    updateUser(u.id, {vai_tro:role});
  };
  const remove = async (u) => {
    if(u.id===me.id) return notify('Không thể xoá tài khoản của mình','warn');
    if(u.vai_tro===ROLES.MARKETING && activeMkt<=1) return notify('Phải còn ít nhất 1 Marketing','warn');
    if(!confirm('Xoá tài khoản '+u.ho_ten+'?')) return;
    if(await deleteUser(u.id)) notify('Đã xoá');
  };
  const save = async () => {
    if(!edit.ho_ten) return notify('Nhập họ tên','warn');
    const key=(edit.email||'').trim().toLowerCase();
    if(!key) return notify('Nhập email','warn');
    if(!edit.id && !edit.password) return notify('Nhập mật khẩu','warn');
    let ok;
    if(edit.id) ok = await updateUser(edit.id, {ho_ten:edit.ho_ten, vai_tro:edit.vai_tro, active:edit.active, is_dev:!!edit.is_dev, ...(edit.password?{password:edit.password}:{})});
    else ok = await createUser({ho_ten:edit.ho_ten, email:key, password:edit.password, vai_tro:edit.vai_tro, active:edit.active, is_dev:!!edit.is_dev});
    if(ok){ notify(edit.id?'Đã lưu':'Đã tạo tài khoản'); setEdit(null); }
  };

  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <h2 className="font-display text-lg font-bold text-ink">👥 Quản lý tài khoản</h2>
      <div className="flex gap-2">
        <Btn variant="ghost" onClick={()=> selMode ? exitSel() : setSelMode(true)}>{selMode?'✕ Xong':'☑ Chọn'}</Btn>
        <UserImportBtn/>
        <Btn variant="brand" onClick={()=>setEdit({...blank})}>＋ Tạo tài khoản</Btn>
      </div>
    </div>
    <div className="bg-brand/10 border border-brand/30 rounded-2xl p-3 text-xs text-brand-dark">
      Marketing tạo & cấp tài khoản cho Sales và Kế toán — gửi <b>email + mật khẩu</b> để họ đăng nhập. Họ không tự đăng ký.
    </div>

    {selMode && <div className="flex items-center justify-between gap-2 bg-white rounded-xl border border-line shadow-card px-3 py-2 sticky top-2 z-20">
      <label className="flex items-center gap-2 text-sm font-medium text-ink cursor-pointer select-none">
        <input type="checkbox" checked={allSel} onChange={toggleAll} className="w-4 h-4 accent-brand"/>
        Chọn tất cả <span className="text-ink-muted">({sel.size}/{selectable.length})</span>
      </label>
      <Btn variant="danger" disabled={!sel.size} onClick={bulkDelete} className="!py-2">🗑 Xoá đã chọn ({sel.size})</Btn>
    </div>}

    <div className="bg-white rounded-2xl border border-line shadow-card divide-y">
      {db.users.map(u=>{ const isSelf=u.id===me.id; const checked=selMode && sel.has(u.id);
        return <div key={u.id} onClick={selMode&&!isSelf?()=>toggleSel(u.id):undefined}
          className={"p-3 flex items-center gap-3 "+(u.active?'':'opacity-50')+(selMode&&!isSelf?' cursor-pointer':'')+(checked?' bg-brand/5':'')}>
        {selMode && <input type="checkbox" checked={checked} disabled={isSelf} onChange={()=>toggleSel(u.id)} onClick={e=>e.stopPropagation()}
          title={isSelf?'Không thể xoá chính mình':''} className="w-4 h-4 accent-brand shrink-0 disabled:opacity-30"/>}
        <div className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-600">{u.ho_ten[0]}</div>
        <div className="flex-1 min-w-0">
          <div className="text-sm font-medium text-ink truncate">{u.ho_ten}{u.is_dev && <span className="ml-1 text-[9px] px-1.5 py-0.5 rounded-full bg-violet-100 text-violet-700 font-bold align-middle">🔧 DEV</span>}{isSelf && <span className="text-[10px] text-slate-400"> (bạn)</span>}</div>
          <div className="text-xs text-slate-400 truncate">{u.email}</div>
        </div>
        {!selMode && <>
          <Select value={u.vai_tro} onChange={e=>setRole(u,e.target.value)} className="max-w-[130px] py-1 text-xs">
            {Object.values(ROLES).map(r=><option key={r} value={r}>{ROLE_LABEL[r]}</option>)}
          </Select>
          <Toggle on={u.active} onClick={()=>setActive(u,!u.active)} labels={['Bật','Tắt']}/>
          <button onClick={()=>setEdit(u)} className="text-xs text-blue-500 hover:underline">Sửa</button>
          <button onClick={()=>remove(u)} className="text-xs text-rose-500 hover:underline">Xoá</button>
        </>}
      </div>; })}
    </div>

    <Modal open={!!edit} onClose={()=>setEdit(null)} title={edit&&edit.id?'Sửa tài khoản':'Tạo tài khoản'}>
      {edit && <>
        <Field label="Họ tên" required><Input value={edit.ho_ten} onChange={e=>setEdit({...edit,ho_ten:e.target.value})}/></Field>
        <Field label="Email" required hint={edit.id?'Không đổi được email sau khi tạo':''}><Input type="email" value={edit.email} disabled={!!edit.id} onChange={e=>setEdit({...edit,email:e.target.value})}/></Field>
        <Field label="Mật khẩu" hint={edit.id?'Để trống nếu không đổi mật khẩu':'Người dùng đăng nhập bằng email + mật khẩu này'}><Input value={edit.password||''} placeholder={edit.id?'••••••':''} onChange={e=>setEdit({...edit,password:e.target.value})}/></Field>
        <Field label="Vai trò"><Select value={edit.vai_tro} onChange={e=>setEdit({...edit,vai_tro:e.target.value})}>{Object.values(ROLES).map(r=><option key={r} value={r}>{ROLE_LABEL[r]}</option>)}</Select></Field>
        <label className="flex items-center gap-2 mb-3 p-2.5 rounded-xl border border-line bg-slate-50 cursor-pointer">
          <input type="checkbox" checked={!!edit.is_dev} onChange={e=>setEdit({...edit,is_dev:e.target.checked})} className="w-4 h-4 accent-brand"/>
          <span className="text-sm"><b>🔧 Dev preview</b> — thấy các module đang nâng cấp (Chiến lược · Sản phẩm &amp; Claim · Kế hoạch nội dung)</span>
        </label>
        <div className="flex gap-2 mt-2"><Btn variant="ghost" onClick={()=>setEdit(null)}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={save}>{edit.id?'Lưu':'Tạo & cấp'}</Btn></div>
      </>}
    </Modal>
  </div>;
}

/* ============================================================
   LỊCH ĐĂNG POST — Marketing/Admin quản lý phân lượt
============================================================ */
function PostSchedule(){
  const { db, setPricing, regenSchedule, reassignSlot, notify } = useApp();
  const [on,setOn]=useState(schedOn(db.pricing));
  const [enf,setEnf]=useState(schedEnforce(db.pricing));
  const [days,setDays]=useState(schedDaysSet(db.pricing));
  const [busy,setBusy]=useState(false);
  useEffect(()=>{ setOn(schedOn(db.pricing)); setEnf(schedEnforce(db.pricing)); setDays(schedDaysSet(db.pricing)); }, [db.pricing]);
  const sales = db.users.filter(u=>u.active && u.vai_tro===ROLES.SALES);
  const topics = db.content_topics.filter(t=>t.active);
  const today = todayYMD();
  const upcoming = (db.post_slots||[]).filter(s=>s.ngay>=today).sort((a,b)=>a.ngay<b.ngay?-1:1);
  const past = (db.post_slots||[]).filter(s=>s.ngay<today).sort((a,b)=>a.ngay<b.ngay?1:-1).slice(0,10);
  const cnt={}; upcoming.forEach(s=>{ cnt[s.sales_id]=(cnt[s.sales_id]||0)+1; });
  const toggleDay=(d)=> setDays(prev=>{ const s=new Set(prev); s.has(d)?s.delete(d):s.add(d); return s; });
  const saveCfg=async()=>{ setBusy(true); const ok=await setPricing({...db.pricing, sched_on:on?1:0, sched_enforce:enf?1:0, sched_days:[...days].sort((a,b)=>a-b).join(',')}); setBusy(false); if(ok) notify('Đã lưu cấu hình lịch đăng'); };
  const regen=async()=>{ if(!confirm('Tạo lại lịch cho các suất CHƯA đăng? (suất đã đăng giữ nguyên)')) return; if(await regenSchedule()) notify('Đã tạo lại lịch đăng'); };
  const DOW_ORDER=[1,2,3,4,5,6,0];
  const slotRow=(s)=>{ const st=s.status;
    return <div key={s.id} className="p-3 flex flex-wrap items-center gap-2 border-b last:border-0">
      <div className="w-20 shrink-0"><div className="font-display font-bold text-ink text-sm">{SCHED_DOW[ymdDow(s.ngay)]}</div><div className="text-[11px] text-slate-400">{s.ngay.slice(8)+'/'+s.ngay.slice(5,7)}</div></div>
      <Select value={s.sales_id||''} onChange={e=>reassignSlot(s.id,{sales_id:e.target.value})} className="flex-1 min-w-[130px] !py-1.5 text-xs" disabled={st==='DA_DANG'}>
        {sales.map(u=><option key={u.id} value={u.id}>{u.ho_ten}</option>)}
      </Select>
      <Select value={s.topic_id||''} onChange={e=>reassignSlot(s.id,{topic_id:e.target.value})} className="flex-1 min-w-[150px] !py-1.5 text-xs" disabled={st==='DA_DANG'}>
        <option value="">— chủ đề gợi ý —</option>
        {topics.map(t=><option key={t.id} value={t.id}>{t.chu_de}</option>)}
      </Select>
      <span className={"text-[10px] px-1.5 py-0.5 rounded-full shrink-0 "+(st==='DA_DANG'?'bg-emerald-100 text-emerald-700':st==='BO_LO'?'bg-rose-100 text-rose-600':'bg-amber-100 text-amber-700')}>{st==='DA_DANG'?'✓ Đã đăng':st==='BO_LO'?'Bỏ lỡ':'Chờ đăng'}</span>
    </div>;
  };
  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <h2 className="font-display text-lg font-bold text-ink">📅 Lịch đăng POST (xoay vòng)</h2>
      {schedOn(db.pricing) && <Btn variant="ghost" onClick={regen}>🔄 Tạo lại lịch</Btn>}
    </div>
    <div className="bg-white rounded-2xl border border-line shadow-card p-4 space-y-3">
      <div className="flex items-center justify-between gap-3">
        <div><div className="text-sm font-semibold text-ink">Bật lịch đăng theo lượt</div><div className="text-[11px] text-slate-400">Hệ thống xoay vòng phân Sales + chủ đề gợi ý cho từng ngày.</div></div>
        <button onClick={()=>setOn(v=>!v)} className={"w-12 h-7 rounded-full transition relative shrink-0 "+(on?'bg-brand':'bg-slate-300')}><span className={"absolute top-0.5 w-6 h-6 bg-white rounded-full shadow transition-all "+(on?'left-[22px]':'left-0.5')}></span></button>
      </div>
      <div className="flex items-center justify-between gap-3">
        <div><div className="text-sm font-semibold text-ink">Chặn cứng</div><div className="text-[11px] text-slate-400">Chỉ đúng người, đúng ngày mới gửi POST được. Tắt = chỉ nhắc, vẫn cho đăng.</div></div>
        <button onClick={()=>setEnf(v=>!v)} className={"w-12 h-7 rounded-full transition relative shrink-0 "+(enf?'bg-brand':'bg-slate-300')}><span className={"absolute top-0.5 w-6 h-6 bg-white rounded-full shadow transition-all "+(enf?'left-[22px]':'left-0.5')}></span></button>
      </div>
      <div>
        <div className="text-sm font-semibold text-ink mb-1.5">Ngày đăng trong tuần</div>
        <div className="flex flex-wrap gap-1.5">{DOW_ORDER.map(d=><button key={d} onClick={()=>toggleDay(d)} className={"px-3 py-1.5 rounded-lg text-xs font-semibold "+(days.has(d)?'bg-brand text-white':'bg-slate-100 text-slate-500')}>{SCHED_DOW[d]}</button>)}</div>
      </div>
      <Btn variant="brand" onClick={saveCfg} disabled={busy}>{busy?'Đang lưu…':'Lưu cấu hình'}</Btn>
    </div>
    {!schedOn(db.pricing) ? <Empty>Lịch đăng đang tắt. Bật ở trên để hệ thống tự phân lượt cho Sales.</Empty> : <>
      {sales.length>0 && <div className="text-[11px] text-slate-500 flex flex-wrap gap-x-3 gap-y-1">Suất sắp tới theo Sales: {sales.map(u=><span key={u.id}>{u.ho_ten}: <b className="text-ink">{cnt[u.id]||0}</b></span>)}</div>}
      <div className="bg-white rounded-2xl border border-line shadow-card overflow-hidden">
        <div className="px-4 py-2 bg-slate-50 border-b text-sm font-semibold text-ink">Sắp tới ({upcoming.length} suất)</div>
        {upcoming.length===0 ? <div className="p-4"><Empty>Chưa có suất nào — bấm "Tạo lại lịch". (Cần có Sales đang hoạt động.)</Empty></div> : upcoming.map(slotRow)}
      </div>
      {past.length>0 && <div className="bg-white rounded-2xl border border-line shadow-card overflow-hidden">
        <div className="px-4 py-2 bg-slate-50 border-b text-sm font-semibold text-slate-500">Đã qua (gần đây)</div>
        {past.map(slotRow)}
      </div>}
    </>}
  </div>;
}

function AdminPricing(){

============================================================ */
function AdminPayroll(){
  const { db, markPaid:apiMarkPaid, notify } = useApp();
  const [ky, setKy] = useState('');
  const { posts, cmts } = allRows(db);
  const all = [...posts, ...cmts];
  const kyList = [...new Set(all.filter(x=>x.trang_thai===ST.DAT||x.trang_thai===ST.DA_CHI).map(x=>x.ky_thanh_toan||kyOf(x.created_at)))].sort().reverse();

  const flt = x => (x.trang_thai===ST.DAT||x.trang_thai===ST.DA_CHI) && (!ky || (x.ky_thanh_toan||kyOf(x.created_at))===ky);

  const filmings = (db.project_filmings||[]).map(f=>({...f}));
  // gom theo sales
  const bySales = {};
  db.users.filter(u=>u.vai_tro===ROLES.SALES).forEach(u=>{ bySales[u.id]={u, postDat:0,tienPost:0,cmtDat:0,tienCmt:0,quayDat:0,tienQuay:0,daChi:0,conLai:0}; });
  posts.filter(flt).forEach(p=>{ const r=bySales[p.sales_id]; if(!r)return; r.postDat++; r.tienPost+=p.thanh_tien; if(p.trang_thai===ST.DA_CHI)r.daChi+=p.thanh_tien; else r.conLai+=p.thanh_tien; });
  cmts.filter(flt).forEach(c=>{ const r=bySales[c.sales_id]; if(!r)return; r.cmtDat++; r.tienCmt+=c.thanh_tien; if(c.trang_thai===ST.DA_CHI)r.daChi+=c.thanh_tien; else r.conLai+=c.thanh_tien; });
  filmings.filter(flt).forEach(f=>{ const r=bySales[f.sales_id]; if(!r)return; r.quayDat++; r.tienQuay+=f.thanh_tien; if(f.trang_thai===ST.DA_CHI)r.daChi+=f.thanh_tien; else r.conLai+=f.thanh_tien; });
  const rows = Object.values(bySales).filter(r=>r.postDat||r.cmtDat||r.quayDat);

  const markPaid = async (salesId) => {
    if(!confirm('Đánh dấu ĐÃ CHI tất cả item Đạt của Sales này trong kỳ '+(ky||'tất cả')+'?')) return;
    if(await apiMarkPaid(salesId, ky||null)) notify('Đã đánh dấu Đã chi');
  };
  const exportPayroll = () => {
    const r=[['Sales','Post đạt','Tiền post','Cmt đạt','Tiền cmt','Quay đạt','Tiền quay','Tổng phải trả','Đã chi','Còn lại']];
    rows.forEach(x=>r.push([x.u.ho_ten,x.postDat,x.tienPost,x.cmtDat,x.tienCmt,x.quayDat,x.tienQuay,x.tienPost+x.tienCmt+x.tienQuay,x.daChi,x.conLai]));
    download('BANG_LUONG_'+(ky||'ALL')+'.csv', toCSV(r));
  };

  const tong = rows.reduce((a,x)=>({tt:a.tt+x.tienPost+x.tienCmt+x.tienQuay, chi:a.chi+x.daChi, con:a.con+x.conLai}),{tt:0,chi:0,con:0});

  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <h2 className="font-display text-lg font-bold text-ink">🧾 Bảng lương</h2>
      <div className="flex gap-2 items-center">
        <Select value={ky} onChange={e=>setKy(e.target.value)}><option value="">Tất cả kỳ</option>{kyList.map(k=><option key={k}>{k}</option>)}</Select>
        <Btn variant="brand" onClick={exportPayroll}>⬆ Xuất Excel</Btn>
      </div>
    </div>
    <div className="grid grid-cols-3 gap-3">
      <Stat label="Tổng phải trả" value={fmtVND(tong.tt)}/>
      <Stat label="Đã chi" value={fmtVND(tong.chi)} color="text-indigo-600"/>
      <Stat label="Còn lại" value={fmtVND(tong.con)} color="text-rose-600"/>
    </div>
    <div className="bg-white rounded-2xl border border-line shadow-card overflow-auto">
      <table className="w-full text-sm min-w-[720px]">
        <thead className="bg-slate-50/70 text-[11px] font-semibold uppercase tracking-wide text-ink-muted text-left"><tr>
          <Th>Sales</Th><Th r>Post đạt</Th><Th r>Tiền post</Th><Th r>Cmt đạt</Th><Th r>Tiền cmt</Th><Th r>Quay đạt</Th><Th r>Tiền quay</Th><Th r>Tổng phải trả</Th><Th r>Đã chi</Th><Th r>Còn lại</Th><Th></Th>
        </tr></thead>
        <tbody className="divide-y">
          {rows.length===0 ? <tr><td colSpan="11"><Empty>Chưa có item đạt trong kỳ.</Empty></td></tr> :
            rows.map(x=><tr key={x.u.id} className="hover:bg-slate-50">
              <Td>{x.u.ho_ten}</Td><Td r>{x.postDat}</Td><Td r>{fmtVND(x.tienPost)}</Td><Td r>{x.cmtDat}</Td><Td r>{fmtVND(x.tienCmt)}</Td>
              <Td r>{x.quayDat}</Td><Td r className="text-brand-dark font-medium">{fmtVND(x.tienQuay)}</Td>

const ytId = (u)=>{ const m=/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/.exec(u||''); return m?m[1]:null; };
const driveId = (u)=>{ const m=/drive\.google\.com\/file\/d\/([\w-]+)/.exec(u||''); return m?m[1]:null; };
function EmbedMedia({url, className='w-full h-full', autoplay=false}){
  if(!url) return <div className={className+" flex items-center justify-center bg-slate-900 text-white/60 text-sm"}>Chưa có video/ảnh mẫu</div>;

  if(isAppMedia(url) || /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url)) return <video src={url} controls autoPlay={autoplay} playsInline preload="metadata" className={className+" bg-black object-contain"}/>;

function FilmingEditor({onDone, project}){
  const { db, createFilming, editFilming, notify } = useApp();
  const templates = (db.filming_templates||[]).filter(t=>t.active!==false);
  const editing = !!project;
  const [templateId, setTemplateId] = useState(project ? project.template_id : templates[0]?.id);
  const template = filmFindTpl(db, templateId);
  const [ten, setTen] = useState(project ? project.ten_cong_trinh : '');
  const [khu, setKhu] = useState(project ? (project.khu_vuc||'') : '');
  const [ngay, setNgay] = useState((project && project.ngay_quay ? String(project.ngay_quay) : new Date().toISOString()).slice(0,10));
  const [uploads, setUploads] = useState(project ? (project.uploads||[]).map(u=>({id:u.id, shot_id:u.shot_id, media_type:u.media_type, media_url:u.media_url})) : []);
  const [openShot, setOpenShot] = useState(null);
  const [sampleShot, setSampleShot] = useState(null);
  const [busy, setBusy] = useState(false);

  const changeTemplate = (id)=>{ if(id!==templateId && uploads.length && !confirm('Đổi quy trình sẽ xoá nguồn đã thêm. Tiếp tục?')) return; setTemplateId(id); setUploads([]); };
  const addMedia = (shotId, item)=> setUploads(prev=>[...prev, {id:uid('up'), shot_id:shotId, ...item}]);
  const delMedia = (id)=> setUploads(prev=>prev.filter(u=>u.id!==id));
  const mediaOf = (shotId)=> uploads.filter(u=>u.shot_id===shotId);

  const reqShots = template ? filmReqShots(template) : [];
  const reqDone = reqShots.filter(s=>mediaOf(s.id).length>0).length;
  const canSubmit = ten.trim() && template && reqDone===reqShots.length;
  const upList = ()=> uploads.map(u=>({id:u.id, shot_id:u.shot_id, media_type:u.media_type, media_url:u.media_url}));

  const save = async (doSubmit) => {
    if(doSubmit && !ten.trim()) return notify('Nhập tên công trình để gửi nghiệm thu','warn');
    if(doSubmit && !canSubmit) return notify('Cần đủ nguồn cho các cảnh bắt buộc mới gửi được','warn');
    const finalTen = ten.trim() || ('Nháp — '+new Date().toLocaleDateString('vi-VN'));
    setBusy(true);
    const payload = { template_id:templateId, ten_cong_trinh:finalTen, khu_vuc:khu.trim(), ngay_quay:ngay, submit:doSubmit, uploads: upList() };
    const ok = editing ? await editFilming(project.id, payload) : await createFilming(payload);
    setBusy(false);
    if(ok){ notify(doSubmit?'Đã gửi nghiệm thu':'Đã lưu nháp'); onDone(); }
  };

  return <div className="space-y-4">
    <button onClick={onDone} className="text-sm text-slate-500 hover:text-ink">← Quay lại danh sách</button>

// Popup tải nguồn cho 1 cảnh: tải trực tiếp lên app (R2) hoặc dán link Drive
function ShotUploadModal({shot, media, onClose, onAdd, onDel}){
  const { uploadMedia, notify } = useApp();
  const [tab, setTab] = useState('upload');
  const [link, setLink] = useState('');
  const [busy, setBusy] = useState(false);
  const [prog, setProg] = useState(null); // {name, pct, loaded, total}
  const [preview, setPreview] = useState(null); // xem trước 1 nguồn
  const fileRef = useRef(null);
  const MAX = 100*1024*1024;

  const onFile = async (e) => {
    const files = Array.from(e.target.files||[]); e.target.value='';
    for(const f of files){
      if(f.size > MAX){ notify(`"${f.name}" ${fmtMB(f.size)} > 100MB — video lớn hãy dùng tab Dán link Drive`,'warn'); continue; }
      setBusy(true); setProg({ name:f.name, pct:0, loaded:0, total:f.size });
      try{
        const r = await uploadMedia(f, (pct,loaded,total)=>setProg({ name:f.name, pct, loaded, total }));
        onAdd({ media_type: r.media_type || (f.type.startsWith('image/')?MEDIA_TYPE.IMAGE:MEDIA_TYPE.VIDEO), media_url: r.media_url, nguon:'APP' });
        notify('Đã thêm 1 nguồn','ok');
      }catch(err){ notify(err.message||'Tải lên lỗi','err'); }
      setProg(null); setBusy(false);
    }
  };
  const addLink = () => { if(!link.trim()) return; onAdd({ media_type: isImgUrl(link)?MEDIA_TYPE.IMAGE:MEDIA_TYPE.VIDEO, media_url: link.trim(), nguon:'LINK' }); setLink(''); notify('Đã thêm link'); };

  return <Modal open onClose={onClose} title={shot.ten} wide>
    <div className="flex items-start gap-2 mb-3">
      <span className="text-2xl">{iconFor(shot.ten)}</span>
      <div className="flex-1 min-w-0"><div className="text-sm text-slate-600">{shot.mo_ta}</div>{shot.bat_buoc&&<div className="mt-1"><ReqBadge/></div>}</div>
      {shot.source_mau_url && <a href={shot.source_mau_url} target="_blank" className="text-xs text-blue-500 hover:underline shrink-0">👁 Xem mẫu</a>}
    </div>

    {/* Nguồn đã thêm — ô xem lớn, bấm để xem trước popup */}
    {media.length>0 && <div className="mb-3">
      <div className="text-xs font-semibold text-slate-600 mb-1.5">Nguồn đã thêm ({media.length}) — bấm để xem</div>
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
        {media.map(m=><div key={m.id} className="relative group rounded-xl overflow-hidden border border-slate-200 bg-slate-100 aspect-video">
          <button type="button" onClick={()=>setPreview(m)} className="block w-full h-full"><MediaThumb m={m}/></button>
          <span onClick={()=>onDel(m.id)} className="absolute top-1 right-1 bg-black/60 text-white rounded-full w-6 h-6 text-sm leading-6 text-center cursor-pointer">×</span>
          <span className="absolute bottom-1 left-1 text-[9px] px-1.5 py-0.5 rounded-full bg-black/55 text-white">{isDriveLink(m)?'🔗 Link':(m.media_type===MEDIA_TYPE.IMAGE?'🖼️ Ảnh':'🎬 Video')}</span>
        </div>)}
      </div>
    </div>}

    <div className="flex gap-1 bg-slate-100 p-1 rounded-xl mb-3">
      <button onClick={()=>setTab('upload')} className={"flex-1 px-3 py-1.5 rounded-lg text-sm font-medium "+(tab==='upload'?'bg-white shadow text-ink':'text-slate-500')}>📤 Tải lên app</button>
      <button onClick={()=>setTab('link')} className={"flex-1 px-3 py-1.5 rounded-lg text-sm font-medium "+(tab==='link'?'bg-white shadow text-ink':'text-slate-500')}>🔗 Dán link Drive</button>
    </div>

    {tab==='upload' ? <div>
      <input ref={fileRef} type="file" accept="image/*,video/*" multiple className="hidden" onChange={onFile} disabled={busy}/>
      <Btn variant="brand" className="w-full" disabled={busy} onClick={()=>fileRef.current && fileRef.current.click()}>{busy?'⏳ Đang tải lên…':'＋ Chọn ảnh / video'}</Btn>
      {prog && <div className="mt-2">
        <div className="flex items-center justify-between text-[11px] text-slate-500 mb-1"><span className="truncate max-w-[55%]">{prog.name}</span><span>{prog.pct}% · {fmtMB(prog.loaded)}/{fmtMB(prog.total)}</span></div>
        <div className="h-2 bg-slate-200 rounded-full overflow-hidden"><div className="h-full bg-brand transition-all" style={{width:prog.pct+'%'}}></div></div>
      </div>}
      <div className="text-[11px] text-slate-400 mt-2">Lưu thẳng vào app · tối đa 100MB/file. Video &gt;100MB hãy dùng tab “Dán link Drive”.</div>
    </div> : <div>
      <Field label="Link Google Drive (đặt quyền 'Ai có link đều xem')"><Input value={link} onChange={e=>setLink(e.target.value)} placeholder="https://drive.google.com/file/d/…" onKeyDown={e=>e.key==='Enter'&&addLink()}/></Field>
      <Btn variant="brand" className="w-full" onClick={addLink}>Thêm link</Btn>
    </div>}

    <div className="flex justify-end mt-4"><Btn variant="brand" onClick={onClose}>Xong</Btn></div>

    {/* popup xem trước 1 nguồn */}
    {preview && <div className="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-3" onClick={()=>setPreview(null)}>
      <div className="w-full max-w-2xl" onClick={e=>e.stopPropagation()}>
        <div className="rounded-2xl overflow-hidden bg-black aspect-video"><MediaView m={preview}/></div>
        <div className="flex justify-between mt-2">
          <Btn variant="danger" onClick={()=>{onDel(preview.id); setPreview(null);}}>Xoá nguồn này</Btn>
          <Btn variant="ghost" onClick={()=>setPreview(null)}>Đóng</Btn>
        </div>
      </div>
    </div>}
  </Modal>;
}

function MediaThumbMini({r}){
  const m=r.up;

  if(!isDriveLink(m)) return <video src={m.media_url} muted preload="metadata" className="w-full h-full object-cover"/>;

// Kho media 2 khung: trái = danh sách theo thư mục / nhóm source, phải = xem trước
function MediaManager(){
  const { db, deleteUpload, cleanupMedia, notify } = useApp();
  const sidx = shotIndex(db);
  const users = db.users||[];
  const [fSt, setFSt] = useState('');
  const [fNguon, setFNguon] = useState('');
  const [q, setQ] = useState('');
  const [groupBy, setGroupBy] = useState('project'); // project | shot
  const [sel, setSel] = useState(null);
  const cut = new Date(Date.now()-30*864e5).toISOString();

  const rows = (db.project_filmings||[]).flatMap(p=>(p.uploads||[]).map(u=>{
    const isApp = isAppMedia(u.media_url);
    const chuaDuyet = !['DAT','DA_CHI'].includes(p.trang_thai);
    const expDay = chuaDuyet ? Math.max(0, 30 - Math.floor((Date.now()-new Date(p.created_at||Date.now()).getTime())/864e5)) : null;
    return { key:u.id, up:u, p, isApp, chuaDuyet, expDay,
      sales: users.find(x=>x.id===p.sales_id)?.ho_ten||'—',
      shot: sidx[u.shot_id]?.ten||'(cảnh đã xoá)', phase: sidx[u.shot_id]?.phase||'' };
  })).filter(r=> (!fSt||r.p.trang_thai===fSt) && (!fNguon|| (fNguon==='APP'?r.isApp:!r.isApp)) && (!q|| (r.p.ten_cong_trinh+' '+r.shot+' '+r.sales).toLowerCase().includes(q.toLowerCase())));

  const appCount = rows.filter(r=>r.isApp).length;
  const expiring = (db.project_filmings||[]).filter(p=>!['DAT','DA_CHI'].includes(p.trang_thai)&&(p.created_at||'')<cut).reduce((s,p)=>s+(p.uploads||[]).length,0);
  const selRow = rows.find(r=>r.key===(sel&&sel.key)) || null;

  // gom nhóm
  const groups = [];
  const gmap = {};
  const gkey = r => groupBy==='project' ? r.p.id : r.shot;
  const glabel = r => groupBy==='project' ? {t:'📁 '+r.p.ten_cong_trinh, s:r.sales+' · '+ST_LABEL[r.p.trang_thai]} : {t:'🎬 '+r.shot, s:'nhóm source · '+r.phase};
  rows.forEach(r=>{ const k=gkey(r); if(!gmap[k]){ gmap[k]={...glabel(r), items:[]}; groups.push(gmap[k]); } gmap[k].items.push(r); });

  const del = async (r)=>{ if(!confirm('Xoá media này khỏi công trình "'+r.p.ten_cong_trinh+'"?'))return; if(await deleteUpload(r.up.id)){ notify('Đã xoá media'); if(selRow&&selRow.key===r.key) setSel(null); } };
  const clean = async ()=>{ if(!confirm('Dọn ngay toàn bộ media của công trình CHƯA duyệt quá 30 ngày?'))return; await cleanupMedia(); };

  return <div className="space-y-3">
    <div className="grid grid-cols-3 gap-3">
      <Stat label="Tổng media" value={rows.length}/>
      <Stat label="Lưu trong app (R2)" value={appCount} sub="còn lại là link Drive"/>
      <Stat label="Sắp bị dọn (quá 30 ngày)" value={expiring} color="text-rose-600"/>
    </div>
    <div className="bg-brand/10 border border-brand/30 rounded-xl px-3 py-2 text-[11px] text-brand-dark flex items-center justify-between gap-2">
      <span>Media công trình <b>chưa duyệt</b> tự xoá sau <b>30 ngày</b>. File app mới bị xoá; link Drive chỉ gỡ khỏi danh sách.</span>
      <Btn variant="soft" onClick={clean}>🧹 Dọn ngay</Btn>
    </div>
    <div className="bg-white rounded-2xl border border-line shadow-card p-3 flex flex-wrap gap-2 items-center">
      <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
        <button onClick={()=>setGroupBy('project')} className={"px-2.5 py-1 rounded-lg text-xs font-medium "+(groupBy==='project'?'bg-white shadow text-ink':'text-slate-500')}>📁 Theo công trình</button>
        <button onClick={()=>setGroupBy('shot')} className={"px-2.5 py-1 rounded-lg text-xs font-medium "+(groupBy==='shot'?'bg-white shadow text-ink':'text-slate-500')}>🎬 Theo nhóm source</button>
      </div>
      <Input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm công trình / cảnh / sales…" className="max-w-[200px]"/>
      <Select value={fSt} onChange={e=>setFSt(e.target.value)} className="max-w-[150px]"><option value="">Mọi trạng thái</option>{Object.keys(ST_LABEL).map(s=><option key={s} value={s}>{ST_LABEL[s]}</option>)}</Select>
      <Select value={fNguon} onChange={e=>setFNguon(e.target.value)} className="max-w-[140px]"><option value="">Mọi nguồn</option><option value="APP">Tải lên app</option><option value="LINK">Link Drive</option></Select>
    </div>

    {rows.length===0 ? <Empty>Chưa có media nào.</Empty> :
    <div className="grid md:grid-cols-[minmax(0,1fr)_minmax(0,1.05fr)] gap-3">
      {/* trái: danh sách theo thư mục */}
      <div className="bg-white rounded-2xl border border-line shadow-card overflow-hidden max-h-[70vh] overflow-y-auto">
        {groups.map((g,gi)=><div key={gi}>
          <div className="px-3 py-2 border-b bg-slate-50 sticky top-0"><div className="text-xs font-semibold text-ink truncate">{g.t}</div><div className="text-[10px] text-slate-400">{g.s} · {g.items.length} nguồn</div></div>

          </div>
          <div className="flex justify-end gap-2 mt-3"><a href={selRow.up.media_url} target="_blank"><Btn variant="ghost">↗ Mở</Btn></a><Btn variant="danger" onClick={()=>del(selRow)}>Xoá</Btn></div>
        </div> : <div className="text-slate-400 text-sm text-center py-20">Chọn 1 nguồn bên trái để xem trước</div>}

}
function FilmLibrary(){

  const templates = (db.filming_templates||[]);
  const [selId, setSelId] = useState(templates[0]?.id);
  useEffect(()=>{ if(!templates.find(t=>t.id===selId)) setSelId(templates[0]?.id); }, [db.filming_templates]);
  const template = templates.find(t=>t.id===selId) || templates[0];
  const [editShot, setEditShot] = useState(null);
  const [editPhase, setEditPhase] = useState(null);
  const [editTpl, setEditTpl] = useState(null);

  const saveShot = (phaseId, shot) => { upsertFilmShot(template.id, phaseId, shot); setEditShot(null); };
  const delShot = (phaseId, id) => { if(confirm('Xoá cảnh này?')) deleteFilmShot(template.id, phaseId, id); };
  const savePhase = (phase) => { upsertFilmPhase(template.id, phase); setEditPhase(null); };
  const saveTpl = (tpl) => { upsertFilmTemplate(tpl); setEditTpl(null); };
  const delTpl = () => { if(templates.length<=1) return notify('Phải còn ít nhất 1 quy trình','warn'); if(confirm('Xoá cả quy trình "'+template.ten+'"?')) deleteFilmTemplate(template.id); };

  if(!template) return <Empty>Chưa có quy trình. Bấm "Quy trình mới".</Empty>;
  return <div className="space-y-3">
    <div className="bg-white rounded-2xl border border-line shadow-card p-4 space-y-3">
      <div className="flex items-end gap-2 flex-wrap">
        <label className="flex-1 min-w-[200px]"><div className="text-xs font-semibold text-slate-600 mb-1">Quy trình / hệ sản phẩm</div>
          <Select value={selId} onChange={e=>setSelId(e.target.value)}>{templates.map(t=><option key={t.id} value={t.id}>{t.he_san_pham} — {t.ten}{t.active===false?' (ẩn)':''}</option>)}</Select></label>
        <Btn variant="brand" onClick={()=>setEditTpl({ten:'',he_san_pham:''})}>＋ Quy trình mới</Btn>
      </div>
      <div className="flex items-center justify-between flex-wrap gap-2 pt-1">
        <div className="flex items-center gap-2 flex-wrap"><HeChip he={template.he_san_pham}/><span className="font-semibold text-ink">{template.ten}</span>
          <span className="text-[11px] text-slate-400">{filmCountShots(template)} cảnh · {filmReqShots(template).length} bắt buộc · {template.phases.length} giai đoạn</span></div>
        <div className="flex gap-2"><button onClick={()=>setEditTpl(template)} className="text-xs text-blue-500 hover:underline">Sửa quy trình</button>
          <button onClick={delTpl} className="text-xs text-rose-500 hover:underline">Xoá quy trình</button></div>
      </div>
    </div>
    <div className="flex justify-end"><Btn variant="ghost" onClick={()=>setEditPhase({ten:''})}>＋ Thêm giai đoạn</Btn></div>
    {template.phases.map(ph=><div key={ph.id} className="bg-white rounded-2xl border border-line shadow-card overflow-hidden">
      <div className="px-4 py-2 bg-slate-50 border-b flex items-center justify-between">
        <span className="text-sm font-semibold text-ink">{ph.thu_tu}. {ph.ten}</span>
        <div className="flex gap-2"><button onClick={()=>setEditPhase(ph)} className="text-xs text-blue-500 hover:underline">Sửa</button>
          <button onClick={()=>{ if(confirm('Xoá giai đoạn này và các cảnh bên trong?')) deleteFilmPhase(template.id, ph.id); }} className="text-xs text-rose-500 hover:underline">Xoá</button>
          <button onClick={()=>setEditShot({phaseId:ph.id, shot:{ten:'',mo_ta:'',source_mau_url:'',bat_buoc:true,active:true}})} className="text-xs text-brand-dark hover:underline">＋ Thêm cảnh</button></div>
      </div>
      <div className="divide-y">
        {ph.shots.length===0 && <div className="p-3 text-xs text-slate-400">Chưa có cảnh nào.</div>}
        {ph.shots.map(shot=><div key={shot.id} className={"p-3 flex items-start gap-2 "+(shot.active?'':'opacity-50')}>
          <div className="flex-1 min-w-0"><div className="flex items-center gap-2 flex-wrap"><span className="text-sm font-medium text-ink">{shot.ten}</span>{shot.bat_buoc&&<ReqBadge/>}</div>
            <div className="text-xs text-slate-500 mt-0.5 line-clamp-2">{shot.mo_ta||<span className="italic text-slate-300">chưa có mô tả</span>}</div>
            {shot.source_mau_url && <a href={shot.source_mau_url} target="_blank" className="text-[11px] text-blue-500 underline">🔗 mẫu</a>}</div>
          <div className="flex flex-col items-end gap-1 shrink-0">
            <Toggle on={shot.active} onClick={()=>saveShot(ph.id, {...shot, active:!shot.active})}/>
            <div className="flex gap-1"><button onClick={()=>setEditShot({phaseId:ph.id, shot})} className="text-xs text-blue-500 hover:underline">Sửa</button>
              <button onClick={()=>delShot(ph.id, shot.id)} className="text-xs text-rose-500 hover:underline">Xoá</button></div>
          </div>
        </div>)}
      </div>
    </div>)}
    <Modal open={!!editTpl} onClose={()=>setEditTpl(null)} title={(editTpl?.id?'Sửa ':'Thêm ')+'quy trình quay'}>{editTpl && <TemplateForm tpl={editTpl} onCancel={()=>setEditTpl(null)} onSave={saveTpl}/>}</Modal>
    <Modal open={!!editShot} onClose={()=>setEditShot(null)} title={(editShot?.shot?.id?'Sửa ':'Thêm ')+'cảnh cần quay'}>{editShot && <ShotForm shot={editShot.shot} onCancel={()=>setEditShot(null)} onSave={s=>saveShot(editShot.phaseId, s)}/>}</Modal>
    <Modal open={!!editPhase} onClose={()=>setEditPhase(null)} title={(editPhase?.id?'Sửa ':'Thêm ')+'giai đoạn'}>{editPhase && <PhaseForm phase={editPhase} onCancel={()=>setEditPhase(null)} onSave={savePhase}/>}</Modal>
  </div>;
}
function TemplateForm({tpl, onCancel, onSave}){

}

  return <>

    <Field label="Mô tả yêu cầu" hint="Sales đọc để quay đúng ý"><Textarea rows="3" value={f.mo_ta} onChange={e=>set('mo_ta',e.target.value)}/></Field>
    <Field label="Video/ảnh mẫu cho cảnh" hint="Dán link YouTube/Google Drive, hoặc tải video mẫu thẳng lên app. Sales bấm 'Xem mẫu' sẽ phát được.">
      <Input value={f.source_mau_url} onChange={e=>set('source_mau_url',e.target.value)} placeholder="https://youtu.be/… hoặc link Drive…"/>
      <div className="flex items-center gap-2 mt-2">
        <input ref={sampleRef} type="file" accept="video/*,image/*" className="hidden" onChange={onSample}/>
        <Btn variant="soft" onClick={()=>sampleRef.current&&sampleRef.current.click()} disabled={busy}>{busy?'⏳ Đang tải…':'📤 Tải video mẫu lên app'}</Btn>
        {f.source_mau_url && <span className="text-[11px] text-emerald-600">✓ đã có mẫu</span>}
      </div>

    </Field>
    <div className="mb-3 text-[11px] text-slate-400 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5">💡 Tiền quay tính theo <b>mức chất lượng từng source</b> (Tạm ổn/Chuẩn/Đẹp) khi Marketing nghiệm thu — cấu hình giá ở mục Đơn giá.</div>
    <div className="mb-3 flex items-center justify-between p-3 rounded-xl border border-slate-200 bg-slate-50">
      <div><div className="text-xs font-semibold text-slate-700">Bắt buộc</div><div className="text-[11px] text-slate-400">Sales phải quay cảnh này mới gửi được</div></div>
      <button type="button" onClick={()=>set('bat_buoc',!f.bat_buoc)} className={"w-12 h-7 rounded-full transition relative "+(f.bat_buoc?'bg-brand':'bg-slate-300')}><span className={"absolute top-0.5 w-6 h-6 bg-white rounded-full shadow transition-all "+(f.bat_buoc?'left-[22px]':'left-0.5')}></span></button>
    </div>
    <div className="flex gap-2"><Btn variant="ghost" onClick={onCancel}>Huỷ</Btn><Btn variant="brand" className="flex-1" onClick={()=>f.ten.trim()&&onSave(f)}>Lưu</Btn></div>

}

function FilmQueue(){

  return <div className="space-y-3">

      return <button key={p.id} onClick={()=>setReview(p)} className="w-full text-left bg-white rounded-2xl border border-line shadow-card p-3 flex items-center justify-between gap-2 hover:bg-slate-50">
        <div className="min-w-0"><div className="text-sm font-medium text-ink truncate">{p.ten_cong_trinh}</div>
          <div className="text-[11px] text-slate-400">{sales?.ho_ten||'—'} · {tpl?.he_san_pham} · {p.khu_vuc} · {have}/{total} cảnh</div></div>

      </button>; })}

function FilmReview({project, template, onBack}){
  const { db, reviewFilming, notify } = useApp();
  // chấm từng source theo MỨC: rate[uploadId] = 0(loại) | 1(Tạm ổn) | 2(Chuẩn) | 3(Đẹp) | undefined(chưa)
  const [rate, setRate] = useState(()=>{ const r={}; (project.uploads||[]).forEach(u=>{ if(u.dat_item===false) r[u.id]=0; else if(filmSrcLevel(u)>0) r[u.id]=filmSrcLevel(u); }); return r; });
  const [reason, setReason] = useState('');
  const [rejecting, setRejecting] = useState(false);
  const [preview, setPreview] = useState(null);
  const [sampleShot, setSampleShot] = useState(null);
  const sales = db.users.find(u=>u.id===project.sales_id);
  const mediaOf = (shot)=> (project.uploads||[]).filter(u=>u.shot_id===shot.id);
  const setSrc = (id,v)=> setRate(r=>({...r, [id]: v}));   // v: undefined chưa · 0 loại · 1/2/3 mức
  const srcOk = (u)=> (rate[u.id]||0) >= 1;
  const shotOk = (shot)=> mediaOf(shot).some(srcOk);

  const shots = template ? template.phases.flatMap(p=>p.shots.filter(s=>s.active)) : [];
  const datShots = shots.filter(shotOk);
  const okSources = (project.uploads||[]).filter(srcOk);
  const total = okSources.reduce((t,u)=> t + filmLevelPrice(rate[u.id], db.pricing), 0);
  const lvCount = (lv)=> okSources.filter(u=>Number(rate[u.id])===lv).length;
  const ratings = ()=>{ const o={}; Object.keys(rate).forEach(k=>{ if(rate[k]!==undefined) o[k]=Number(rate[k])||0; }); return o; };

  const doDone = async ()=>{ if(await reviewFilming(project.id, ST.DAT, '', ratings())){ notify('✅ Hoàn tất — chốt '+fmtVND(total)+' ('+okSources.length+' source đạt)'); onBack(); } };
  const doReject = async ()=>{ if(!reason.trim()) return notify('Nhập lý do','warn'); if(await reviewFilming(project.id, ST.KHONG_DAT, reason.trim(), ratings())){ notify('Đã trả về Sales quay lại'); onBack(); } };

  return <div className="space-y-4">
    <button onClick={onBack} className="text-sm text-slate-500 hover:text-ink">← Hàng chờ nghiệm thu</button>
    <div><h3 className="font-display text-lg font-bold text-ink">{project.ten_cong_trinh}</h3>
      <div className="text-xs text-slate-400 flex items-center gap-2"><HeChip he={template?.he_san_pham}/> {sales?.ho_ten||'—'} · {project.khu_vuc} · {fmtDay(project.ngay_quay)}</div></div>
    <div className="bg-brand/10 border border-brand/30 rounded-xl px-3 py-2 text-xs text-brand-dark space-y-1">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <span>Chấm <b>mức chất lượng</b> mỗi source — tính tiền theo từng source: {FILM_LEVELS.map(l=><span key={l.v}>{l.v>1?' · ':''}<b>{l.ten}</b> {fmtVND(filmLevelPrice(l.v,db.pricing))}</span>)}.</span>
        <span className="shrink-0">Đạt <b>{okSources.length}</b> source · Cảnh <b>{datShots.length}/{shots.length}</b> · <b className="text-emerald-700">{fmtVND(total)}</b></span>
      </div>
      {okSources.length>0 && <div className="flex gap-2 flex-wrap">{FILM_LEVELS.map(l=> lvCount(l.v)>0 ? <span key={l.v} className={"px-1.5 py-0.5 rounded-full "+l.cls}>{l.ten}: {lvCount(l.v)} × {fmtVND(filmLevelPrice(l.v,db.pricing))}</span> : null)}</div>}
    </div>
    {template && template.phases.map(ph=><div key={ph.id} className="bg-white rounded-2xl border border-line shadow-card overflow-hidden">
      <div className="px-4 py-2 bg-slate-50 border-b text-sm font-semibold text-ink">{ph.thu_tu}. {ph.ten}</div>
      <div className="divide-y">
        {ph.shots.filter(s=>s.active).map(shot=>{ const md=mediaOf(shot); const ok=shotOk(shot);
          return <div key={shot.id} className="p-3">
            <div className="flex items-start justify-between gap-2 flex-wrap">
              <div className="min-w-0"><div className="flex items-center gap-2 flex-wrap"><span className="text-sm font-medium text-ink">{shot.ten}</span>{shot.bat_buoc&&<ReqBadge/>}</div>
                <div className="text-xs text-slate-500 mt-0.5">{shot.mo_ta}</div></div>
              <div className="flex items-center gap-2 shrink-0">
                {md.length>0 && <span className={"text-[11px] font-semibold "+(ok?'text-emerald-600':'text-slate-400')}>{ok?('✓ '+md.filter(srcOk).length+' source đạt'):'Chưa chấm đạt'}</span>}
                <button onClick={()=>setSampleShot(shot)} className="text-xs text-blue-500 hover:underline">👁 Mẫu</button>
              </div>
            </div>
            {md.length===0 ? <div className="text-xs text-rose-400 mt-2">✗ Sales chưa nộp source</div> :
            <div className="flex gap-2 mt-2 flex-wrap">
              {md.map(m=>{ const st=rate[m.id]; const L=filmLevelOf(st);
                return <div key={m.id} className={"w-28 rounded-lg border overflow-hidden "+(st>=1?'border-emerald-400 ring-1 ring-emerald-200':st===0?'border-rose-300 opacity-70':'border-slate-200')}>
                  <button onClick={()=>setPreview(m)} className="block w-full h-16 bg-slate-100 relative">
                    {m.media_type===MEDIA_TYPE.IMAGE && !isDriveLink(m) ? <img src={m.media_url} className="w-full h-full object-cover"/>
                      : (!isDriveLink(m)) ? <video src={m.media_url} muted preload="metadata" className="w-full h-full object-cover"/>
                      : <span className="absolute inset-0 flex items-center justify-center text-2xl">🔗</span>}
                    {L&&<span className={"absolute top-0.5 right-0.5 text-white text-[9px] px-1 rounded-full "+(st===1?'bg-amber-500':st===2?'bg-sky-500':'bg-emerald-500')}>{L.ten}</span>}
                    {st===0&&<span className="absolute top-0.5 right-0.5 bg-rose-500 text-white text-[9px] px-1 rounded-full">✗</span>}
                  </button>
                  <select value={st===undefined?'':String(st)} onChange={e=>setSrc(m.id, e.target.value===''?undefined:Number(e.target.value))}
                    className="w-full text-[11px] border-t px-1 py-1 bg-white focus:outline-none cursor-pointer">
                    <option value="">— chấm —</option>
                    <option value="0">✗ Loại</option>
                    {FILM_LEVELS.map(l=><option key={l.v} value={l.v}>{l.ten} · {fmtVND(filmLevelPrice(l.v,db.pricing))}</option>)}
                  </select>
                </div>;})}
            </div>}
          </div>; })}
      </div>
    </div>)}
    <div className="sticky bottom-0 bg-slate-100 pt-2 pb-1 space-y-2">
      {rejecting && <Textarea rows="2" value={reason} onChange={e=>setReason(e.target.value)} placeholder="Lý do trả về — nêu rõ cảnh nào cần quay lại…"/>}
      <div className="flex gap-2 items-center">
        {!rejecting
          ? <><Btn variant="danger" onClick={()=>setRejecting(true)}>Trả về Sales</Btn><Btn variant="ok" className="flex-1" onClick={doDone}>Hoàn tất nghiệm thu · {fmtVND(total)}</Btn></>
          : <><Btn variant="ghost" onClick={()=>setRejecting(false)}>Huỷ</Btn><Btn variant="danger" className="flex-1" disabled={!reason.trim()} onClick={doReject}>Xác nhận trả về</Btn></>}
      </div>
    </div>
    <SampleModal shot={sampleShot} onClose={()=>setSampleShot(null)}/>
    {preview && <div className="fixed inset-0 z-40 bg-black/70 flex items-center justify-center p-4" onClick={()=>setPreview(null)}>
      <div className="bg-white rounded-2xl overflow-hidden max-w-2xl w-full" onClick={e=>e.stopPropagation()}>
        <div className="aspect-video"><MediaView m={preview}/></div>
        <div className="p-3 flex justify-between items-center">
          <div className="flex gap-1.5 flex-wrap">
            <Btn variant={rate[preview.id]===0?'danger':'ghost'} onClick={()=>setSrc(preview.id,0)}>✗ Loại</Btn>
            {FILM_LEVELS.map(l=><Btn key={l.v} variant={Number(rate[preview.id])===l.v?'ok':'ghost'} onClick={()=>setSrc(preview.id,l.v)}>{l.ten}</Btn>)}
          </div>
          <Btn variant="ghost" onClick={()=>setPreview(null)}>Đóng</Btn>
        </div>
      </div>
    </div>}
  </div>;
}

/* ---- ADMIN / KẾ TOÁN ---- */
function AdminFilming(){
  const { db } = useApp();
  const [from,setFrom]=useState(''); const [to,setTo]=useState(''); const [fSt,setFSt]=useState('');
  const projects = (db.project_filmings||[]).filter(p=> inRangeOrAllG(p.created_at,from,to) && (!fSt||p.trang_thai===fSt)).sort(byDateDesc);
  const projLv = (p,v)=> (p.uploads||[]).filter(u=>u.dat_item===true && filmSrcLevel(u)===v).length;
  // thống kê tính tiền theo mức của từng source (trên các công trình đang lọc)
  const lvStats = FILM_LEVELS.map(l=>{ const n=projects.reduce((s,p)=>s+projLv(p,l.v),0); return { ...l, n, money:n*filmLevelPrice(l.v, db.pricing) }; });
  const okTotalMoney = projects.filter(p=>p.trang_thai===ST.DAT||p.trang_thai===ST.DA_CHI).reduce((s,p)=>s+(p.thanh_tien||0),0);
  const okSrcTotal = lvStats.reduce((s,l)=>s+l.n,0);
  const exportCSV = () => {
    const r=[['Ngày','Sales','Công trình','Hệ SP','Khu vực','Cảnh đạt','Tổng cảnh','Tạm ổn','Chuẩn','Đẹp','Trạng thái','Thành tiền']];
    projects.forEach(p=>{ const t=filmFindTpl(db,p.template_id); const sales=db.users.find(u=>u.id===p.sales_id); r.push([fmtDay(p.created_at),sales?.ho_ten||'—',p.ten_cong_trinh,t?.he_san_pham,p.khu_vuc,uniqShots(p.uploads).length,filmCountShots(t),projLv(p,1),projLv(p,2),projLv(p,3),ST_LABEL[p.trang_thai],p.thanh_tien]); });
    download('QUAY_CONG_TRINH.csv', toCSV(r));
  };
  return <div className="space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <h2 className="font-display text-lg font-bold text-ink">🎬 Báo cáo Quay công trình</h2>
      <Btn variant="brand" onClick={exportCSV}>⬆ Xuất Excel</Btn>
    </div>
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <Stat label="Tổng tiền đã nghiệm thu" value={fmtVND(okTotalMoney)} sub={okSrcTotal+' source đạt'} color="text-emerald-600"/>
      {lvStats.map(l=><Stat key={l.v} label={l.ten+' · '+fmtVND(filmLevelPrice(l.v,db.pricing))} value={l.n+' source'} sub={fmtVND(l.money)} color="text-brand-dark"/>)}
    </div>
    <div className="bg-white rounded-2xl border border-line shadow-card p-3 flex flex-wrap gap-2 items-center">
      <DateRange from={from} to={to} setFrom={setFrom} setTo={setTo}/>
      <Select value={fSt} onChange={e=>setFSt(e.target.value)} className="max-w-[160px]"><option value="">Mọi trạng thái</option>{Object.keys(ST_LABEL).map(s=><option key={s} value={s}>{ST_LABEL[s]}</option>)}</Select>
    </div>
    <div className="bg-white rounded-2xl border border-line shadow-card overflow-auto">
      <table className="w-full text-sm min-w-[760px]">
        <thead className="bg-slate-50/70 text-[11px] font-semibold uppercase tracking-wide text-ink-muted text-left"><tr><Th>Ngày</Th><Th>Sales</Th><Th>Công trình</Th><Th>Hệ SP / Quy trình</Th><Th>Khu vực</Th><Th r>Cảnh đạt</Th><Th r>Mức source (Ổn·Chuẩn·Đẹp)</Th><Th>Trạng thái</Th><Th r>Thành tiền</Th></tr></thead>
        <tbody className="divide-y">
          {projects.length===0 ? <tr><td colSpan="9"><Empty>Không có dữ liệu.</Empty></td></tr> :
            projects.map(p=>{ const t=filmFindTpl(db,p.template_id); const sales=db.users.find(u=>u.id===p.sales_id);
              return <tr key={p.id} className="hover:bg-slate-50">
                <Td>{fmtDay(p.created_at)}</Td><Td>{sales?.ho_ten||'—'}</Td><Td>{p.ten_cong_trinh}</Td>
                <Td><span className="text-brand-dark text-xs font-medium">{t?.he_san_pham}</span></Td><Td>{p.khu_vuc}</Td>
                <Td r>{uniqShots(p.uploads).length}/{filmCountShots(t)}</Td>
                <Td r><span className="tabular-nums text-xs">{FILM_LEVELS.map((l,i)=><span key={l.v}>{i>0?' · ':''}<b className={projLv(p,l.v)?'text-ink':'text-slate-300'}>{projLv(p,l.v)}</b></span>)}</span></Td>
                <Td><Badge st={p.trang_thai}/></Td><Td r><b>{p.thanh_tien?fmtVND(p.thanh_tien):'—'}</b></Td>
              </tr>; })}
        </tbody>
      </table>
    </div>
    <div className="text-[11px] text-slate-400">Việc chi tiền gộp chung ở <b>Bảng lương</b> (cột <b className="text-brand-dark">Tiền quay</b>).</div>
  </div>;
}
function inRangeOrAllG(iso,f,t){ if(!f&&!t) return true; return inRange(iso,f,t); }

/* ============================================================
   21. ROOT
============================================================ */
function Root(){
  const { me, loading } = useApp();
  if(loading) return <div className="min-h-screen flex items-center justify-center bg-ink text-white/70 text-sm">Đang tải…</div>;
  return me ? <Shell/> : <Login/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(
  <AppProvider><Root/></AppProvider>
);
</script>
<script>
  // Tự biên dịch JSX với classic runtime (React.createElement) — tránh lỗi import "react/jsx-runtime"
  window.addEventListener('DOMContentLoaded', function(){
    try {
      var src = document.getElementById('app-src').textContent;
      var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
      new Function(out)();
    } catch (e) {
      document.getElementById('root').innerHTML =
        '<pre style="padding:16px;color:#b91c1c;white-space:pre-wrap;font:13px/1.5 monospace">Lỗi khởi tạo app:\n' +
        String(e && e.stack ? e.stack : e).replace(/</g,'&lt;') + '</pre>';
      console.error(e);
    }
  });
</script>
